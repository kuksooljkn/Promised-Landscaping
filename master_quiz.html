{src:"STUDY",cat:"SFM: Medical Aid",q:"SFM Section XXI: What must be obtained from the hospital before booking a prisoner who was injured after arrest?",opts:["A doctor's statement","A medical release","A medical clearance form signed by the DA","A discharge summary"],correct:1,fb:"SFM Section XXI: Obtain a MEDICAL RELEASE from the hospital BEFORE BOOKING the prisoner who became ill or sustained injury after arrest."},
{src:"STUDY",cat:"SFM: Medical Aid",q:"SFM Section XXI: This agency's policy regarding transportation of sick or injured persons is:",opts:["Officers may transport at discretion","This agency PROHIBITS transportation of sick or injured persons and/or prisoners except under extreme circumstances — have an ambulance dispatched unless immediate transportation is vital to save a life","Officers must transport all injured persons","Transportation is required only for prisoners"],correct:1,fb:"SFM Section XXI: Officers are reminded that this agency PROHIBITS TRANSPORTATION of sick or injured persons and/or prisoners EXCEPT UNDER EXTREME CIRCUMSTANCES. Officers shall have an ambulance dispatched unless IMMEDIATE TRANSPORTATION IS VITAL TO SAVE A LIFE."},
{src:"STUDY",cat:"SFM: Medical Aid",q:"SFM Section XXI: If a Medic Alert emblem is found on an unconscious victim, what must the officer do?",opts:["Remove the emblem and transport it","Communicate vital information on it to the dispatcher for relay to medical responders","Contact the Medic Alert company directly","Only note it in the report"],correct:1,fb:"SFM Section XXI: If a MEDIC ALERT emblem, EMERGENCY ALERT symbol, or 'VIAL OF LIFE'/'SAVE A LIFE' notification is present, COMMUNICATE THE VITAL INFORMATION to the DISPATCHER for relay to medical responders."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — MISSING PERSONS (Section XXII)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Missing Persons",q:"SFM Section XXII: When a missing person is found, what are the FIVE required actions?",opts:["Just cancel BOLO and complete supplement","Arrange medical treatment if necessary, cancel BOLO, prepare supplemental report, note names of persons harboring/sheltering a missing child or runaway, and cancel the computer entry","Only cancel computer entry and notify family","File supplement and transfer to detectives only"],correct:1,fb:"SFM Section XXII: When a missing person is found: (a) Arrange for medical treatment if necessary, (b) CANCEL THE BOLO, (c) Prepare a SUPPLEMENTAL REPORT, (d) Note names of persons HARBORING OR SHELTERING a missing child or runaway, (e) CANCEL THE COMPUTER ENTRY."},
{src:"STUDY",cat:"SFM: Missing Persons",q:"SFM Section XXII: For a missing juvenile where foul play or abduction is SUSPECTED, who must be notified and what must be established?",opts:["Only detectives","On-Call staff supervisor and detectives; establish a search command post if needed; assign officer to remain with family; devise quadrant search system","Patrol supervisor only","FBI and DA's office immediately"],correct:1,fb:"SFM Section XXII: If foul play or abduction is suspected: notify ON-CALL STAFF SUPERVISOR AND DETECTIVES, establish a SEARCH COMMAND POST if needed, assign an officer to remain with the FAMILY to maintain communication, and devise a QUADRANT SYSTEM to coordinate officers and civilians in specific areas."},
{src:"STUDY",cat:"SFM: Missing Persons",q:"SFM Section XXII: What three forms must be completed for a missing persons offense report?",opts:["CR-3, DIC-24, and booking sheet","Missing Persons Report (Adult/white - Juvenile/pink), Medical Information Release Form, and Juvenile Authorization Form","Offense report and missing persons report only","NCIC entry form, photo form, and supplemental only"],correct:1,fb:"SFM Section XXII: Complete: Missing Persons Report (Adult/white — Juvenile/pink), Medical Information Release Form, and Juvenile Authorization Form. Also document any mental/physical impairment and any suspected abduction."},
{src:"STUDY",cat:"SFM: Missing Persons",q:"SFM Section XXII: What medical records may need to be obtained if the missing person status is confirmed for certain individuals?",opts:["Emergency contacts only","Dental records or fingerprints of the missing person, if appropriate","Only blood type","Only photographs"],correct:1,fb:"SFM Section XXII: OBTAIN DENTAL RECORDS OR FINGERPRINTS of the missing person, if appropriate. Also contact local hospitals to ascertain any injured or deceased persons meeting the description."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — SEARCHES AND SEIZURES (Section XXIII)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Searches & Seizures",q:"SFM Section XXIII: For a consent search, what three conditions must be verified?",opts:["The person appears cooperative and the search is urgent","The person has authority to give consent, gave it voluntarily, and written consent must be obtained","Supervisor must be present","Probable cause must also exist"],correct:1,fb:"SFM Section XXIII: Consent search requirements: (a) The person giving consent HAS THE AUTHORITY to do so, (b) The person gave it VOLUNTARILY, (c) OBTAIN WRITTEN CONSENT. Discontinue immediately if the authorizing person withdraws consent."},
{src:"STUDY",cat:"SFM: Searches & Seizures",q:"SFM Section XXIII: How must a search warrant affidavit be served?",opts:["Without attachments","With a copy of the affidavit attached","With the original affidavit attached","Only the warrant — no affidavit needed"],correct:1,fb:"SFM Section XXIII: Serve the warrant WITH A COPY OF THE AFFIDAVIT ATTACHED. Also announce your presence and purpose and await a reasonable interval before entering; if entry is refused, enter forcefully."},
{src:"STUDY",cat:"SFM: Searches & Seizures",q:"SFM Section XXIII: After executing a search warrant, within how many hours must it be returned to the court?",opts:["24 hours","48 hours","72 hours","7 days"],correct:2,fb:"SFM Section XXIII: Return the warrant, affidavit, and inventory to the court within the TIME CONSTRAINTS IMPOSED (72 HOURS). Also leave a copy of the warrant and inventory of seized property at the location."},
{src:"STUDY",cat:"SFM: Searches & Seizures",q:"SFM Section XXIII: When conducting a strip search, what conditions must be met?",opts:["Any officer may conduct it anywhere","SAME SEX persons must conduct it in a PRIVATE location","Two officers must be present regardless of gender","Supervisor must be present and authorize"],correct:1,fb:"SFM Section XXIII: If a strip search is necessary, have SAME SEX PERSONS conduct it in a PRIVATE LOCATION. For a body-cavity search, it must be performed under private circumstances under the supervision of a medically-trained professional at a County jail facility."},
{src:"STUDY",cat:"SFM: Searches & Seizures",q:"SFM Section XXIII: What must a search warrant affidavit include?",opts:["Officer's name and badge number only","A description of the place/thing/person to be searched, the things to be searched for, and a sufficient narrative showing probable cause based on material facts","The suspect's criminal history","Only the probable cause statement"],correct:1,fb:"SFM Section XXIII: Affidavit must include: (a) Description of place/thing/person to be searched, (b) The things to be searched for, (c) A SUFFICIENT NARRATIVE showing PROBABLE CAUSE based on MATERIAL FACTS. If supported by informant info, also show reliability of informant and information."},
{src:"STUDY",cat:"SFM: Searches & Seizures",q:"SFM Section XXIII: When searching incident to an arrest, what is the scope and timing requirement?",opts:["Full search of the vehicle and all occupants","Search the suspect, articles carried, and immediate surroundings; conducted as soon as practical after arrest and reasonably at or near the place of arrest","Only a pat-down is allowed","Full search allowed only at the jail"],correct:1,fb:"SFM Section XXIII: When searching incident to an arrest: (a) Search the suspect, articles carried, and the suspect's IMMEDIATE SURROUNDINGS, (b) Conduct IT AS SOON AS PRACTICAL after the arrest, (c) Conduct it REASONABLY AT OR NEAR THE PLACE OF ARREST."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — TACTICAL DEPLOYMENTS (Section XXIV)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Tactical Deployments",q:"SFM Section XXIV: The Field Manual identifies four phases of high-risk incidents. What are they in order?",opts:["Response, containment, negotiation, assault","Initial response (committing resources), deployment (isolating/containing threat), negotiation (encouraging surrender), and resolution (capture/surrender/injury/death of suspect)","Arrival, staging, assault, clearing","Response, entry, negotiation, arrest"],correct:1,fb:"SFM Section XXIV: Four phases: (1) INITIAL RESPONSE — committing agency resources, (2) DEPLOYMENT — isolating and containing the threat, (3) NEGOTIATION — encouraging suspect(s) to surrender, (4) RESOLUTION — ending the incident through capture, surrender, injury, or death of suspect."},
{src:"STUDY",cat:"SFM: Tactical Deployments",q:"SFM Section XXIV: At a hostage incident, what must NEVER be agreed to in preliminary communication with offenders?",opts:["Releasing the hostages","Supplying offenders with weapons, providing additional hostages, or exchanging hostages","Allowing medical care for hostages","Providing food or water"],correct:1,fb:"SFM Section XXIV: In preliminary communication, NO AGREEMENT is to be made to either SUPPLY OFFENDERS WITH WEAPONS, PROVIDE ADDITIONAL HOSTAGES, OR EXCHANGE HOSTAGES."},
{src:"STUDY",cat:"SFM: Tactical Deployments",q:"SFM Section XXIV: When released hostages are escorted to safety, what three actions follow?",opts:["Transport to jail and file charges","Escort to safe area, summon medical assistance if necessary, and debrief them — designate a location for interviewing hostages and witnesses","Release them immediately","Only photograph and document"],correct:1,fb:"SFM Section XXIV: If any hostages are released: (1) ESCORT TO A SAFE AREA, (2) SUMMON MEDICAL ASSISTANCE if necessary, (3) DEBRIEF THEM. Also designate a location for interviewing hostages and witnesses."},
{src:"STUDY",cat:"SFM: Tactical Deployments",q:"SFM Section XXIV: At a tactical deployment, what information must be obtained from witnesses/victims about the building containing the suspect?",opts:["Only the building address","Identity of suspect(s) AND information on the building to construct a floor plan including stairs, windows, exits, and roof entry","Only the number of people inside","Only the type of structure"],correct:1,fb:"SFM Section XXIV: Interview witnesses or victims to: (a) Establish the IDENTITY OF THE SUSPECT(S), (b) Obtain INFORMATION ON THE BUILDING — construct a floor plan including stairs, windows, exits, and ROOF ENTRY."},
{src:"STUDY",cat:"SFM: Tactical Deployments",q:"SFM Section XXIV: At a tactical deployment, what communications must be established or arranged from the command post?",opts:["Radio only","Recording of all communications between offender and police; telephone company interruption of offender's service if necessary; and a direct line between police and offender","Secure radio only","Public address system"],correct:1,fb:"SFM Section XXIV: Establish communication through telephone or other means once hostage-takers are isolated. Arrange RECORDING OF ALL COMMUNICATIONS between offender and police. If necessary, contact telephone company to INTERRUPT OFFENDER'S SERVICE and establish a DIRECT LINE between police and offender."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — TRAFFIC STOPS (Section XXV)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Traffic Stops",q:"SFM Section XXV: What are the five special-status violators who require specific law enforcement actions?",opts:["Minors, seniors, foreigners, military, and clergy","Juveniles, non-residents (for minor violations), military members, people with diplomatic immunity, members of the state legislature (when in session), and members of Congress","Only diplomatic immunity holders and legislators","Juveniles and diplomats only"],correct:1,fb:"SFM Section XXV: Special status violators requiring specific actions: JUVENILES, NON-RESIDENTS (for non-hazardous minor violations), MILITARY MEMBERS, PEOPLE WITH DIPLOMATIC IMMUNITY, MEMBERS OF THE STATE LEGISLATURE (when in session), and MEMBERS OF CONGRESS."},
{src:"STUDY",cat:"SFM: Traffic Stops",q:"SFM Section XXV: Before a felony or high-risk stop, what three pieces of information must be provided to the dispatcher?",opts:["Location, plate, and reason","Suspect's description, vehicle description, and direction of travel and location","License plate, direction, and speed","Suspect ID, weapon type, and backup needed"],correct:1,fb:"SFM Section XXV: Before stopping the violator in a high-risk stop, notify dispatcher of: (a) SUSPECT'S DESCRIPTION, (b) VEHICLE DESCRIPTION, (c) DIRECTION OF TRAVEL AND LOCATION."},
{src:"STUDY",cat:"SFM: Traffic Stops",q:"SFM Section XXV: Per SFM Section XXV, what is the minimum the officer must tell the dispatcher before conducting a routine traffic stop?",opts:["Plate number only","Location of the stop AND the vehicle license number and description","Location only","Officer ID and car number"],correct:1,fb:"SFM Section XXV: Before a traffic stop, properly tell dispatcher: (a) The LOCATION OF THE STOP, (b) The VEHICLE LICENSE NUMBER AND DESCRIPTION."},
{src:"STUDY",cat:"SFM: Traffic Stops",q:"SFM Section XXV: During a felony/high-risk stop, what standard applies for the 'minimum legal justification'?",opts:["Probable cause for a felony only","Reasonable suspicion (at least) that the traffic law violator was armed, dangerous, or a felon","Proof beyond a reasonable doubt","A warrant must be in hand"],correct:1,fb:"SFM Section XXV: For a felony or high-risk stop, REASONABLE SUSPICION (at least) must exist to believe that the traffic law violator was armed, dangerous, or a felon."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — TRANSPORTS (Section XXVI)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Transports",q:"SFM Section XXVI: For an appropriate prisoner transport vehicle, what FOUR features must be present?",opts:["Cage, air conditioning, radio, and fire extinguisher","A securely-situated undamaged security screen, rear seat detachable for ease of searching, appropriate seat restraints in place and operable, and inside rear door and window controls inoperable","Only a cage and handcuff bar","Lockbox, lights, siren, and cage"],correct:1,fb:"SFM Section XXVI: Transport vehicles must have: (1) Securely-situated UNDAMAGED SECURITY SCREEN, (2) REAR SEAT DETACHABLE for ease of searching, (3) APPROPRIATE SEAT RESTRAINTS in place and operable, (4) INSIDE REAR DOOR AND WINDOW CONTROLS INOPERABLE."},
{src:"STUDY",cat:"SFM: Transports",q:"SFM Section XXVI: Where must a single prisoner be placed in a transport vehicle?",opts:["Front passenger seat","Rear seat, driver's side","Rear seat, PASSENGER SIDE","Center rear seat"],correct:2,fb:"SFM Section XXVI: If transporting a SINGLE prisoner, place him/her on REAR SEAT, PASSENGER SIDE. If transporting more than one prisoner, place them on rear seat if possible. Secure prisoners with seat belts."},
{src:"STUDY",cat:"SFM: Transports",q:"SFM Section XXVI: During prisoner transport, when are officers permitted to stop to provide law enforcement services?",opts:["Never — transport must continue directly","Only when: immediate action is required to save a victim from harm, immediate action is required to attend to an injured victim, or at a crime-in-progress where safety demands immediate apprehension","Any time the officer believes it is necessary","With supervisor approval only"],correct:1,fb:"SFM Section XXVI: Officers shall NOT stop to provide law enforcement services EXCEPT: (a) When IMMEDIATE ACTION IS REQUIRED TO SAVE A VICTIM FROM HARM, (b) When immediate action is required to ATTEND TO AN INJURED VICTIM, (c) At a CRIME-IN-PROGRESS where safety demands immediate apprehension."},
{src:"STUDY",cat:"SFM: Transports",q:"SFM Section XXVI: When transporting a juvenile, what three requirements apply?",opts:["Juveniles may be transported with adults if supervised","Do not transport with adult arrestees; do not place in holding cell with adult arrestees; and ensure any jail or holding cell used is certified for juvenile offenders","Transport in front seat with officer","Require parental consent before transport"],correct:1,fb:"SFM Section XXVI: When transporting a juvenile: (a) DO NOT transport in company with an ADULT ARRESTEE, (b) DO NOT place in a holding cell or lock-up with an adult arrestee, (c) Ensure any jail or holding cell is CERTIFIED FOR JUVENILE OFFENDERS."},
{src:"STUDY",cat:"SFM: Transports",q:"SFM Section XXVI: What must be done to the vehicle AFTER transporting any prisoner?",opts:["Nothing — complete the report","Search the rear of the vehicle for CONTRABAND OR EVIDENCE after transporting any prisoner","Refuel and report to supervisor","Photograph the vehicle for documentation"],correct:1,fb:"SFM Section XXVI: After transporting any prisoner, SEARCH THE REAR OF THE VEHICLE for CONTRABAND OR EVIDENCE."},
{src:"STUDY",cat:"SFM: Transports",q:"SFM Section XXVI: What information must be provided to dispatch before beginning prisoner transport?",opts:["Prisoner name only","Identity of prisoner, destination, time and beginning mileage, AND time and ending mileage at destination","Starting location and reason only","Prisoner ID and cuffing status"],correct:1,fb:"SFM Section XXVI: Advise dispatch of: (a) IDENTITY OF PRISONER, (b) DESTINATION, (c) TIME AND BEGINNING MILEAGE, (d) TIME AND ENDING MILEAGE at destination."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — USE OF FORCE (Section XXVII)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Use of Force",q:"SFM Section XXVII: What is the order of non-deadly force techniques from least to most force per the Field Manual?",opts:["Physical control, verbal control, chemical agents, baton","Verbal control → compliance techniques (hands/feet/knees/control holds) → electronic stunning devices → chemical agents (Capsun) → Asp baton or PR-24","Baton, OC spray, Taser, verbal","Warning shot, baton, Taser, physical"],correct:1,fb:"SFM Section XXVII: Non-deadly force progression: (1) VERBAL CONTROL, (2) COMPLIANCE TECHNIQUES (hands, feet, knees, control holds/come-alongs), (3) ELECTRONIC STUNNING DEVICES, (4) CHEMICAL AGENTS (Capsun), (5) ASP BATON OR PR-24."},
{src:"STUDY",cat:"SFM: Use of Force",q:"SFM Section XXVII: What deadly force methods are sanctioned by the agency?",opts:["Firearms only","Firearms, carotid-control or other neck holds, and stationary roadblocks (if authorized) to stop a fleeing suspect in a motor vehicle","Any method approved by the supervisor","Firearms and Taser at max setting"],correct:1,fb:"SFM Section XXVII: Deadly force methods sanctioned by the agency: USE OF FIREARMS, APPLICATION OF CAROTID-CONTROL OR OTHER NECK HOLDS, and USE OF STATIONARY ROADBLOCKS (if authorized) to stop a suspect fleeing by motor vehicle."},
{src:"STUDY",cat:"SFM: Use of Force",q:"SFM Section XXVII: Deadly force is justified when the officer reasonably believes what?",opts:["The suspect is armed only","An immediate threat of death or serious bodily harm exists OR a fleeing felon poses a severe threat to human life","Any felony is being committed","The suspect refuses repeated verbal commands"],correct:1,fb:"SFM Section XXVII: Deadly force is justified when: (1) Officer reasonably believes an IMMEDIATE THREAT OF DEATH OR SERIOUS BODILY HARM exists, OR (2) Officer has probable cause to believe a FLEEING FELON POSES A SEVERE THREAT TO HUMAN LIFE."},
{src:"STUDY",cat:"SFM: Use of Force",q:"SFM Section XXVII: After a use of force incident, which entities must be notified or completed as follow-up?",opts:["Supervisor only","On-Call Supervisor notified, Harris County D.A. Shooting Team advised, Use of Force Report completed, and psychological follow-up conducted if deadly force was used","Only a Use of Force Report is needed","DA and media only"],correct:1,fb:"SFM Section XXVII: Post-force: (1) On-Call Supervisor notified, (2) Harris County D.A. Shooting Team advised, (3) Use of Force Report completed, (4) If a firearm was used — processed as evidence, (5) Psychological follow-up conducted with officers who employed deadly force."},
{src:"STUDY",cat:"SFM: Use of Force",q:"SFM Section XXVII: Under what two justified uses does the department authorize application of force?",opts:["Only self-defense","A) To prevent escape from custody, make an arrest, or investigative detention of a person the officer believes committed a crime; OR B) To defend himself/herself or another from what the officer believes is the use of force while lawfully taking custody","Only when in immediate danger","Any situation involving a known felon"],correct:1,fb:"SFM Section XXVII: Force is justified only when the officer reasonably believes it is necessary: (A) To prevent escape, make an arrest, or investigative detention of a person the officer believes committed a crime, OR (B) To defend himself/herself or another from what the officer believes is force being used while lawfully taking custody."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — USE OF FORCE: POST-SHOOTING (Section XXVIII)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Post-Shooting Procedures",q:"SFM Section XXVIII: Following an officer-involved shooting, if a deputy is NOT injured, where must they be placed?",opts:["Returned to patrol immediately","Removed to a secured setting and isolated from media, uninvolved deputies, and curious bystanders to await investigative teams","Transported to the hospital for evaluation","Released from duty pending investigation"],correct:1,fb:"SFM Section XXVIII: If the deputy involved is NOT injured, ensure they have been REMOVED TO A SECURED SETTING and ISOLATED from the media, uninvolved deputies, and curious bystanders to await the investigative teams. All involved deputies and witnesses are SEPARATED and instructed NOT to discuss the incident."},
{src:"STUDY",cat:"SFM: Post-Shooting Procedures",q:"SFM Section XXVIII: After a post-shooting, when may department personnel give interviews or written statements?",opts:["Immediately after the scene is secure","Only after being authorized by the Internal Affairs Division, Chief Deputy, or the Constable","After 24 hours","Only after consulting a personal attorney"],correct:1,fb:"SFM Section XXVIII: Ensure that department personnel are NOT INTERVIEWED or allowed to give WRITTEN STATEMENTS until authorized by the INTERNAL AFFAIRS DIVISION, CHIEF DEPUTY, or THE CONSTABLE."},
{src:"STUDY",cat:"SFM: Post-Shooting Procedures",q:"SFM Section XXVIII: After an officer-involved shooting, what must be done with the involved deputy's weapon?",opts:["Immediately unload and return to the deputy","Locate and secure or secure in place the deputy's weapon and ammunition casings as evidence — do not tamper with after securing","Secure in the supervisor's vehicle","Send to the armorer immediately"],correct:1,fb:"SFM Section XXVIII: Locate and SECURE OR SECURE IN PLACE the deputy's weapon AND AMMUNITION CASINGS. Also locate and secure the suspect's weapon, ammunition, and expended casings. DO NOT OPEN, RELOAD, OR TAMPER with the involved firearms after secured."},
{src:"STUDY",cat:"SFM: Post-Shooting Procedures",q:"SFM Section XXVIII: Who is responsible for completing the initial report after a post-shooting incident?",opts:["The involved deputy","The on-duty supervisor","A SECONDARY UNIT — other than the deputy or deputies involved","The Internal Affairs investigator"],correct:2,fb:"SFM Section XXVIII: Ensure that a SECONDARY UNIT OTHER THAN THE DEPUTY OR DEPUTIES INVOLVED is assigned to complete the INITIAL REPORT."},
{src:"STUDY",cat:"SFM: Post-Shooting Procedures",q:"SFM Section XXVIII: What is the chain of notification required after an officer-involved shooting?",opts:["Supervisor, then DA only","Assistant Chief Deputy over involved deputies, Chief Deputy, Captain in charge of the HCCO Pct. 4 Shooting Team, HCSO Watch Command, and Harris County District Attorney Shooting Team","Only the Chief Deputy and DA","Supervisor and FBI"],correct:1,fb:"SFM Section XXVIII: Notifications must include: (a) ASSISTANT CHIEF DEPUTY over involved deputies, (b) CHIEF DEPUTY if not contacted by Asst. Chief, (c) CAPTAIN in charge of HCCO Pct. 4 Shooting Team, (d) HCSO WATCH COMMAND and any appropriate law enforcement agency, (e) HARRIS COUNTY DISTRICT ATTORNEY — Shooting Team (Call D.A. Intake)."},
{src:"STUDY",cat:"SFM: Post-Shooting Procedures",q:"SFM Section XXVIII: When an injured deputy is being transported, what must happen regarding family notification?",opts:["Family will be notified by phone after the deputy is stabilized","A staff member (Lieutenant or higher) arranges in-person family notification; the deputy's name is NOT released to media before family notification; and the family is provided transportation to the hospital if needed","The media may report the name after the hospital notifies the family","Family is notified by dispatch"],correct:1,fb:"SFM Section XXVIII: Contact a STAFF MEMBER (Lieutenant or higher) for FAMILY NOTIFICATION — IN PERSON when possible. Provide TRANSPORTATION TO THE HOSPITAL for the family if needed. Ensure the deputy's name is NOT RELEASED TO MEDIA OR OTHER UNAUTHORIZED PERSONS before family is notified."},
{src:"STUDY",cat:"SFM: Post-Shooting Procedures",q:"SFM Section XXVIII: After a non-injury or animal discharge of weapon, what must be photographed?",opts:["Only the weapon","The incident scene must be photographed by a department Crime Scene Photographer","Only the animal if applicable","No photography required for non-injury discharges"],correct:1,fb:"SFM Section XXVIII: After any firearm discharge (including non-injury or animal): the INCIDENT SCENE must be PHOTOGRAPHED by a department CRIME SCENE PHOTOGRAPHER. Also notify chain of command, HCCO Pct. 4 Shooting Team, Harris County Animal Control if animal involved."},

// ═══════════════════════════════════════════════
// ADDITIONAL ORAL BOARD / SCENARIO QUESTIONS (Supervisor Field Manual topics)
// ═══════════════════════════════════════════════
{src:"ORB",cat:"SFM: Bomb Threats",q:"You arrive at a school with a bomb threat. The principal wants to search the building himself with staff. What do you advise him?",opts:["Allow it — they know the building best","Advise against it; if a search is authorized by the staff supervisor, YOU designate search teams (including knowledgeable employees if willing), brief them on NO radios, NO smoking, NOT touching suspicious objects, and avoiding turning lights on or off","Allow the principal to search — you secure the perimeter only","Have him search while you set up command post"],correct:1,fb:"SFM Section IV: If the staff supervisor authorizes a search, designate search teams (including knowledgeable residents or employees if willing), review a floor plan, coordinate teams, and instruct them: (1) NO radios, (2) No smoking, (3) Do not touch suspicious objects but note location, (4) Avoid turning lights on or off. Have canine assist."},
{src:"ORB",cat:"SFM: Communicable Diseases",q:"A deputy handles a bleeding prisoner without gloves. What are the supervisor's obligations?",opts:["Only document the incident","Ensure the deputy immediately begins decontamination, seeks medical attention, completes a comprehensive Workers' Comp report, has the prisoner transported separately, and is evaluated for possible exposure at an appropriate facility","Advise the deputy to wash hands and continue","Only file an incident report"],correct:1,fb:"SFM Section VII: If skin contact with body fluids occurred: begin disinfection procedures, cover any open cuts with waterproof bandages before resuming duty. Seek medical attention. Complete comprehensive report including Workers' Comp forms. Any officer exposed to body fluids should be IMMEDIATELY TRANSPORTED to an appropriate facility for medical evaluation."},
{src:"ORB",cat:"SFM: Death Investigations",q:"You respond to what appears to be a natural death. The family is present and the deceased's doctor is known. Walk me through your steps.",opts:["Take photos and call the funeral home directly","Secure the scene; obtain all medical history info/attending physician; arrange through ME for physician to sign death certificate; obtain next of kin info and preferred funeral home; arrange body transport through ME; notify supervisor; complete investigative report","Call ME immediately without any scene investigation","File a report and leave scene to family"],correct:1,fb:"SFM Section IX: Apparent natural death procedure: obtain all info on deceased (medical history, attending physician), arrange through ME for physician to sign death certificate, obtain next of kin info and preferred funeral home, arrange through ME for body transportation, notify next of kin (supervisor's responsibility), complete investigative report."},
{src:"ORB",cat:"SFM: Disasters",q:"You are the supervisor at the scene of a major chemical tanker accident. Flames are visible and vapors are drifting toward a residential area. Walk me through your immediate actions.",opts:["Wait for fire department — this is their scene","Approach upwind; contact HAZMAT officer, OEM, and fire department; summon back-up for perimeter; set up roadblocks; instruct personnel to avoid liquids/fumes; eliminate ignition sources; assist fire department in establishing command post; evacuate area; contact Harris County OEM at 713-881-3100","Call the chemical company and wait","Get as much info as possible from the driver before evacuating"],correct:1,fb:"SFM Section XIX: First-responder steps: Contact dept. staff supervisor, HAZMAT Officer, and fire department. Quickly examine scene for leaking vapor/liquid. Summon back-up for perimeter. Set up roadblocks/barricades. Instruct personnel to avoid contact with liquids/fumes. Eliminate ignition sources. No eating/drinking/smoking. Assist Fire Dept. IC in establishing command post. Evacuate and detain as necessary. Contact OEM at 713-881-3100 (daytime) or HCSO dispatch 713-221-6000 (nighttime)."},
{src:"ORB",cat:"SFM: Tactical Deployments",q:"You are first on scene of a barricaded subject with a firearm. Your corporal wants to make entry immediately. What do you do?",opts:["Authorize entry — speed is critical","Deny entry; assess high-risk potential and advise dispatch; establish clear radio frequency; notify On-Call supervisor; form primary perimeter to isolate the scene; evacuate bystanders; interview witnesses; establish safe entry routes/staging area; establish command post; request ERT/SWAT; relinquish command to watch commander","Let the corporal decide — he's on scene","Tell dispatch to contact SWAT and wait with no other action"],correct:1,fb:"SFM Section XXIV: Initial response: assess, advise dispatch, establish clear radio frequency, notify On-Call supervisor, primary perimeter to isolate, evacuate bystanders, interview witnesses for suspect ID and building layout, establish safe entry routes and staging area, establish command post (with press liaison and intelligence officer), request ERT/SWAT call-out, brief officers on firearms discipline, and relinquish command to watch commander with full briefing."},
{src:"ORB",cat:"SFM: Pursuits & Emergency Driving",q:"A deputy is in pursuit of a stolen vehicle. He tells you speeds are 70 mph and traffic is moderate. What factors do you evaluate and what authority do you have?",opts:["Let it continue indefinitely — he has probable cause","Evaluate: environmental and safety conditions (road surface, weather, traffic), seriousness of the offense, public safety risk; you may order the pursuit DISCONTINUED if conditions deteriorate or if you can identify the suspect; you must ensure dispatcher is monitoring; only the ASST. CHIEF may authorize a roadblock","Only supervisors above Captain can terminate pursuits","Continue pursuit until suspect stops or crashes"],correct:1,fb:"SFM Section XVII: Supervisor evaluates: environmental/safety conditions, traffic, speeds. If conditions create a severe hazard or the suspect can be identified, ORDER THE PURSUIT DISCONTINUED. Ensure dispatcher is: properly advising other units, keeping extraneous traffic to minimum, querying NCIC. Stationary or rolling roadblocks ONLY at direction of the ASSISTANT CHIEF OF PATROL. Document with Pursuit Form & Offense Report."},

// ═══════════════════════════════════════════════
// ADDITIONAL SOP & LAW QUESTIONS (Expanding the bank)
// ═══════════════════════════════════════════════
{src:"SOP",cat:"SOP 12.001 — Crash Reports",q:"SOP 12.001: For a FSGI or FSRA accident, within how many days must the crash be reported?",opts:["3 days","5 days","7 days","10 days"],correct:2,fb:"SFM Section II references SOP 12.001: A FSGI or FSRA accident reported within 7 DAYS still requires a crash report to be taken."},
{src:"LAW",cat:"Texas Law — DWI",q:"Under Chapter 724 of the Texas Transportation Code, in a crash with SBI or death, if the subject is deceased or unconscious, what is their legal status regarding blood specimen?",opts:["Consent must be obtained from family","They are deemed to have given consent and blood may be taken","A court order is required","Blood may only be drawn at the ME's office"],correct:1,fb:"SFM/Chapter 724 TTC: If the subject is deceased or unconscious, they are DEEMED TO HAVE GIVEN CONSENT and blood may be taken without a warrant."},
{src:"LAW",cat:"Texas Law — Arrests",q:"Article 14.06 subsection B of the Texas Code of Criminal Procedures covers which topic?",opts:["Magistrate's warning for adults","'Must Take Offenders Before Magistrate' — and the option to issue a citation in lieu of arrest/warrant for applicable offenses","Juvenile arrests","Out-of-county warrants"],correct:1,fb:"CCP Article 14.06(B): Covers the 'Must Take Offenders Before Magistrate' requirement and specifically allows a citation to be issued in lieu of a warrant/arrest when circumstances permit."},
{src:"LAW",cat:"Texas Law — Crash Reporting",q:"Which TxDOT instructional booklet provides the Classification of Motor Vehicle Traffic Crashes in Texas?",opts:["CR-100 2012 Edition","CR-80 2012 Edition","CR-102 2012 Edition","CR-3 Rev. 1/2010"],correct:2,fb:"CR-102 2012 Edition = Classification of Motor Vehicle Traffic Crashes in Texas. CR-100 = Instructions to Police Officers for Reporting Crashes. CR-80 = Vehicle Damage Guide for Traffic Crash Investigators."},
{src:"LAW",cat:"Texas Law — Domestic Violence",q:"The offense of stalking is found in which section of the Texas Penal Code?",opts:["Section 22.02","Section 42.072","Section 42.071","Section 38.15"],correct:2,fb:"SFM Section XV references Section 42.071 of the Texas Penal Code for the offense of stalking. Domestic assault is Chapter 22. Hindering an officer is 38.15."},
{src:"LAW",cat:"Texas Law — Domestic Violence",q:"Which article of the Texas Code of Criminal Procedures governs the Emergency Protective Order (EPO)?",opts:["Article 5.05","Article 15.27","Article 17.292","Article 14.06"],correct:2,fb:"SFM Section XV: Assist in obtaining an Emergency Protective Order per ARTICLE 17.292 of the Texas Code of Criminal Procedures."},
{src:"LAW",cat:"Texas Law — Domestic Violence",q:"Which article of the CCP requires officers to complete all documentation details in a family violence case?",opts:["Article 15.27","Article 5.05","Article 14.06","Article 17.292"],correct:1,fb:"SFM Section XV: Complete full offense including all details as described by the Code of Criminal Procedures, ARTICLE 5.05."},
{src:"LAW",cat:"Texas Law — Juveniles",q:"Article 15.27 of the Texas Code of Criminal Procedures requires what notification after a juvenile arrest?",opts:["DA notification","School notification","Court notification","Parent notification only"],correct:1,fb:"SFM Section III/Art. 15.27 CCP: Requires SCHOOL NOTIFICATION after a juvenile arrest. This is a mandatory step after arresting a juvenile."},
{src:"LAW",cat:"Texas Law — Search & Seizure",q:"Per SFM Section XXIII, under what doctrine may contraband in plain view be seized without a warrant?",opts:["Emergency doctrine","Inevitable discovery doctrine","Plain view doctrine","Exigent circumstances doctrine"],correct:2,fb:"SFM Section XXIII: Seize contraband, fruits, or instrumentalities of crime under the PLAIN VIEW DOCTRINE. This applies during both warrantless searches and warrant execution."},
{src:"SOP",cat:"SOP — DWI Forms",q:"In a DWI investigation, the DIC-23 is best described as:",opts:["The Statutory Warning form","The Notice of Suspension","The Peace Officer's Sworn Report (Probable Cause document)","The Mandatory Blood Specimen form"],correct:2,fb:"DIC-23 = DWI-PEACE OFFICER'S SWORN REPORT (the probable cause document). DIC-24 = Statutory Warning. DIC-25 = Notice of Suspension. THP-51 = Mandatory Blood Specimen."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"The CR-80 2012 Edition is used for what purpose in crash investigations?",opts:["Classifying types of crashes","Providing instructions to officers for reporting crashes","As a Vehicle Damage Guide for Traffic Crash Investigators","Documenting DWI-related crashes"],correct:2,fb:"CR-80 2012 Edition = VEHICLE DAMAGE GUIDE FOR TRAFFIC CRASH INVESTIGATORS. It assists officers in accurately describing and categorizing vehicle damage on crash reports."},
{src:"STUDY",cat:"SFM: Canine Use",q:"SFM Section V: To conduct a random sniff of objects in public places, what is required?",opts:["Probable cause","Reasonable suspicion","Supervisor authorization and consent of facility manager if possible","No justification needed for public places"],correct:2,fb:"SFM Section V: Authorize random sniffing of objects in PUBLIC PLACES if appropriate. Obtain CONSENT OF THE FACILITY MANAGER if possible. Avoid interference with the public."},
{src:"STUDY",cat:"SFM: Arrests",q:"SFM Section III: A suspect escapes from an officer during warrant execution. Beyond attempting apprehension, what administrative requirement applies?",opts:["No report needed unless the suspect causes harm","Complete an offense report documenting the escape","Notify DA within 48 hours","File a lost warrant report"],correct:1,fb:"SFM Section III: If the suspect escapes from custody, legally pursue and apprehend or try to apprehend, AND COMPLETE AN OFFENSE REPORT documenting the circumstances of the escape."},
{src:"STUDY",cat:"SFM: Civil Disturbance",q:"SFM Section VI: After a civil disturbance is defused, what is the required follow-up sequence?",opts:["File report and return to patrol","Debrief all participating personnel, interview witnesses and suspects, and document the incident comprehensively as soon as practicable","Hold a press conference and debrief","Inventory equipment and submit overtime reports"],correct:1,fb:"SFM Section VI: Follow-Up: (1) DEBRIEF all participating personnel, (2) INTERVIEW WITNESSES AND SUSPECTS, (3) DOCUMENT THE INCIDENT COMPREHENSIVELY as soon as practicable."},

// ─────────────────────────────────────────────────
// APP STATE & LOGIC
// ─────────────────────────────────────────────────
let quizQ=[],current=0,score=0,answered=false,results=[],selectedCats=new Set(),retryQ=[];
function getCatMap(){const m={};Q.forEach(q=>{if(!m[q.cat])m[q.cat]={count:0,src:q.src};m[q.cat].count++;});return m;}
function buildGrid(){document.getElementById('tc').textContent=Q.length;document.getElementById('topc').textContent=Object.keys(getCatMap()).length;renderGrid('','');}
function renderGrid(search,srcF){
  const grid=document.getElementById('cat-grid'),cats=getCatMap();grid.innerHTML='';
  Object.entries(cats).forEach(([cat,info])=>{
    const ms=!search||cat.toLowerCase().includes(search.toLowerCase()),mf=!srcF||info.src===srcF;
    if(!ms||!mf)return;
    const btn=document.createElement('button');
    btn.className='cat-btn'+(selectedCats.has(cat)?' selected':'');
    btn.innerHTML=`${cat}<div class="cat-info"><span class="count">${info.count} Q${info.count>1?'s':''}</span><span class="src-tag ${SRC_CSS[info.src]}">${info.src}</span></div>`;
    btn.onclick=()=>toggleCat(cat,btn);grid.appendChild(btn);
  });
}
function filterCats(){renderGrid(document.getElementById('cat-search').value,document.getElementById('src-filter').value);}
function toggleCat(cat,btn){if(selectedCats.has(cat)){selectedCats.delete(cat);btn.classList.remove('selected');}else{selectedCats.add(cat);btn.classList.add('selected');}updateSel();}
function updateSel(){const n=selectedCats.size;document.getElementById('selc').textContent=n;document.getElementById('start-sel').style.display=n>0?'inline-block':'none';}
function selectAll(){const s=document.getElementById('cat-search').value,f=document.getElementById('src-filter').value;Object.entries(getCatMap()).forEach(([cat,info])=>{if((!s||cat.toLowerCase().includes(s.toLowerCase()))&&(!f||info.src===f))selectedCats.add(cat);});renderGrid(s,f);updateSel();}
function clearAll(){selectedCats.clear();document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));updateSel();}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(mode){let pool=mode==='selected'?Q.filter(q=>selectedCats.has(q.cat)):[...Q];if(!pool.length){alert('No questions match your selection.');return;}quizQ=shuffle(pool);retryQ=quizQ;current=0;score=0;answered=false;results=[];show('quiz-screen');renderQ();}
function renderQ(){
  const q=quizQ[current],total=quizQ.length;
  document.getElementById('prog-fill').style.width=`${(current/total)*100}%`;
  document.getElementById('q-num').textContent=`Question ${current+1} of ${total}`;
  document.getElementById('q-src').textContent=SRC_LABELS[q.src]||q.src;
  document.getElementById('q-cat').textContent=q.cat;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('feedback-box').className='feedback-box';
  document.getElementById('feedback-box').innerHTML='';
  document.getElementById('action-row').innerHTML='';
  answered=false;
  document.getElementById('q-body').innerHTML=`<div class="options">${q.opts.map((o,i)=>`<button class="opt-btn" onclick="selectAns(${i})"><span class="ltr">${LETTERS[i]}.</span><span>${o}</span></button>`).join('')}</div>`;
}
function selectAns(idx){
  if(answered)return;answered=true;
  const q=quizQ[current];const ok=idx===q.correct;
  document.querySelectorAll('.opt-btn').forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===idx&&!ok)b.classList.add('wrong');});
  if(ok)score++;
  results.push({q:q.q,src:q.src,cat:q.cat,correct:ok,correctAns:q.opts[q.correct],yourAns:q.opts[idx]});
  const fb=document.getElementById('feedback-box');
  fb.innerHTML=`<strong>${ok?'✓ Correct':'✗ Incorrect'}</strong>${q.fb}<span class="fb-src">Source: ${SRC_LABELS[q.src]} — ${q.cat}</span>`;
  fb.className=`feedback-box show ${ok?'correct-fb':'wrong-fb'}`;
  document.getElementById('action-row').innerHTML=`<button class="btn btn-primary" onclick="nextQ()">${current<quizQ.length-1?'Next Question →':'See Results →'}</button>`;
}
function nextQ(){current++;if(current>=quizQ.length)showResults();else renderQ();}
function showResults(){
  show('results-screen');
  const total=quizQ.length,pct=Math.round((score/total)*100);
  const circ=2*Math.PI*47;
  document.getElementById('score-arc').style.strokeDashoffset=circ-(pct/100)*circ;
  document.getElementById('score-pct').textContent=`${pct}%`;
  document.getElementById('score-raw').textContent=`${score} of ${total} correct`;
  document.getElementById('result-msg').textContent=pct>=90?"Outstanding — you're ready for that board.":pct>=75?"Solid work. Review the misses and you'll be there.":pct>=60?"Good foundation. Focus on the topics you missed.":"Keep going — review each explanation carefully.";
  const ss={};results.forEach(r=>{if(!ss[r.src])ss[r.src]={c:0,t:0};ss[r.src].t++;if(r.correct)ss[r.src].c++;});
  document.getElementById('breakdown').innerHTML=Object.entries(ss).map(([s,v])=>`<div class="breakdown-card"><div class="bd-num">${Math.round((v.c/v.t)*100)}%</div><div class="bd-label">${SRC_LABELS[s]||s}</div><div class="bd-label" style="color:var(--gold-light)">${v.c}/${v.t}</div></div>`).join('');
  document.getElementById('retry-btn').onclick=()=>{quizQ=shuffle(retryQ);current=0;score=0;answered=false;results=[];show('quiz-screen');renderQ();};
  document.getElementById('review-list').innerHTML=`<h3>Answer Review</h3>`+results.map(r=>`<div class="review-item ${r.correct?'r-correct':'r-wrong'}"><div class="ri-q">${r.q}</div><div class="ri-a">Your answer: <span>${r.yourAns}</span>${!r.correct?` &nbsp;|&nbsp; Correct: <span>${r.correctAns}</span>`:''}</div><div class="ri-src">${SRC_LABELS[r.src]} — ${r.cat}</div></div>`).join('');
}
function resetToCategories(){selectedCats.clear();updateSel();show('category-screen');renderGrid('','');}
function show(id){['category-screen','quiz-screen','results-screen'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));}
buildGrid();
</script>
