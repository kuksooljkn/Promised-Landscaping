{src:"LAW",cat:"Texas Law — Peace Bond",q:"A neighbor violates a peace bond. Can you arrest on the peace bond?",opts:["Yes — it is an arrest warrant","No — it is a civil matter; complainant must return to originating court; a JP can hold defendant in contempt","Yes if witnessed by the deputy","Yes — after DA approval"],correct:1,fb:"You CANNOT arrest on a peace bond — it is a civil matter. The complainant must return to court. A JP can hold the defendant in contempt for violation."},
{src:"LAW",cat:"Texas Law — Driver's License",q:"What is the minimum age to obtain an instructional driving permit in Texas?",opts:["14","15","16","17"],correct:1,fb:"15 years old, provided all other requirements are met."},
{src:"STUDY",cat:"Natural DOA",q:"On a Natural DOA, after determining the cause of death, what is the NEXT call to make?",opts:["Contact Funeral Home","Contact ME Office","Contact Watch Command","Notify Next of Kin"],correct:1,fb:"Order: Determine cause → ME Office → Watch Command → Photos → ARS Report → Funeral Home → NOK → Notify supervisor → Pass On."},
{src:"STUDY",cat:"Infant Death (Crib)",q:"A babysitter finds an infant dead in the crib. What is your FIRST action on arrival?",opts:["Take photographs","Contact Watch Command","Secure the scene and separate everyone in the home","Complete the ARS Report"],correct:2,fb:"First: Secure the scene. Then remove, separate, and secure all persons. Assign a deputy at the door with a log. Confirm EMS is dispatched. Contact Watch Command, ME Office, and supervisor."},
{src:"STUDY",cat:"DWI",q:"Which DWI form is the 'Statutory Warning' given to the driver regarding specimen refusal?",opts:["DIC-23","DIC-24","DIC-25","THP-51"],correct:1,fb:"DIC-23 = Probable Cause. DIC-24 = STATUTORY WARNING. DIC-25 = Notice of Suspension. THP-51 = Blood Draw. THP-51A = Affidavit of Person Taking Blood."},
{src:"STUDY",cat:"Supervision & Administration",q:"All reports and supplements must be completed and approved within how many hours?",opts:["24","36","48","72"],correct:2,fb:"48 hours. All reports and supplements must be completed and approved within 48 hours."},
{src:"STUDY",cat:"Evidence & Property",q:"When preparing a loaded firearm for evidence submission, you should:",opts:["Place loaded firearm directly in an evidence bag","Unload the firearm, lock the breech open, package firearm and ammunition in SEPARATE evidence bags","Unload and discard ammunition","Take directly to the firearms lab without packaging"],correct:1,fb:"Unload the firearm, lock the breech open, then package the firearm and ammunition in SEPARATE evidence bags."},
{src:"STUDY",cat:"Civil Process & Misc",q:"How may a citizen submit a FORMAL complaint against a deputy?",opts:["Written signed letter from the complainant OR the official department complaint affidavit","By telephone only","By email only","Through the website only"],correct:0,fb:"A formal complaint may be submitted as a written, signed letter OR via the official department complaint affidavit. Phone and email alone are not accepted."},

{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"What is the phone number for the Harris County Constable Pct. 4 Commissioner, Jack Cagle?",opts:["713-991-6881","832-927-4444","281-463-6300","713-274-2222"],correct:1,fb:"Harris County Commissioner Pct. 4 – Jack Cagle: 832-927-4444, located at 14444 Holderrieth Rd. Tomball, Texas 77377."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"What is the Harris County Sheriff's Office Watch Command phone number?",opts:["713-221-6000","713-755-8373","713-566-5074","713-755-6055"],correct:1,fb:"HCSO Watch Command: 713-755-8373. Main Admin: 713-221-6000. Transportation/Blind Booking: 713-566-5074. Warrants Division: 713-755-6055."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"What is the phone number for the Harris County Joint Processing Center (JPC)?",opts:["713-755-8020","713-755-8373","713-274-9360","713-566-5074"],correct:0,fb:"Harris County Joint Processing Center (JPC): 713-755-8020, located at 700 N. San Jacinto Street Houston, Texas 77002."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"What is the Drug/Poison Control phone number listed in the Supervisor Field Manual?",opts:["800-877-5300","800-764-7661","800-989-6884","800-829-1040"],correct:1,fb:"Drug/Poison Control: 800-764-7661. (Note: 800-877-5300 is Texas Dept. of Child Protective Services. 800-989-6884 is Crisis Help Center for Juveniles.)"},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"Which agency has the phone number 713-693-5000 according to the Field Manual?",opts:["ATF","DEA","FBI","U.S. Secret Service"],correct:2,fb:"Federal Bureau of Investigation (F.B.I.): 713-693-5000, located at 1 Justice Park Dr. Houston, Texas 77092."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"What is the Ben Taub Hospital Jail Ward phone number?",opts:["713-793-2600","713-793-2506","713-755-7097","713-704-4060"],correct:2,fb:"Ben Taub Hospital Jail Ward: 713-755-7097. Patient Information: 713-793-2600. Police Phone Line: 713-793-2506."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"What is the Harris County Medical Examiner's Intake phone number?",opts:["713-796-6740","713-222-4100","713-274-5894","713-881-3100"],correct:0,fb:"Harris County Medical Examiner's Intake: 713-796-6740, located at 1861 Old Spanish Trail Houston, Texas 77030."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"What is the Harris County Office of Emergency Management phone number?",opts:["713-274-9360","713-881-3100","713-999-3191","346-286-4000"],correct:1,fb:"Harris County Office of Emergency Management: 713-881-3100, located at 6922 Old Katy Rd. Houston, Texas 77024."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"The FamilyTime Crisis Foundation Women's Shelter is located in which city, and what is its phone number?",opts:["Pasadena — 713-473-2801","Humble — 281-446-2615","Houston — 281-885-4555","Conroe — 936-441-7273"],correct:1,fb:"FamilyTime Crisis Foundation Women's Shelter: 281-446-2615, located at 1203 S. Houston Ave. Humble, Texas 77338."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"What is the Texas Department of Child Protective Services Police Line number?",opts:["800-877-5300","800-989-6884","800-764-7661","800-829-1040"],correct:0,fb:"Texas Department of Child Protective Services Police Line Only: 800-877-5300, located at 6300 Chimney Rock Rd. Houston, Texas 77081."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"Which entity has jurisdiction to handle HAZMAT matters and should be called at 713-881-3100 during daytime?",opts:["Harris County Fire Marshal","Harris County Sheriff","Harris County Office of Emergency Management (OEM)","Houston Fire Department"],correct:2,fb:"Harris County O.E.M. (Office of Emergency Management): 713-881-3100 (daytime). At night, call H.C.S.O. Dispatch at 713-221-6000 for contact."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"What is the phone number for Houston Police Department Homicide?",opts:["713-308-8700","713-308-3600","713-308-3300","713-308-1180"],correct:1,fb:"Houston Police Department Homicide: 713-308-3600. Criminal Intelligence: 713-308-8700. Narcotics: 713-308-3300. Sex Crimes: 713-308-1180."},
{src:"STUDY",cat:"SFM: Phone Numbers & Agencies",q:"The Harris County District Attorney Intake number is:",opts:["713-274-5894","713-755-8020","713-796-6740","713-222-4100"],correct:0,fb:"Harris County District Attorney Intake: 713-274-5894, located at 1201 Franklin Street (2nd Floor) Houston, Texas 77002."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — MOTOR VEHICLE CRASHES (Section II)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"According to SFM Section II, which Texas Transportation Code chapter governs crash report completion?",opts:["Chapter 450","Chapter 550","Chapter 650","Chapter 724"],correct:1,fb:"SFM Section II: All crash reports will be completed in accordance with Chapter 550 of the Texas Transportation Code and TxDOT instructional guidelines."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"What is the standard crash report form used by peace officers in Texas?",opts:["THP-51","DIC-23","CR-3","Harris County Offense Report"],correct:2,fb:"CR-3 (Rev. 1/2010) is the Texas Peace Officer's Crash Report. The Harris County Offense Report is used for serious bodily injury, major fleet crashes, fatalities, and DWI incidents."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"A crash is minor in nature, all drivers are adults, request no report, no injury, no more than 4 vehicles, and no property damage beyond the vehicles. What form is required?",opts:["CR-3 Crash Report","DIC-23","Crash Non-Investigation Form","Harris County Offense Report"],correct:2,fb:"SFM Section II: When a crash is minor, all parties request no report, no injury, no more than 4 vehicles involved, and no damage to property other than the vehicles, a Crash Non-Investigation Form is appropriate."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"In a DWI-related crash, the subject is conscious. What must the officer do regarding breath/blood specimen?",opts:["Take blood immediately without warning","Read the DIC-24 Statutory Warning to the subject","Read the DIC-25 and proceed directly to blood draw","Complete the THP-51 and transport to hospital"],correct:1,fb:"SFM Section II: If the subject is conscious, the DIC-24 (Statutory Warning) is read. If the subject is deceased or unconscious, consent is deemed given and blood may be taken."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"In a DWI crash where the suspect refuses to give a specimen and serious bodily injury (no possibility of fatality) is involved, what is the next step?",opts:["Complete THP-51 and draw blood at Ben Taub","Obtain a search warrant for blood through Harris County DA","Serve DIC-24 again and wait 30 minutes","Contact VATS and release suspect"],correct:1,fb:"SFM Section II: If the subject refuses and the crash involves SBI with NO possibility of fatality, obtain a SEARCH WARRANT for blood through the Harris County DA."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"In a fatal or SBI-that-may-become-fatal DWI crash, how many vials of blood are drawn and which forms are served?",opts:["Two vials — THP-51 served","Four vials — two for search warrant and two for THP-51","Three vials — served with DIC-24","Two vials — served with DIC-25"],correct:1,fb:"SFM Section II: In fatality or potential fatality: obtain a search warrant AND serve a THP-51 on the charge nurse. FOUR vials of blood are drawn — two for the search warrant and two for the THP-51."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"After blood specimens are taken in a DWI investigation, where are all blood specimens taken for BAC/drug level analysis?",opts:["Ben Taub Hospital Lab","HPD Crime Lab","Institute of Forensic Sciences","Harris County Sheriff's Lab"],correct:2,fb:"SFM Section II: All blood specimens are taken to the Institute of Forensic Sciences for determining BAC or drug level."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"For a Minor Fleet Motor Vehicle Crash, which form must be completed in addition to the CR-3?",opts:["THP-51A","County Auditor Form #118","DIC-55","Harris County Supplement"],correct:1,fb:"SFM Section II: For fleet crashes, County Auditor Form #118 must be completed (the summary by the investigator). The original goes to the A.I. Team Supervisor; copies to Division Asst. Chief & Captain."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"In a fleet crash, the supervisor's 'First Report of Injury' is disseminated in how many copies and to whom?",opts:["Workers comp form to employee; original to Chief Clerk; copy to Div. Asst. Chief and Captain","Original to admin office; copy to DA","One copy to employee only","Just filed in the case folder"],correct:0,fb:"SFM Section II: Workers compensation form given to injured deputy. Original First Report of Injury given to Chief Clerk. Copy of First Report of Injury given to Division Asst. Chief and Captain."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"Who is responsible for assigning an Accident Investigator (A.I.) to a crash involving serious bodily injury or death?",opts:["The first deputy on scene","The patrol supervisor who responds to the scene","The Watch Commander","The Harris County DA's office"],correct:1,fb:"SFM Section II: The patrol supervisor responds to the scene to determine the need for an A.I., then assigns an Accident Investigator if needed."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"After a fatal crash, when must the notification of next of kin be made, and how?",opts:["Immediately upon victim identification, by phone","In person, after the injured or deceased has been removed from the scene","By phone within 1 hour of arrival","Before the ME is notified"],correct:1,fb:"SFM Section II: Notification of next of kin is made IN PERSON, after the injured or deceased has been removed from the scene."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"For a DWI reimbursement report, which of the following must be included?",opts:["Only the DWI original reimbursement form and crash report","DWI original reimbursement form, copy of Call Slip, personnel daily activity sheets, crash report, complete offense and DWI report with attachments, and medical/ME records","Only the DIC forms","Crash report and DA intake form only"],correct:1,fb:"SFM Section II: DWI reimbursement requires: original reimbursement form, copy of Call Slip, personnel daily activity sheets, crash report, complete offense/DWI report with DIC-23, DIC-24(S), DIC-25(S), DIC-55, DIC-56, DIC-57, THP-51, THP-51A, and medical/ME records. All forwarded to designated Captain."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"Which DWI form is used specifically for Commercial Vehicle Operators' Statutory Warning?",opts:["DIC-24","DIC-54","DIC-55","DIC-57"],correct:2,fb:"DIC-55 (Rev. 9/2011) = DWI-Peace Officer Statutory Warning for Commercial Motor Vehicle Operators. DIC-54 = Peace Officer Sworn Report for Commercial Vehicle Operators. DIC-57 = Notice of Disqualification."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"In a major crash involving a department employee, who must accompany the injured employee to the hospital?",opts:["The first deputy on scene","The supervisor","The union representative","The Chief Deputy"],correct:1,fb:"SFM Section II: The supervisor is to accompany the injured employee to the hospital. Additionally, notification of family is made in person by patrol, and a representative of Victims Assistance is notified."},
{src:"STUDY",cat:"SFM: Motor Vehicle Crashes",q:"The THP-51 form is used only in which specific crash scenario?",opts:["Any DWI crash","DWI crash involving any injury","Fatality or SBI that may become fatal","Any crash where blood is drawn"],correct:2,fb:"SFM Section II: THP-51 (Statutory Authorization/Mandatory Blood Specimen) is used ONLY on Fatality or SBI that may become fatal."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — ARRESTS (Section III)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Arrests",q:"Per SFM Section III, what is the FIRST consideration before executing a warrant or making an arrest?",opts:["Notify the supervisor","Confirm jurisdiction","Consider whether issuance of a citation will suffice instead of a warrant/arrest","Confirm probable cause exists"],correct:2,fb:"SFM Section III: FIRST consider whether the issuance of a citation will suffice instead of a warrant/arrest, per Article 14.06 subsection B of the Texas Code of Criminal Procedures."},
{src:"STUDY",cat:"SFM: Arrests",q:"Per SFM Section III, what must a valid arrest warrant be styled as?",opts:["In the name of the State of Texas","In the name of the arresting officer","In the name of the originating court","In the name of Harris County"],correct:0,fb:"SFM Section III: The warrant must be issued in the name 'The State of Texas,' specify the name of the person to be arrested, state the offense, and be signed by the magistrate with office identified."},
{src:"STUDY",cat:"SFM: Arrests",q:"A suspect is hiding inside a residence OWNED BY ANOTHER person. To enter and execute a felony arrest warrant, what is required?",opts:["The arrest warrant is sufficient to enter any premises","A search warrant or consent to search the third-party's residence","Only supervisor authorization","Exigent circumstances always apply"],correct:1,fb:"SFM Section III: If the suspect is inside a residence owned by another, officers must obtain a SEARCH WARRANT or CONSENT TO SEARCH before entering."},
{src:"STUDY",cat:"SFM: Arrests",q:"After a warrant is executed, it must be returned to the appropriate court. Which item must the officer correctly endorse on the warrant before returning it?",opts:["The suspect's fingerprints","The date and time of execution","The officer's badge number and rank","The suspect's SID number"],correct:1,fb:"SFM Section III: The officer must correctly ENDORSE THE WARRANT with the DATE/TIME OF EXECUTION, then return it to the appropriate court in the agency's jurisdiction."},
{src:"STUDY",cat:"SFM: Arrests",q:"A citizen makes an arrest and requests police assistance. What two conditions must be met before officers can assist?",opts:["Supervisor approval and a written citizen statement","Probable cause must exist AND the elements of the offense must be met","The citizen must be law enforcement trained","Approval of the DA is required"],correct:1,fb:"SFM Section III: For a citizen's arrest — (a) PROBABLE CAUSE must exist AND (b) the ELEMENTS OF THE OFFENSE must be met. Then escort citizen and suspect to station, complete offense report, and contact DA."},
{src:"STUDY",cat:"SFM: Arrests",q:"In a warrantless arrest, after what step must the officer contact the District Attorney's office?",opts:["Before making any arrest","After transporting to jail","Upon making a warrantless arrest — contact DA, complete offense report, JIM's, AFIS subject, and place in Harris County Jail","Only if charges are unclear"],correct:2,fb:"SFM Section III: In a warrantless arrest, contact the District Attorney, complete the offense report, JIM's, AFIS subject, and place in Harris County Jail."},
{src:"STUDY",cat:"SFM: Arrests",q:"When arresting a juvenile, what is the time limit for releasing to parents/guardian OR transporting to Juvenile Probation?",opts:["3 hours","6 hours","8 hours","12 hours"],correct:1,fb:"SFM Section III: Release the suspect juvenile to the custody of parents/guardian, or transport to Juvenile Probation within 6 HOURS."},
{src:"STUDY",cat:"SFM: Arrests",q:"When taking a statement from a juvenile suspect, what warning must be given per the Texas Family Code?",opts:["Miranda Warning per CCP Art. 38.22","Magistrate's warning per Section 51.09 of the Texas Family Code","DIC-24 Statutory Warning","No special warning is required for juveniles"],correct:1,fb:"SFM Section III: When taking a statement from a juvenile, they must be given the MAGISTRATE'S WARNING in accordance with Section 51.09 of the Texas Family Code."},
{src:"STUDY",cat:"SFM: Arrests",q:"After arresting a juvenile, which school notification requirement must be completed?",opts:["No notification required","Complete School Notification per Article 15.27 of the Texas Code of Criminal Procedures","Notify school only if juvenile is a student there","Notification is at supervisor's discretion"],correct:1,fb:"SFM Section III: Complete School Notification in accordance with Article 15.27 of the Texas Code of Criminal Procedures."},
{src:"STUDY",cat:"SFM: Arrests",q:"A juvenile is detained. What must be ensured regarding their housing near adult detainees?",opts:["They may be placed in adult holding if supervised","Sight/sound separation from adults must be arranged","They may share a cell if juvenile facility is full","No specific requirement exists"],correct:1,fb:"SFM Section III: If the juvenile suspect is brought to a juvenile facility, arrange for SIGHT/SOUND SEPARATION from adults."},
{src:"STUDY",cat:"SFM: Arrests",q:"When a suspect escapes from custody during warrant execution, what should the officer do?",opts:["Terminate pursuit after 2 miles","Legally pursue and apprehend or try to apprehend, and complete an offense report","Contact DA before pursuing","Only notify supervisor — do not pursue"],correct:1,fb:"SFM Section III: If the suspect escapes from custody, legally pursue and apprehend or try to apprehend, and COMPLETE AN OFFENSE REPORT documenting the escape."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — BOMB THREATS (Section IV)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Bomb Threats",q:"SFM Section IV: When a bomb threat is received, how far from the scene must responding units turn off radios, mobile data terminals, and cell phones?",opts:["One block","Two blocks","Three blocks","Five blocks"],correct:2,fb:"SFM Section IV: Request responding units to turn off radios, mobile data terminals, and cellular phones within THREE BLOCKS of the scene to avoid triggering electronic detonation."},
{src:"STUDY",cat:"SFM: Bomb Threats",q:"SFM Section IV: All units on scene must make communications via what method until the scene is secured by bomb detail?",opts:["Radio channel 2","A secured land line telephone","Cell phones only","Encrypted radio only"],correct:1,fb:"SFM Section IV: Have all units on scene make any communications with a SECURED LAND LINE TELEPHONE until the scene has been secured by bomb detail personnel or approval from bomb detail has been received."},
{src:"STUDY",cat:"SFM: Bomb Threats",q:"SFM Section IV: What is the HPD Bomb Detail phone number listed in the Field Manual?",opts:["281-716-8200","713-646-3910","281-449-2093","832-394-4100"],correct:1,fb:"SFM Section IV: H.P.D. Bomb Detail: (713)646-3910. ATF phone listed is (281) 449-2093."},
{src:"STUDY",cat:"SFM: Bomb Threats",q:"SFM Section IV: If a possible bomb is found during a search, what is the IMMEDIATE action?",opts:["Attempt to identify the device","Evacuate the building immediately","Call the bomb squad and wait in place","Have canine unit approach the device"],correct:1,fb:"SFM Section IV: If a possible bomb is found, EVACUATE THE BUILDING IMMEDIATELY. When evacuating after discovery: open doors and windows near the possible bomb, and avoid use of elevators."},
{src:"STUDY",cat:"SFM: Bomb Threats",q:"SFM Section IV: During a building search for a suspected bomb, search teams must follow which restrictions?",opts:["Use radios but avoid phones","Do not use radios, do not smoke, do not touch suspicious objects but note their location, avoid turning lights on or off","Turn off all lights to minimize electronic interference","Touch objects carefully to confirm they are not devices"],correct:1,fb:"SFM Section IV: Search teams must: (1) Not use radios, (2) Not smoke, (3) Not touch any suspicious/unusual object but note its location, (4) Avoid turning lights on or off."},
{src:"STUDY",cat:"SFM: Bomb Threats",q:"SFM Section IV: If an explosive device HAS been detonated, what is the priority action and which agency is summoned?",opts:["Secure the scene and summon HPD Homicide","Secure and protect the scene and summon the Bureau of Alcohol, Tobacco and Firearms (ATF)","Evacuate all personnel and call FBI","Contact DEA and wait for clearance"],correct:1,fb:"SFM Section IV: If an explosive device has been detonated, secure and protect the scene and direct dispatch to summon the Bureau of Alcohol, Tobacco and Firearms (ATF)."},
{src:"STUDY",cat:"SFM: Bomb Threats",q:"SFM Section IV: When evacuating a building due to a bomb threat, what should be done before the evacuation if time permits?",opts:["Conduct a full grid search","Search evacuation routes before evacuation","Interview building occupants","Contact the property owner for a floor plan"],correct:1,fb:"SFM Section IV: If the authority over the building wishes to evacuate it, assist as necessary. If TIME PERMITS, SEARCH EVACUATION ROUTES before evacuation begins."},
{src:"STUDY",cat:"SFM: Bomb Threats",q:"SFM Section IV: What are the four key pieces of information about a bomb threat that must be relayed to the dispatcher and supervisor?",opts:["Caller's voice, location, motive, time","Location of the bomb, time set for detonation, description/type of the bomb, and reason for bombing","Name of caller, type of device, number of devices, target","Building name, number of occupants, exits, and device description"],correct:1,fb:"SFM Section IV: Relay to dispatcher and supervisor: (1a) Location of the bomb, (1b) Time set for detonation (if known), (1c) Description and type of the bomb, (1d) Reason for bombing (if known)."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — CANINE USE (Section V)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Canine Use",q:"SFM Section V: When a police dog bites any person, what are the THREE required actions?",opts:["Photograph injury, complete use-of-force report, notify supervisor","Obtain medical treatment, photograph the injury before and after treatment, and complete a use-of-force report","Photograph injury, notify K-9 coordinator, file bite report","Medical treatment, K-9 incident report, notify risk management"],correct:1,fb:"SFM Section V: If the dog bites any person: (1) Obtain medical treatment despite apparent seriousness, (2) Photograph the injury BEFORE AND AFTER medical treatment, (3) Complete a use-of-force report."},
{src:"STUDY",cat:"SFM: Canine Use",q:"SFM Section V: Before a canine building search begins, how many times and where must the warning to surrender be announced?",opts:["Once at the main entrance","Twice — at entrance and interior","Three times — and ensured on each floor/hallway","Once by radio announcement"],correct:2,fb:"SFM Section V: Announce THREE TIMES the police intention to unleash a dog to search the building and command the suspect to surrender. Ensure the warning is issued on EACH FLOOR/HALLWAY."},
{src:"STUDY",cat:"SFM: Canine Use",q:"SFM Section V: When preparing for a canine building search, who must be evacuated from the building?",opts:["Only non-essential employees","All occupants, workers, and others","Only persons in the suspect area","Only the public — employees may stay"],correct:1,fb:"SFM Section V: Evacuate ALL OCCUPANTS, WORKERS, AND OTHERS from the building. Also have the building manager shut off all ventilation, heating, or cooling."},
{src:"STUDY",cat:"SFM: Canine Use",q:"SFM Section V: During a drug search at a public school, what three conditions must ALL be met before deploying a canine?",opts:["Principal request, reasonable suspicion, and warrant","Principal or appropriate authority requests the service, reasonable suspicion exists that narcotics are present, AND search is confined to objects in public areas or exterior to lockers — no occupied classrooms or persons","Principal request, probable cause, and supervisor approval","Only reasonable suspicion is needed for school searches"],correct:1,fb:"SFM Section V: All three conditions must be met: (a) Principal or appropriate authority requests, (b) Reasonable suspicion that illegal narcotics are present on school property, AND (c) The search is confined to objects in public areas or exterior to lockers. No occupied classrooms or persons."},
{src:"STUDY",cat:"SFM: Canine Use",q:"SFM Section V: A traffic stop is underway. Under what condition may a canine sniff a vehicle's interior incident to a lawful traffic stop?",opts:["Any time during a traffic stop","Incident to a lawful traffic stop, but do not detain the driver any longer than required to complete the business of the stop","Only with driver's written consent","Only if probable cause already exists for narcotics"],correct:1,fb:"SFM Section V: A dog may sniff a motor vehicle incident to a lawful traffic stop to sniff the vehicle interior, but DO NOT DETAIN THE DRIVER any longer than required to complete the business of the stop."},
{src:"STUDY",cat:"SFM: Canine Use",q:"SFM Section V: When tracking a lost person using a canine, what must personnel do to preserve the tracking scent?",opts:["Handle clothing freely to distribute scent","Keep personnel out of the search area, avoid handling clothing that will give the scent, and try to secure the perimeter of the area","Set out water and food to attract the person","Immediately begin air searches"],correct:1,fb:"SFM Section V: When tracking a lost person: (a) Try to secure the perimeter of the search area, (b) Keep personnel out of the area to be searched, (c) Avoid handling clothing that will give the scent."},
{src:"STUDY",cat:"SFM: Canine Use",q:"SFM Section V: At the location where a pursued suspect was lost, what must officers do BEFORE calling a canine unit to track?",opts:["Begin searching with officers first","Avoid foot or vehicle traffic, avoid contamination of clothing/vehicles/items, and turn off vehicle engines","Set up a grid pattern first","Deploy perimeter units at 100-yard intervals"],correct:1,fb:"SFM Section V: Before calling canine to track: (a) Avoid foot or vehicle traffic, (b) Avoid contamination of clothing, vehicle, or evidentiary items, (c) Turn off vehicle engines."},
{src:"STUDY",cat:"SFM: Canine Use",q:"SFM Section V: During a riot or crowd incident with strong possibility of violence, who must authorize the use of canine units?",opts:["The senior officer on scene","The On-Call or Staff Supervisor","The canine handler determines unilaterally","Any supervisor of Lieutenant rank or above"],correct:1,fb:"SFM Section V: If the crowd incident holds a strong, immediate possibility of riot or violence, request that the ON-CALL OR STAFF SUPERVISOR authorize the use of canine units. When deployed, direct handlers to keep dogs on SHORT LEASHES."},
{src:"STUDY",cat:"SFM: Canine Use",q:"SFM Section V: Which SOP sections govern canine unit use?",opts:["SOP 110.001 through 110.004","SOP 140.001 through 140.004","SOP 4.001 through 4.006","SOP 200.001 through 200.004"],correct:1,fb:"SFM Section V: Refer to Standard Operating Procedures #140.001 through #140.004 regarding canine unit use."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — CIVIL DISTURBANCE (Section VI)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Civil Disturbance",q:"SFM Section VI: As ranking officer at a civil disturbance, what must be provided to dispatch on a CONTINUOUS basis?",opts:["Only the number of officers on scene","Estimated crowd size and area involved, any weapons observed, injuries to officers or citizens, and property destroyed","Officer deployment positions only","Supervisor's name and command post location only"],correct:1,fb:"SFM Section VI: Provide continuous information to dispatch including: (a) Estimated size of crowd and area involved, (b) Weapons if any, (c) Injuries to officers or citizens, (d) Property destroyed."},
{src:"STUDY",cat:"SFM: Civil Disturbance",q:"SFM Section VI: What personal protective equipment must all officers be properly equipped with at a civil disturbance?",opts:["Firearms and radios only","Appropriate body armor, chemical agents, baton(s), and restraint devices (e.g., flexible handcuffs)","Bullet-proof shields only","Helmets and visors only"],correct:1,fb:"SFM Section VI: All officers must be properly equipped with: (a) Appropriate body armor, (b) Chemical agents, (c) Baton(s), (d) Restraint devices (e.g., flexible handcuffs)."},
{src:"STUDY",cat:"SFM: Civil Disturbance",q:"SFM Section VI: Before ordering crowd dispersal, what must officers provide to allow people to leave peacefully?",opts:["A written dispersal order posted at the scene","An escape path for those who wish to leave","A 30-minute grace period","Specific safe routes broadcast by radio"],correct:0,fb:"SFM Section VI: In preparation for arrests, provide an ESCAPE PATH for those who wish to leave. Also advise leaders and crowd that their gathering violates the law, to leave within a time limit, and that arrests will be made for illegal acts."},
{src:"STUDY",cat:"SFM: Civil Disturbance",q:"SFM Section VI: During a civil disturbance, sniper or other gunfire is encountered. What resource must be requested?",opts:["HPD Air Support","SWAT or ERT (Emergency Response Team)","ATF immediately","Only additional patrol units"],correct:1,fb:"SFM Section VI: If sniper or other gunfire is encountered, request SWAT or ERT (Emergency Response Team)."},
{src:"STUDY",cat:"SFM: Civil Disturbance",q:"SFM Section VI: After a civil disturbance is defused, what are the three de-escalation steps?",opts:["Arrest leaders, debrief, file reports","Return personnel to normal duties, discontinue the command post, and collect/properly store specialized equipment","File after-action report, release all detainees, restore traffic","Clear crowd, restore power, debrief only command staff"],correct:1,fb:"SFM Section VI: Once defused, de-escalate by: (a) Returning personnel to normal duties, (b) Discontinuing the command post, (c) Collecting and properly storing specialized equipment. Follow up with debriefing all participating personnel, interviewing witnesses/suspects, and documenting comprehensively."},
{src:"STUDY",cat:"SFM: Civil Disturbance",q:"SFM Section VI: During a civil disturbance, the ranking officer identifies businesses that stock firearms and explosives. What must occur?",opts:["Immediately seize the inventory","If necessary, contact the owners and assist them in securing their premises","Post officers at each location without contact","Notify ATF and transfer responsibility"],correct:1,fb:"SFM Section VI: Identify local repositories or commercial businesses which stock firearms and explosives. If necessary, contact owners or persons in authority and assist them in SECURING THEIR PREMISES."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — COMMUNICABLE DISEASES (Section VII)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Communicable Diseases",q:"SFM Section VII: An officer receives a minor wound during an incident. What is the immediate first-aid protocol before seeking medical attention?",opts:["Apply a bandage immediately","Allow it to bleed until the flow naturally stops, then cleanse with an alcohol-based towelette followed by soap/water wash","Apply a tourniquet and go directly to the hospital","Report to the supervisor before treating the wound"],correct:1,fb:"SFM Section VII: If the officer receives a minor wound, allow it to BLEED UNTIL THE FLOW NATURALLY STOPS, then cleanse with an ALCOHOL-BASED TOWELETTE, followed by SOAP/WATER WASH, then seek medical attention."},
{src:"STUDY",cat:"SFM: Communicable Diseases",q:"SFM Section VII: When handling items like syringes, hypodermic needles, or surfaces soiled with blood or fluids, what gloves must be worn?",opts:["Leather gloves","Cotton gloves","Disposable latex gloves","No gloves needed if hands are washed after"],correct:2,fb:"SFM Section VII: When handling persons or items with body fluids (syringes, hypodermic needles, surfaces soiled with blood), wear DISPOSABLE LATEX GLOVES. If working with items that have fingerprint value, wear cotton gloves OVER latex ones."},
{src:"STUDY",cat:"SFM: Communicable Diseases",q:"SFM Section VII: How must an officer's uniform be handled if contaminated with body fluids?",opts:["Continue wearing until end of shift, then wash","Relieve the officer to remove it as soon as practicable","Spray with disinfectant and continue duty","Officer determines when to change"],correct:1,fb:"SFM Section VII: If an officer's uniform becomes contaminated with body fluids, RELIEVE THE OFFICER to remove it AS SOON AS PRACTICABLE."},
{src:"STUDY",cat:"SFM: Communicable Diseases",q:"SFM Section VII: If a suspect has been charged with sexual assault or any offense against a child, what must be arranged per CCP?",opts:["HIV testing of the victim only","HIV testing of the suspect, per CCP Chapter 46 Section A","Mental health evaluation of both victim and suspect","STD screening for the investigating officer"],correct:1,fb:"SFM Section VII: If a suspect has been charged with sexual assault or any offense against a child, arrange for his HIV TESTING, per CCP Chapter 46 Section A."},
{src:"STUDY",cat:"SFM: Communicable Diseases",q:"SFM Section VII: When must items contaminated with body fluids (gloves, aprons, masks) be disposed of?",opts:["At end of shift in regular trash","Properly collected, bagged, marked as 'contaminated materials,' and burned or autoclaved","Flushed down the toilet","Placed in biohazard bag and left at scene"],correct:1,fb:"SFM Section VII: All contaminated items must be properly COLLECTED, BAGGED, MARKED as 'contaminated materials,' and BURNED OR AUTOCLAVED."},
{src:"STUDY",cat:"SFM: Communicable Diseases",q:"SFM Section VII: When transporting a person with body fluids, what two precautions must be taken?",opts:["Use a standard patrol car and notify the next officer","Transport in a separate vehicle from other suspects/persons, and have the person wear a disposable protective covering","Transport in caged unit only and disinfect after","No special precautions needed if gloves are worn"],correct:1,fb:"SFM Section VII: (1) Transport in a SEPARATE VEHICLE from other suspects or persons, AND (2) Have the person wear a DISPOSABLE PROTECTIVE COVERING."},
{src:"STUDY",cat:"SFM: Communicable Diseases",q:"SFM Section VII: What must be done before releasing a crime scene that contained body fluids?",opts:["Nothing — the property owner assumes liability","Advise the owner of the POTENTIAL INFECTION RISK before releasing the scene","Complete a HAZMAT report","Post a biohazard warning sign permanently"],correct:1,fb:"SFM Section VII: Before releasing a crime scene, ADVISE THE OWNER OF THE POTENTIAL INFECTION RISK."},
{src:"STUDY",cat:"SFM: Communicable Diseases",q:"SFM Section VII: What action must be taken against any person who intentionally exposed an officer to a communicable disease?",opts:["File a civil complaint","Criminally charge the person","Notify the public health department only","Refer to Internal Affairs"],correct:1,fb:"SFM Section VII: CRIMINALLY CHARGE any person who intentionally exposed an officer to a communicable disease."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — CRIMES AGAINST CHILDREN (Section VIII)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Crimes Against Children",q:"SFM Section VIII: When dispatched to a possible child abuse call, what six pieces of information should the dispatcher ascertain?",opts:["Child's name only","Child's name/age, address/location, parents' names/addresses, complainant's name/address/relationship, relevant injury history, and whether child is in imminent danger","School and doctor only","Address and nature of abuse only"],correct:1,fb:"SFM Section VIII: Dispatcher must ascertain: (1) Whether child is in imminent danger, (2) Child's name/age, (3) Child's address/location, (4) Parents'/guardians' names/addresses, (5) Complainant's name/address/relationship to child, (6) Relevant history of injury to the child."},
{src:"STUDY",cat:"SFM: Crimes Against Children",q:"SFM Section VIII: What indicators suggest physical child abuse vs. accidental injury?",opts:["Only the child's statement is reliable","Multiple injuries in various stages of healing, non-accidental or pattern injuries, parents' inconsistent explanations, and parents who are vague/elusive/contradictory","Only X-rays can determine abuse","Presence of bruising alone"],correct:1,fb:"SFM Section VIII: Indicators of abuse include: many injuries in various stages of healing, complications from old injuries, non-accidental appearing injuries, 'pattern' injuries from specific objects, parents' explanations inconsistent with visible injuries, and vague/elusive/contradictory parental statements."},
{src:"STUDY",cat:"SFM: Crimes Against Children",q:"SFM Section VIII: When interviewing a child victim (preliminary only), what must the officer NOT do?",opts:["Allow the child to play with a toy","Use language appropriate to the child's understanding","Lead the child or suggest answers; use open-ended questions; avoid repeated interviews","Tell the child what will happen next"],correct:2,fb:"SFM Section VIII: Do NOT lead the child or suggest answers; use OPEN-ENDED QUESTIONS. Avoid REPEATED INTERVIEWS with the child. More in-depth interviews are handled by CPS and/or investigating detectives."},
{src:"STUDY",cat:"SFM: Crimes Against Children",q:"SFM Section VIII: What are the physical indicators of sexual assault in a child?",opts:["Vague statements and withdrawal only","Difficulty walking/sitting, torn/stained/bloody underclothes, pain/itching in genital area, symptoms of venereal disease, bruising/bleeding in external genitalia or anal areas","Only genital injuries confirmed by a physician","Poor academic performance and social withdrawal"],correct:1,fb:"SFM Section VIII: Sexual assault indicators: difficulty walking or sitting, torn/stained/bloody underclothes, pain/itching in genital area, symptoms of venereal disease, bruising/bleeding in external genitalia or anal areas. Factors may be absent yet abuse still occurred."},
{src:"STUDY",cat:"SFM: Crimes Against Children",q:"SFM Section VIII: In a child abduction case, what database entry must be made immediately?",opts:["State-only database","NCIC entry — contact dispatcher with information for entry","DPS database only","No database entry until charges are filed"],correct:1,fb:"SFM Section VIII: In a kidnapping/abduction of a child, contact the dispatcher with information for an NCIC ENTRY. Also complete a missing child report and contact detectives."},
{src:"STUDY",cat:"SFM: Crimes Against Children",q:"SFM Section VIII: To evaluate child neglect, which conditions does the officer assess?",opts:["Only physical injuries to the child","Unsafe housing, unsanitary conditions, lack of heating/cooling, rodent infestation, signs of malnutrition, lack of food, lack of medical care, and lack of adult supervision/abandonment","Only statements from neighbors","Food and clothing quality only"],correct:1,fb:"SFM Section VIII: Neglect indicators: unsafe housing, unsanitary living conditions, lack of heating/cooling, rodent infestation, signs of malnutrition, lack of food/spoiled/insufficient food, lack of medical care, and lack of adult supervision/abandonment."},
{src:"STUDY",cat:"SFM: Crimes Against Children",q:"SFM Section VIII: If a complainant produces a custody order from an OUT-OF-STATE jurisdiction, what must the officer do?",opts:["Execute the order immediately","Contact the staff supervisor or On-Call for guidance","Arrest the child-holder immediately","Ignore the out-of-state order"],correct:1,fb:"SFM Section VIII: If a complainant produces a custody order from an out-of-state jurisdiction, CONTACT THE STAFF SUPERVISOR OR ON-CALL FOR GUIDANCE."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — DEATH INVESTIGATIONS (Section IX)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Death Investigations",q:"SFM Section IX: The on-scene officer may make which declaration regarding cause of death?",opts:["The officer may declare the cause if it is obvious","The officer may declare death if vital signs are absent","The on-scene officer, under NO circumstances, declares officially a cause of death","The officer may declare death after 30 minutes of CPR"],correct:2,fb:"SFM Section IX: The on-scene officer, under NO CIRCUMSTANCES, declares officially a cause of death. The officer shall assist the medical examiner and be directed by him. In general, treat the death scene as a possible crime scene until otherwise determined."},
{src:"STUDY",cat:"SFM: Death Investigations",q:"SFM Section IX: If a victim must be moved immediately at a death scene, what must the officer do first?",opts:["Photograph the body before moving","Mark the exact spot where the victim was found, with head, torso, and limbs in the same position","Move the victim to a safe area without documentation","Notify ME before any movement"],correct:1,fb:"SFM Section IX: If the victim must be moved immediately, MARK THE EXACT SPOT where the victim was found, with head, torso, and limbs in the SAME POSITION as the victim's."},
{src:"STUDY",cat:"SFM: Death Investigations",q:"SFM Section IX: Under which circumstances must the medical examiner be notified? (Select the comprehensive answer)",opts:["Only for homicides and suicides","Only if detectives are unavailable","Any violent, unusual, unnatural, suspicious, unexplained, accidental, possible suicide, no attending physician, terminal illness with no physician, stillbirth with midwife, sudden death in good health, coma/syncope, acute illness, hospital death following injury, or abortion-related death","Any death outside a hospital"],correct:2,fb:"SFM Section IX: Notify the Medical Examiner for: violent/unusual/unnatural circumstances, suspicious/possible accident/suicide/homicide, no apparent cause, no attending physician, terminal illness with no physician, stillbirth with midwife, sudden death in good health, unexplained syncope/coma, acute unexplained illness, hospital death following injury, criminal/self-induced abortion, or assisted suicide."},
{src:"STUDY",cat:"SFM: Death Investigations",q:"SFM Section IX: For a death appearing due to NATURAL causes, what are the officer's four key tasks?",opts:["Secure scene, photograph, notify ME, file report","Obtain all available info on the deceased (medical history, condition, attending physician), arrange for physician to sign death certificate through ME, obtain next of kin info and preferred funeral home, and arrange transportation through ME","Notify homicide, photograph, document, release scene","Seal scene, notify DA, complete major incident form, photograph"],correct:1,fb:"SFM Section IX: For apparent natural death: (a) Obtain deceased's info including medical history and attending physician, (b) Arrange through ME for physician to sign death certificate, (c) Obtain next of kin info and preferred funeral home, (d) Arrange through ME for transportation of body to funeral home."},
{src:"STUDY",cat:"SFM: Death Investigations",q:"SFM Section IX: Who is responsible for notifying the next of kin at a death scene?",opts:["The first deputy on scene","The supervisor","The Medical Examiner","The DA's office"],correct:1,fb:"SFM Section IX: Supervisor is to NOTIFY, OR CAUSE TO BE NOTIFIED, the next of kin."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — RESCUE BOAT (Section X)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Rescue Boat",q:"SFM Section X: Who may initiate a request for deployment of the Rescue Boat Team?",opts:["Only the Incident Commander","Only the Patrol Staff Supervisor","All sworn personnel","Only the Patrol Supervisor"],correct:2,fb:"SFM Section X: Request for deployment of the Rescue Boat Team may be made by ALL SWORN PERSONNEL. All requests shall be made to an on-duty Patrol Supervisor, who then notifies a Patrol Staff Supervisor (Lieutenant or above)."},
{src:"STUDY",cat:"SFM: Rescue Boat",q:"SFM Section X: Who determines the justification for deploying the Rescue Boat Team and notifies the Rescue Boat Crew Chief?",opts:["The Patrol Supervisor receiving the request","The Rescue Boat Incident Commander","The Patrol Staff Supervisor","The on-duty Lieutenant"],correct:1,fb:"SFM Section X: The RESCUE BOAT INCIDENT COMMANDER determines justification. If justified, the Incident Commander notifies the RESCUE BOAT CREW CHIEF to deploy the team."},
{src:"STUDY",cat:"SFM: Rescue Boat",q:"SFM Section X: In the pre-deployment check, how long must the engine be run using the outboard motor auxiliary water supply system?",opts:["30 seconds","Approximately one minute","Five minutes","Until the temperature gauge stabilizes"],correct:1,fb:"SFM Section X: Engine started and run APPROXIMATELY ONE MINUTE using the outboard motor auxiliary water supply system."},
{src:"STUDY",cat:"SFM: Rescue Boat",q:"SFM Section X: How many drain plugs must be properly installed before the rescue boat is launched?",opts:["Two","Three","Four","Six"],correct:2,fb:"SFM Section X: Make sure that all FOUR (4) drain plugs are properly installed PRIOR TO LAUNCH."},
{src:"STUDY",cat:"SFM: Rescue Boat",q:"SFM Section X: After deployment, what fuel procedure must be completed BEFORE the boat is stored?",opts:["Fill tanks halfway for safety","Disconnect gas line from engine, allow to run until engine dies, attempt to restart to ensure carburetor and fuel lines are empty, then fill all tanks with gas and proper oil additive","Store with a full tank only","Drain all fuel completely"],correct:1,fb:"SFM Section X: Prior to boat storage: (1) Disconnect gas line from engine and allow to run until engine dies and attempt to restart, ensuring carburetor and fuel lines are EMPTY. (2) Rinse boat thoroughly with fresh water. (3) FILL ALL FUEL TANKS with gas and proper amount of oil additive. (4) Inspect all equipment."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — COMMAND STATION (Section XI)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Command Station",q:"SFM Section XI: Who determines the justification for deploying the Command Station?",opts:["The Patrol Supervisor","The Patrol Staff Supervisor","The Assistant Chief","The Incident Commander"],correct:2,fb:"SFM Section XI: The ASSISTANT CHIEF determines the justification for deployment. The chain is: sworn personnel → Patrol Supervisor → Patrol Staff Supervisor → Assistant Chief → on-duty patrol supervisor to deploy."},
{src:"STUDY",cat:"SFM: Command Station",q:"SFM Section XI: What is the correct procedure for connecting the stabilizer bars when preparing the Command Station for travel?",opts:["Place short end in holes on receiver hitch, then turn long end toward fender and toward rear to lock","Place long end first into the hitch, then attach chain","Insert both ends simultaneously from front","Chains are attached before bars are inserted"],correct:0,fb:"SFM Section XI: Take short end of stabilizer and place into holes on left/right underside of receiver hitch. With the long end, turn toward the vehicle fender, insert, and turn toward the rear to lock into place."},
{src:"STUDY",cat:"SFM: Command Station",q:"SFM Section XI: After storing the Command Station, what must be done to the refrigerator?",opts:["Turn it off to save power","Ensure refrigerator is in 'ON' position and replenish with bottled water","Leave it empty","Disconnect it from power"],correct:1,fb:"SFM Section XI: Interior storage procedure includes: check refrigerator for open containers and food (discarding as appropriate), ensure refrigerator is in 'ON' position, and REPLENISH REFRIGERATOR WITH BOTTLED WATER."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — HIGH WATER RESCUE VEHICLE (Section XII)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: High Water Rescue Vehicle",q:"SFM Section XII: What is the High Water Rescue Vehicle also known as?",opts:["The Dive Unit","Deuce one half truck","The HAZMAT rig","The Tactical Response Vehicle"],correct:1,fb:"SFM Section XII: The High Water Rescue Vehicle is referred to as the 'Deuce one half truck.' It supports field personnel in high water search, rescue, and evacuation."},
{src:"STUDY",cat:"SFM: High Water Rescue Vehicle",q:"SFM Section XII: After deployment of the High Water Rescue Vehicle, what battery procedure must be completed?",opts:["Charge batteries overnight","Check batteries and remove any pre-determined connections","Replace batteries after every deployment","No battery action required post-deployment"],correct:1,fb:"SFM Section XII: Post-deployment check includes: check fuel tank, replace any removed equipment or log for replacement, park in assigned storage location, and CHECK BATTERIES AND REMOVE ANY PRE-DETERMINED CONNECTIONS."},
{src:"STUDY",cat:"SFM: High Water Rescue Vehicle",q:"SFM Section XII: Who may request deployment of the High Water Rescue Vehicle?",opts:["Only the Patrol Staff Supervisor","Only on-call supervisors","All sworn personnel — all requests go to an on-duty Patrol Supervisor","Only the Division Chief"],correct:2,fb:"SFM Section XII: Request for deployment may be made by ALL SWORN PERSONNEL. All requests shall be made to an on-duty Patrol Supervisor. The Patrol Staff Supervisor or designee then determines justification and notifies a designated High Water Rescue Vehicle operator."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — DISASTERS (Section XIII)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Disasters",q:"SFM Section XIII: At the scene of a disaster, what is the first thing to establish for managing the incident?",opts:["A media staging area","A clear radio frequency for managing the incident","A command post with written logs","A perimeter with traffic control"],correct:1,fb:"SFM Section XIII: At the scene of any disaster, relay pertinent information to dispatch, notify the staff/On-Call supervisor, notify EMS, and establish a CLEAR RADIO FREQUENCY for managing the incident."},
{src:"STUDY",cat:"SFM: Disasters",q:"SFM Section XIII: During flooding, officers should avoid driving through which types of areas?",opts:["Only areas with flowing water","Depressions, gullies, or other low areas; no area where flooding precludes a visible roadway; and officers should not wade into any flooded area","Only water over 12 inches deep","Underpasses only"],correct:1,fb:"SFM Section XIII: If flooding occurs: instruct officers to AVOID DRIVING in or through depressions, gullies, or other low areas; not to drive through any area where flooding PRECLUDES A VISIBLE ROADWAY; and not to WADE INTO any flooded area."},
{src:"STUDY",cat:"SFM: Disasters",q:"SFM Section XIII: At an air crash scene, which agency must be contacted by the dispatcher regarding jurisdiction over the crash site?",opts:["FAA only","Military authorities only","National Transportation Safety Board (of Federal Aviation Administration) or military authorities as appropriate","NTSB and EPA jointly"],correct:2,fb:"SFM Section XIII: Ensure the dispatcher contacts the NATIONAL TRANSPORTATION SAFETY BOARD (of FAA) or military authorities, as appropriate, to respond to the ranking officer at the scene. Federal or military authorities shall ASSUME CONTROL over the crash site."},
{src:"STUDY",cat:"SFM: Disasters",q:"SFM Section XIII: When a military aircraft is involved in a crash, what is the media access policy?",opts:["Immediately brief media on all details","Media has standard access","Prohibit media access until military officials instruct otherwise","Media may access from 500 feet"],correct:2,fb:"SFM Section XIII: If a military aircraft is involved, PROHIBIT MEDIA ACCESS until military officials instruct otherwise."},
{src:"STUDY",cat:"SFM: Disasters",q:"SFM Section XIII: At a disaster scene, what specific precaution must officers give regarding military aircraft fuel?",opts:["The fuel is generally non-flammable","Caution officers of the possible presence of highly combustible aircraft fuel or ordnance if a military aircraft is involved","No special precaution — aircraft fuel is the same as vehicle fuel","Contact EPA before approaching"],correct:1,fb:"SFM Section XIII: Caution officers of the possible presence of HIGHLY COMBUSTIBLE AIRCRAFT FUEL or ORDNANCE (if a military aircraft) at the crash site."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — DISCIPLINE (Section XIV)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Discipline",q:"SFM Section XIV: When must a complaint be accepted for review even if it is more than 30 days old?",opts:["Never — 30-day rule is absolute","When the complainant shows good cause why it was not filed earlier, OR when the act complained of is a criminal violation","Only if the subject officer is still employed","If a supervisor witnesses the conduct independently"],correct:1,fb:"SFM Section XIV: If the complaint is over 30 days old, agency policy does not require acceptance UNLESS: (a) the complainant can show GOOD CAUSE why a complaint was not made earlier, OR (b) the act complained of is a CRIMINAL VIOLATION."},
{src:"STUDY",cat:"SFM: Discipline",q:"SFM Section XIV: What are the two methods of complaint investigation as explained to a citizen?",opts:["Phone complaint and written complaint","Informal Complaint (District Supervisor) and Formal Complaint (Division Lt. and/or Captain)","Internal investigation and external audit","Patrol-level review and Chief's review"],correct:1,fb:"SFM Section XIV: Two methods: (1) INFORMAL COMPLAINT / District Supervisor, (2) FORMAL COMPLAINT / Division Lt. and/or Captain. A sworn written complaint may be taken by the Assistant Chief Deputy or Divisional Captain."},
{src:"STUDY",cat:"SFM: Discipline",q:"SFM Section XIV: When an employee is suspended, what items must they return?",opts:["Firearm and badge","Firearm only","Department identification card and badge","All issued equipment"],correct:2,fb:"SFM Section XIV: When an employee is suspended for any period of time, the employee must return the Department IDENTIFICATION CARD AND BADGE."},
{src:"STUDY",cat:"SFM: Discipline",q:"SFM Section XIV: For a formal (internal affairs) complaint, who investigates it?",opts:["The district supervisor","The divisional captain","I.A.D. (Internal Affairs Division) — all formal complaints","The complainant's assigned deputy's supervisor"],correct:2,fb:"SFM Section XIV: All FORMAL COMPLAINTS are investigated by I.A.D. (Internal Affairs Division). The supervisor obtains brief complaint information, advises complainant to contact the Divisional Assistant Chief or designee to give a notarized statement."},
{src:"STUDY",cat:"SFM: Discipline",q:"SFM Section XIV: When remedial training is provided to an employee, what must be documented?",opts:["Only the date and topic of training","The training and whether the employee demonstrated or FAILED TO DEMONSTRATE minimal proficiency","Just the hours of training","Only documented if employee fails"],correct:1,fb:"SFM Section XIV: If remedial training was provided, document the training and state whether the employee DEMONSTRATED OR FAILED TO DEMONSTRATE MINIMAL PROFICIENCY."},
{src:"STUDY",cat:"SFM: Discipline",q:"SFM Section XIV: When issuing a written reprimand, what rights must the employee be informed of?",opts:["Right to resign","Right to read the record; right to file a statement in personnel file in case of disagreement; it becomes a permanent part of personnel record; and right of appeal","Right to refuse signing","Right to representation before signing only"],correct:1,fb:"SFM Section XIV: Regarding a written reprimand, inform the employee: (a) Right to READ the record, (b) Right to FILE A STATEMENT in the personnel file in case of disagreement, (c) It becomes a PERMANENT PART of their personnel record, (d) Right of APPEAL."},
{src:"STUDY",cat:"SFM: Discipline",q:"SFM Section XIV: Before a written reprimand or counseling is issued, what step is required?",opts:["No review needed — supervisor may issue immediately","All disciplinary actions must be submitted for review BEFORE given","DA approval must be obtained","Must wait 48 hours"],correct:1,fb:"SFM Section XIV: All disciplinary actions will be SUBMITTED FOR REVIEW BEFORE GIVEN. The supervisor documents the matter and forwards through the chain of command."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — DOMESTIC VIOLENCE (Section XV)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Domestic Violence",q:"SFM Section XV: What is the minimum number of officers that must arrive at a domestic violence scene?",opts:["One officer is sufficient","A minimum of two officers","Three officers for felony assaults","Supervisor discretion determines number"],correct:1,fb:"SFM Section XV: Ensure that a MINIMUM OF TWO OFFICERS arrive at the scene of a domestic violence call."},
{src:"STUDY",cat:"SFM: Domestic Violence",q:"SFM Section XV: What are the four DV-specific forms that must be completed?",opts:["Offense report and DIC-24 only","DPS Family Violence Report and Victim Rights Pamphlet only","Offense report per CCP Article 5.05, Department of Public Safety Family Violence Report, Request I Refusal for Charges, and Application for EPO","Offense report, arrest report, DIC-24, and booking sheet"],correct:2,fb:"SFM Section XV: Complete: (1) Full offense report per CCP Article 5.05, (2) DPS Family Violence Report, (3) Request I Refusal for Charges, and (4) Application for Emergency Protective Order per Article 17.292."},
{src:"STUDY",cat:"SFM: Domestic Violence",q:"SFM Section XV: When dispatching to a domestic violence call, what specific information must the dispatcher ascertain about the assailant?",opts:["Only the assailant's name","Name of complainant, crime in progress, weapon involved, injuries, location, narcotics/alcohol involvement, assailant's WHEREABOUTS, and need for medical assistance","Only whether a weapon is involved","Arrest history and warrant status only"],correct:1,fb:"SFM Section XV: Dispatcher must ascertain: complainant's name, whether a crime is in progress, weapon involved, injuries, location of incident, involvement of narcotics or alcohol, ASSAILANT'S WHEREABOUTS, and need for medical assistance. Also: DV call history to that address, arrest history, outstanding warrants, whether a protective order exists."},
{src:"STUDY",cat:"SFM: Domestic Violence",q:"SFM Section XV: What is the significance of an 'excited utterance' at a domestic violence scene?",opts:["It cannot be used as evidence","It must be recorded if possible as it may be used as evidence","It is hearsay and must be excluded","It must be witnessed by two officers to be valid"],correct:1,fb:"SFM Section XV: Note any 'EXCITED UTTERANCES' by the victim at the scene — these spontaneous statements carry evidentiary value and must be noted and recorded in the report. Record the victim's statement if possible."},
{src:"STUDY",cat:"SFM: Domestic Violence",q:"SFM Section XV: What must the victim be provided at the scene regarding protective orders?",opts:["Oral instructions only","Victim referral/rights pamphlet, procedures for obtaining a protection order, and the department telephone number","Only shelter information","A copy of the offense report and case number"],correct:1,fb:"SFM Section XV: Provide the victim with: (1) Victim's referral to medical authority, crisis shelter, mental health, victim's assistance, or other service, AND (2) Victim's RIGHTS PAMPHLET, procedures for obtaining a PROTECTION ORDER, and the DEPARTMENT TELEPHONE NUMBER."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — DRUG LABS (Section XVI)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Drug Labs",q:"SFM Section XVI: When a drug lab is discovered, what two drug enforcement agencies should be notified?",opts:["ATF and FBI","DEA/HIDTA Task Force and Department of Public Safety Narcotics","HPD Narcotics and FBI","DEA and EPA"],correct:1,fb:"SFM Section XVI: Notify: *** DPS Narcotics: (281)517-1500 *** DEA/HIDTA Task Force: (713) 693-3000. Upon their arrival, they will assume TOTAL RESPONSIBILITY of the scene."},
{src:"STUDY",cat:"SFM: Drug Labs",q:"SFM Section XVI: What is the primary safety classification for a drug lab scene?",opts:["Crime scene — standard evidence protocols apply","Hazardous Materials incident with specific rules","Biohazard scene requiring PPE only","Explosive device scene requiring bomb squad"],correct:1,fb:"SFM Section XVI: Agency personnel shall treat drug labs as HAZARDOUS MATERIALS INCIDENTS with specific rules that apply. Involvement with drug labs is also regulated by OSHA regulations, specifically 29 CFR 1910."},
{src:"STUDY",cat:"SFM: Drug Labs",q:"SFM Section XVI: At a drug lab raid, which weapons or devices must be avoided due to risk of igniting fumes?",opts:["Only open-flame weapons","Shotguns and any devices that might ignite fumes, such as tear gas, smoke bombs, or flash bangs","Only incendiary devices","Tasers only"],correct:1,fb:"SFM Section XVI: Avoid the use of SHOTGUNS and weapons or devices that might IGNITE FUMES, such as TEAR GAS, SMOKE BOMBS, or FLASH BANGS."},
{src:"STUDY",cat:"SFM: Drug Labs",q:"SFM Section XVI: What is absolutely prohibited at a drug lab scene?",opts:["Using radios","No smoking or any other open flame","Photography without DEA present","Any search before chemist arrives"],correct:1,fb:"SFM Section XVI: NO SMOKING OR ANY OTHER OPEN FLAME is to be allowed at a drug lab scene. Also: do not turn electrical switches on or off; do not unplug cookers/heating elements; do not open refrigerators; do not taste/smell/touch any substance."},
{src:"STUDY",cat:"SFM: Drug Labs",q:"SFM Section XVI: Who is responsible for hazardous waste removal and disposal at a drug lab scene?",opts:["The first deputy on scene","Harris County HAZMAT team","The responding specialist (DEA or DPS)","The property owner"],correct:2,fb:"SFM Section XVI: The RESPONDING SPECIALIST (DEA or DPS) is responsible for hazardous waste removal or disposal, paraphernalia collection (except already-removed samples), safe removal/disposal of gear that cannot be decontaminated, and removal/arrangement of decontamination of other gear."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — EMERGENCY VEHICLE OPERATIONS/PURSUITS (Section XVII)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Pursuits & Emergency Driving",q:"SFM Section XVII: An emergency response is defined as the simultaneous operation of what?",opts:["Lights only","Siren only","Emergency hazard lights AND siren simultaneously","Radio and lights together"],correct:2,fb:"SFM Section XVII: An emergency response is one involving the SIMULTANEOUS OPERATION OF EMERGENCY HAZARD LIGHTS AND SIREN."},
{src:"STUDY",cat:"SFM: Pursuits & Emergency Driving",q:"SFM Section XVII: During a pursuit, which Texas Transportation Code section permits disregarding marked speed limits or traffic control devices?",opts:["Section 545.421","Section 724.001","Section 546.001 — Permissible Conduct","Section 550.001"],correct:2,fb:"SFM Section XVII: Disregard marked speed limits or traffic control devices consistent with the requirements of state law, per Section 546.001 Permissible Conduct, Texas Transportation Code."},
{src:"STUDY",cat:"SFM: Pursuits & Emergency Driving",q:"SFM Section XVII: Who has the authority to construct a stationary or rolling roadblock during a pursuit?",opts:["The pursuing officer","The on-duty supervisor","Only at the direction of the Assistant Chief of Patrol","Any sergeant or above"],correct:2,fb:"SFM Section XVII: Construct a stationary or rolling roadblock ONLY AT THE DIRECTION OF THE ASSISTANT CHIEF OF PATROL."},
{src:"STUDY",cat:"SFM: Pursuits & Emergency Driving",q:"SFM Section XVII: When notifying dispatch of a pursuit, what six pieces of information must be provided?",opts:["Location and vehicle description only","Pursuit reason, starting location, direction of travel, speeds and traffic conditions, description of fleeing vehicle and suspect(s), and notification to on-duty supervisor","Suspect ID only","Vehicle and starting location only"],correct:1,fb:"SFM Section XVII: Notify dispatcher of: (a) The pursuit and reason, (b) Starting location, (c) Direction of travel, (d) Speeds and traffic conditions, (e) Description of fleeing vehicle and suspect(s), (f) Notify the on-duty supervisor."},
{src:"STUDY",cat:"SFM: Pursuits & Emergency Driving",q:"SFM Section XVII: What two circumstances require the supervisor to order a pursuit discontinued?",opts:["When the suspect enters another county or weather deteriorates","When officers can identify the suspect OR when the pursuit creates a severe hazard","After 5 miles or 10 minutes","Only when the Chief orders it"],correct:1,fb:"SFM Section XVII: Order the pursuit discontinued if: officers can IDENTIFY THE SUSPECT (can arrest later), or the pursuit creates a SEVERE HAZARD to public safety."},
{src:"STUDY",cat:"SFM: Pursuits & Emergency Driving",q:"SFM Section XVII: What two documents must be completed to evaluate a pursuit or emergency run?",opts:["Offense report only","Pursuit Form AND Offense Report","Use of Force Report and Incident Report","Fleet Vehicle Report and Officer Statement"],correct:1,fb:"SFM Section XVII: Was all appropriate documentation completed? (PURSUIT FORM & OFFENSE REPORT). These must be properly dispensed to the Chief Deputy, Assistant Chief, and Designated Captain."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — FIRST REPORT OF INJURY (Section XVIII)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: First Report of Injury",q:"SFM Section XVIII: Within what timeframe must the First Report of Injury reports be properly distributed?",opts:["24 hours","48 hours","72 hours","End of shift"],correct:0,fb:"SFM Section XVIII: All reports must be PROPERLY DISTRIBUTED WITHIN 24 HOURS. Original goes to Administrative Office; copies to Chief Deputy, Assistant Chief, and Divisional Captain; on weekends/holidays, fax to Harris County Loss Prevention at 713-755-8869."},
{src:"STUDY",cat:"SFM: First Report of Injury",q:"SFM Section XVIII: What is the fax number for Harris County Loss Prevention for weekend/holiday First Report of Injury submissions?",opts:["713-755-8020","713-755-8869","713-755-7097","713-755-6055"],correct:1,fb:"SFM Section XVIII: On weekends and holidays, reports are to be FAXED to Harris County Loss Prevention at: (713) 755-8869."},
{src:"STUDY",cat:"SFM: First Report of Injury",q:"SFM Section XVIII: On Line 17 of the TWCC-1 (First Report of Injury), what must be entered if no time was lost due to injury?",opts:["Leave blank","Enter 'N/A'","Indicate 'no lost time' — do not leave the line blank","Enter the date of the injury"],correct:2,fb:"SFM Section XVIII: Line 17 — Date lost time began: if no time lost due to injury, INDICATE 'NO LOST TIME.' DO NOT LEAVE LINE BLANK."},
{src:"STUDY",cat:"SFM: First Report of Injury",q:"SFM Section XVIII: Who must complete lines 29-38 and line 51 of the TWCC-1 First Report of Injury?",opts:["The injured employee","The investigating supervisor","Personnel within the Administrative Office","The doctor or medical provider"],correct:2,fb:"SFM Section XVIII: Lines 29-38 and line 51 are to be completed by PERSONNEL WITHIN THE ADMINISTRATIVE OFFICE (indicated by ** in the manual). These include date of hire, length of service, employee classification code, rate of pay, etc."},
{src:"STUDY",cat:"SFM: First Report of Injury",q:"SFM Section XVIII: What must be given to the injured employee regarding Worker's Compensation?",opts:["A business card only","Harris County Worker's Compensation Verification form, review of 'Procedures for Worker's Compensation Injury,' and review of 'Worker's Compensation Fact Sheet'","Only the TWCC-1 form","Verbal instructions only"],correct:1,fb:"SFM Section XVIII: Give the injured employee: (1) Harris County Worker's Compensation Verification Form, (2) Review 'PROCEDURES FOR WORKER'S COMPENSATION INJURY' — copy given to employee, (3) Review 'WORKER'S COMPENSATION FACT SHEET' — copy given to employee."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — HAZARDOUS MATERIALS (Section XIX)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Hazardous Materials",q:"SFM Section XIX: When approaching a HAZMAT incident, officers should approach from which direction and why?",opts:["Downwind to assess smoke direction","Upwind, if possible, to locate survivors/victims and help contain a spill","Perpendicular to avoid gas clouds","Officers should not approach at all"],correct:1,fb:"SFM Section XIX: Approach the incident UPWIND, if possible, to locate survivors and victims, and to help contain a spill or leakage (under fire department direction)."},
{src:"STUDY",cat:"SFM: Hazardous Materials",q:"SFM Section XIX: If the nature of hazardous materials does not permit approaching the scene, what is the minimum safe distance for officers and bystanders?",opts:["Officers: 100 feet; bystanders: 300 feet","Officers: 300 feet; bystanders: 1500 feet","Officers: 500 feet; bystanders: 1000 feet","Officers: 50 feet; bystanders: 200 feet"],correct:1,fb:"SFM Section XIX: If the nature of hazardous materials does not permit approaching the scene, keep at least 300 FEET AWAY (and keep bystanders at least 1500 FEET AWAY)."},
{src:"STUDY",cat:"SFM: Hazardous Materials",q:"SFM Section XIX: If radiological materials are present at a HAZMAT scene, what must officers do?",opts:["Approach cautiously with PPE","Secure the scene from a safe distance and DO NOT APPROACH the scene","Call EPA and wait for their arrival before doing anything","Evacuate and do not notify anyone until EPA arrives"],correct:1,fb:"SFM Section XIX: If RADIOLOGICAL MATERIALS are present, SECURE THE SCENE FROM A SAFE DISTANCE and DO NOT APPROACH THE SCENE."},
{src:"STUDY",cat:"SFM: Hazardous Materials",q:"SFM Section XIX: When a train is involved in a HAZMAT incident and the conductor is unavailable or incapacitated, where are the shipping papers obtained?",opts:["The caboose","The locomotive/engine compartment","Any rail car door","Contact the railroad company by phone"],correct:1,fb:"SFM Section XIX: Obtain shipping papers from the caboose (if a train is involved). If the conductor is incapacitated or unavailable, obtain consent from the ENGINE COMPARTMENT."},
{src:"STUDY",cat:"SFM: Hazardous Materials",q:"SFM Section XIX: What important resource is furnished in every police vehicle regarding hazardous materials identification?",opts:["OSHA chemical hazard list","U.S. Department of Transportation guidebook on hazardous materials","EPA spill response manual","DEA controlled substances chart"],correct:1,fb:"SFM Section XIX: Each police vehicle is furnished with a copy of the U.S. DEPARTMENT OF TRANSPORTATION GUIDEBOOK ON HAZARDOUS MATERIALS, which contains identifying information on chemical products, first-responder hazards, and specific countermeasures."},
{src:"STUDY",cat:"SFM: Hazardous Materials",q:"SFM Section XIX: What protective equipment does NOT protect against hazardous materials?",opts:["Full HAZMAT suits","Communicable disease protective equipment, leather gloves, or chemical agent gas masks","Level A encapsulating suits","SCBA breathing apparatus"],correct:1,fb:"SFM Section XIX: NOTE that communicable disease protective equipment, LEATHER GLOVES, or CHEMICAL AGENT GAS MASKS provide NO PROTECTION from hazardous materials."},
{src:"STUDY",cat:"SFM: Hazardous Materials",q:"SFM Section XIX: When informing Harris County OEM of a HAZMAT disaster, what aircraft-specific information must be provided if an aircraft is involved?",opts:["The airline and flight number","The serial number of the aircraft","The aircraft's fuel capacity","The number of passengers"],correct:1,fb:"SFM Section XIX: When reporting to Harris County OEM, include among the details: THE SERIAL NUMBER OF THE AIRCRAFT, if involved."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — MAJOR CRIME SCENES (Section XX)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Major Crime Scenes",q:"SFM Section XX: What is the HCSO Crime Scene Unit (CSU) phone number?",opts:["713-967-5811","713-755-7237 or 713-755-2417","713-221-6000","713-755-8020"],correct:1,fb:"SFM Section XX: HCSO Crime Scene Unit (C.S.U.): 713-755-7237 or 713-755-2417. HCSO Detectives daytime: 713-967-5811. Nighttime/no answer: 713-221-6000 (HCSO dispatch)."},
{src:"STUDY",cat:"SFM: Major Crime Scenes",q:"SFM Section XX: If detectives and ID Unit respond to a major crime scene, what is the supervisor's responsibility upon their arrival?",opts:["Stay in command of the scene","Relinquish command of the scene to the designated detective after a full briefing, including crime scene control and evidence collection","Leave the scene once detectives arrive","Continue processing evidence independently"],correct:1,fb:"SFM Section XX: RELINQUISH COMMAND of the scene to the designated detective after briefing, including crime scene control and evidence collection. Have the initial offense report and supporting supplements completed. Forward major incident form to Chief Deputy and Asst. Chief over patrol."},
{src:"STUDY",cat:"SFM: Major Crime Scenes",q:"SFM Section XX: What processing equipment must be readily available if detectives and CSU are NOT going to make the scene?",opts:["Only a camera","Digital camera/film, fingerprint kit with supplies, bags/envelopes/sealing tape, marking tools, and evidence tags and forms","CSU equipment only — call for it","Standard patrol equipment only"],correct:1,fb:"SFM Section XX: If detectives/CSU are not responding, ensure: (a) Digital camera and/or camera and film, (b) Fingerprint kit with supplies, (c) Bags, envelopes, and sealing tape, (d) Marking tools, (e) Evidence tags and forms."},
{src:"STUDY",cat:"SFM: Major Crime Scenes",q:"SFM Section XX: At a major crime scene with a deceased person, what must be done regarding personal effects?",opts:["Personal effects are photographed and released to family immediately","A complete inventory of personal effects found on or about any deceased persons must be completed","Personal effects are held by first officer until ME arrives","Only valuables are inventoried"],correct:1,fb:"SFM Section XX: Ensure that a COMPLETE INVENTORY is completed of PERSONAL EFFECTS found on or about any deceased persons at the scene."},

// ═══════════════════════════════════════════════
// SUPERVISOR FIELD MANUAL — MEDICAL AID (Section XXI)
// ═══════════════════════════════════════════════
{src:"STUDY",cat:"SFM: Medical Aid",q:"SFM Section XXI: Officers are strongly recommended to maintain which two minimum certifications for medical aid purposes?",opts:["EMT and CPR","Red Cross First Aid certification and Red Cross CPR certification","TCOLE First Aid and AED certification","Wilderness First Aid and trauma certification"],correct:1,fb:"SFM Section XXI: It is highly recommended that all officers maintain minimal certifications in RED CROSS FIRST AID and RED CROSS CARDIOPULMONARY RESUSCITATION (CPR)."},
{src:"STUDY",cat:"SFM: Medical Aid",q:"SFM Section XXI: Under what specific circumstances may an officer field-release an ill or injured person BEFORE arrest?",opts:["Only if the person requests it","The offense is a misdemeanor and suspect is not a flight risk; agency personnel were NOT involved in the illness/injury; AND the injury/illness is serious","Any time the person appears ill","Supervisor discretion only"],correct:1,fb:"SFM Section XXI: Field release if ill or injured before arrest only if: (a) Offense is a MISDEMEANOR and suspect is NOT a flight risk, (b) Agency personnel were NOT involved in the illness or injury, AND (c) The injury or illness IS SERIOUS."},
