<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constantinople 4 — Master Board Prep Quiz</title>
<script>
// Password gate — runs before anything else loads
(function(){
  const PASS = 'Password1';
  const SESSION_KEY = 'c4_auth';
  if(sessionStorage.getItem(SESSION_KEY) === '1') return; // already authenticated this session
  // Hide everything until authenticated
  document.addEventListener('DOMContentLoaded', function(){
    document.body.style.display='none';
    showLogin();
  });
  function showLogin(){
    document.body.style.display='';
    document.body.innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1b2a;background-image:radial-gradient(ellipse at 20% 20%,rgba(201,168,76,.07) 0%,transparent 50%);">
        <div style="background:rgba(46,64,87,.6);border:1px solid rgba(201,168,76,.3);border-radius:8px;padding:40px 32px;max-width:360px;width:90%;text-align:center;">
          <div style="font-size:2rem;color:#c9a84c;margin-bottom:6px;">★</div>
          <div style="font-family:'Georgia',serif;font-size:1.3rem;color:#c9a84c;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;">Constantinople 4</div>
          <div style="font-size:.75rem;color:#8899aa;letter-spacing:.08em;text-transform:uppercase;margin-bottom:28px;">Board Prep · Private Access</div>
          <input id="pw-input" type="password" placeholder="Enter password"
            style="width:100%;background:rgba(13,27,42,.8);border:1px solid rgba(201,168,76,.3);border-radius:4px;padding:13px 14px;color:#f0eff4;font-size:1rem;margin-bottom:12px;outline:none;font-family:Georgia,serif;"
            onkeydown="if(event.key==='Enter')checkPw()"
          />
          <div id="pw-error" style="color:#ff9f9f;font-size:.82rem;margin-bottom:10px;min-height:18px;"></div>
          <button onclick="checkPw()"
            style="width:100%;background:#c9a84c;color:#0d1b2a;border:none;border-radius:3px;padding:13px;font-family:Georgia,serif;font-size:.9rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;">
            Enter
          </button>
        </div>
      </div>`;
    // Re-attach font
    const link=document.createElement('link');
    link.rel='stylesheet';
    link.href='https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap';
    document.head.appendChild(link);
    setTimeout(()=>document.getElementById('pw-input').focus(),100);
  }
  window.checkPw=function(){
    const val=document.getElementById('pw-input').value;
    if(val===PASS){
      sessionStorage.setItem(SESSION_KEY,'1');
      location.reload(); // reload the full page now that session is set
    } else {
      document.getElementById('pw-error').textContent='Incorrect password. Try again.';
      document.getElementById('pw-input').value='';
      document.getElementById('pw-input').focus();
    }
  };
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0d1b2a;--gold:#c9a84c;--gold-light:#e8cc80;--steel:#2e4057;--fog:#f0eff4;--white:#fff;--red:#c0392b;--green:#1a6b3a;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Source Serif 4',Georgia,serif;background:var(--navy);color:var(--fog);min-height:100vh;background-image:radial-gradient(ellipse at 20% 20%,rgba(201,168,76,.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(46,64,87,.5) 0%,transparent 60%);}
  header{text-align:center;padding:30px 20px 14px;border-bottom:2px solid var(--gold);}
  header::before{content:'★';display:block;font-size:1.6rem;color:var(--gold);margin-bottom:4px;}
  h1{font-family:'Oswald',sans-serif;font-size:clamp(1.1rem,4vw,2rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);}
  .subtitle{font-size:.75rem;color:#8899aa;letter-spacing:.08em;margin-top:4px;text-transform:uppercase;}
  .stats-bar{display:flex;justify-content:center;gap:24px;padding:10px 0 0;font-family:'Oswald',sans-serif;font-size:.75rem;letter-spacing:.08em;color:#8899aa;text-transform:uppercase;}
  .stats-bar span{color:var(--gold-light);}
  #app{max-width:800px;margin:0 auto;padding:22px 14px 60px;}

  /* SEARCH + FILTER BAR */
  .filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .search-input{flex:1;min-width:180px;background:rgba(46,64,87,.6);border:1px solid rgba(201,168,76,.3);border-radius:4px;padding:9px 12px;color:var(--fog);font-family:'Source Serif 4',serif;font-size:.88rem;}
  .search-input:focus{outline:none;border-color:var(--gold);}
  .search-input::placeholder{color:#566a7f;}
  .filter-select{background:rgba(46,64,87,.6);border:1px solid rgba(201,168,76,.3);border-radius:4px;padding:9px 10px;color:var(--fog);font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:.05em;cursor:pointer;}
  .filter-select:focus{outline:none;border-color:var(--gold);}

  /* CATEGORY GRID */
  #category-screen h2{font-family:'Oswald',sans-serif;letter-spacing:.1em;color:var(--gold-light);margin-bottom:12px;font-size:.92rem;text-transform:uppercase;}
  .category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;margin-bottom:18px;max-height:420px;overflow-y:auto;padding-right:4px;}
  .category-grid::-webkit-scrollbar{width:4px;}
  .category-grid::-webkit-scrollbar-thumb{background:rgba(201,168,76,.4);border-radius:2px;}
  .cat-btn{background:var(--steel);border:1px solid rgba(201,168,76,.25);border-radius:4px;padding:11px 10px;color:var(--fog);font-family:'Oswald',sans-serif;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .18s;text-align:left;width:100%;}
  .cat-btn:hover,.cat-btn.selected{border-color:var(--gold);background:#3a5070;color:var(--gold-light);}
  .cat-btn.selected{box-shadow:inset 3px 0 0 var(--gold);}
  .cat-btn .cat-info{display:flex;justify-content:space-between;align-items:center;margin-top:3px;}
  .cat-btn .count{font-family:'Source Serif 4',serif;font-size:.68rem;color:#8899aa;font-style:italic;text-transform:none;letter-spacing:0;}
  .cat-btn .src-tag{font-size:.6rem;padding:1px 5px;border-radius:2px;text-transform:uppercase;letter-spacing:.04em;}
  .src-sop{background:rgba(52,152,219,.25);color:#7ecfff;}
  .src-orb{background:rgba(231,76,60,.2);color:#ff9f9f;}
  .src-study{background:rgba(46,204,113,.2);color:#9affc0;}
  .src-law{background:rgba(155,89,182,.25);color:#d7aaff;}

  /* QUIZ SCREEN */
  .progress-wrap{background:rgba(255,255,255,.1);border-radius:2px;height:4px;margin-bottom:20px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width .4s ease;}
  .q-meta{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px;}
  .q-left{display:flex;flex-direction:column;gap:3px;}
  .q-num{font-family:'Oswald',sans-serif;font-size:.76rem;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;}
  .q-src{font-size:.67rem;color:#8899aa;font-style:italic;}
  .q-cat{font-size:.68rem;color:#8899aa;font-style:italic;text-align:right;max-width:48%;}
  .question-card{background:rgba(46,64,87,.5);border:1px solid rgba(201,168,76,.22);border-radius:6px;padding:20px 18px;margin-bottom:14px;}
  .question-text{font-size:.98rem;line-height:1.7;color:var(--white);font-weight:300;}
  .options{display:flex;flex-direction:column;gap:7px;}
  .opt-btn{background:rgba(13,27,42,.8);border:1px solid rgba(255,255,255,.13);border-radius:4px;padding:11px 14px;color:var(--fog);font-family:'Source Serif 4',serif;font-size:.88rem;cursor:pointer;text-align:left;transition:all .18s;line-height:1.45;display:flex;align-items:flex-start;gap:8px;}
  .opt-btn .opt-letter{font-family:'Oswald',sans-serif;font-size:.75rem;color:var(--gold);min-width:14px;margin-top:1px;letter-spacing:.06em;}
  .opt-btn:hover:not(:disabled){border-color:var(--gold);background:rgba(46,64,87,.8);}
  .opt-btn.correct{border-color:#2ecc71;background:rgba(26,107,58,.4);color:#aaffcc;}
  .opt-btn.correct .opt-letter{color:#2ecc71;}
  .opt-btn.wrong{border-color:var(--red);background:rgba(192,57,43,.3);color:#ffaaaa;}
  .opt-btn.wrong .opt-letter{color:var(--red);}
  .opt-btn:disabled{cursor:default;}
  .feedback-box{margin-top:11px;padding:13px 15px;border-radius:4px;font-size:.85rem;line-height:1.7;display:none;}
  .feedback-box.show{display:block;}
  .feedback-box.correct-fb{background:rgba(26,107,58,.3);border-left:4px solid #2ecc71;color:#ccffdd;}
  .feedback-box.wrong-fb{background:rgba(192,57,43,.2);border-left:4px solid var(--red);color:#ffdddd;}
  .feedback-box strong{display:block;font-family:'Oswald',sans-serif;letter-spacing:.06em;margin-bottom:4px;font-size:.78rem;text-transform:uppercase;}
  .feedback-box .fb-source{display:block;margin-top:6px;font-size:.75rem;color:#8899aa;font-style:italic;}

  /* BUTTONS */
  .btn{font-family:'Oswald',sans-serif;font-size:.84rem;letter-spacing:.1em;text-transform:uppercase;padding:11px 22px;border-radius:3px;border:none;cursor:pointer;transition:all .2s;}
  .btn-primary{background:var(--gold);color:var(--navy);font-weight:600;}
  .btn-primary:hover{background:var(--gold-light);}
  .btn-secondary{background:transparent;border:1px solid var(--gold);color:var(--gold);}
  .btn-secondary:hover{background:rgba(201,168,76,.1);}
  .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:#8899aa;font-size:.76rem;padding:8px 14px;}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
  .btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

  /* RESULTS */
  #results-screen{text-align:center;padding-top:6px;}
  .score-ring{position:relative;width:120px;height:120px;margin:14px auto 6px;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .score-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Oswald',sans-serif;font-size:2rem;color:var(--gold);line-height:1;}
  .score-label{font-size:.8rem;color:#8899aa;letter-spacing:.1em;text-transform:uppercase;margin-bottom:18px;}
  .result-msg{font-size:.96rem;font-weight:300;color:var(--fog);margin-bottom:18px;font-style:italic;}
  .result-breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:0 auto 20px;max-width:520px;}
  .breakdown-card{background:rgba(46,64,87,.4);border-radius:4px;padding:10px;text-align:center;}
  .breakdown-card .bd-num{font-family:'Oswald',sans-serif;font-size:1.4rem;color:var(--gold-light);}
  .breakdown-card .bd-label{font-size:.68rem;color:#8899aa;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  .review-list{text-align:left;margin-top:20px;}
  .review-list h3{font-family:'Oswald',sans-serif;color:var(--gold-light);letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;margin-bottom:10px;}
  .review-item{background:rgba(46,64,87,.4);border-radius:4px;padding:10px 12px;margin-bottom:6px;border-left:4px solid transparent;}
  .review-item.r-correct{border-color:#2ecc71;}
  .review-item.r-wrong{border-color:var(--red);}
  .review-item .ri-q{color:var(--white);margin-bottom:4px;line-height:1.4;font-size:.84rem;}
  .review-item .ri-a{color:#8899aa;font-style:italic;font-size:.78rem;}
  .review-item .ri-a span{color:var(--gold-light);font-style:normal;}
  .review-item .ri-src{color:#566a7f;font-size:.7rem;margin-top:3px;}

  .hidden{display:none!important;}
  #start-selected-btn{display:none;}
  .sel-all-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
</style>
</head>
<body>
<header>
  <h1>Master Board Prep</h1>
  <p class="subtitle">SOPs &bull; Policy &amp; Ethics &bull; Texas Law &bull; Oral Review Board</p>
  <div class="stats-bar">Total questions: <span id="total-count">—</span> &nbsp;|&nbsp; Topics: <span id="topic-count">—</span></div>
</header>

<div id="app">
  <!-- CATEGORY SCREEN -->
  <div id="category-screen">
    <h2>Select topics to study</h2>
    <div class="filter-bar">
      <input class="search-input" id="cat-search" placeholder="Search topics…" oninput="filterCats()">
      <select class="filter-select" id="src-filter" onchange="filterCats()">
        <option value="">All sources</option>
        <option value="SOP">SOPs</option>
        <option value="ORB">Oral Board</option>
        <option value="LAW">Texas Law</option>
        <option value="STUDY">Study Guide</option>
      </select>
    </div>
    <div class="sel-all-row">
      <button class="btn-ghost btn" onclick="selectAll()">Select All</button>
      <button class="btn-ghost btn" onclick="clearAll()">Clear All</button>
    </div>
    <div class="category-grid" id="cat-grid"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="startQuiz('all')">Quiz All Topics</button>
      <button class="btn btn-secondary" id="start-selected-btn" onclick="startQuiz('selected')">Quiz Selected (<span id="sel-count">0</span>)</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="hidden">
    <div class="progress-wrap"><div class="progress-fill" id="prog-fill"></div></div>
    <div class="q-meta">
      <div class="q-left">
        <span class="q-num" id="q-num"></span>
        <span class="q-src" id="q-src"></span>
      </div>
      <span class="q-cat" id="q-cat"></span>
    </div>
    <div class="question-card"><p class="question-text" id="q-text"></p></div>
    <div id="q-body"></div>
    <div class="feedback-box" id="feedback-box"></div>
    <div class="btn-row" id="action-row"></div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn btn-ghost" onclick="resetToCategories()">← Back to Topics</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen" class="hidden">
    <div class="score-ring">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
        <circle cx="60" cy="60" r="52" fill="none" stroke="var(--gold)" stroke-width="10" stroke-linecap="round" id="score-arc" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
      </svg>
      <div class="score-text" id="score-pct"></div>
    </div>
    <div class="score-label" id="score-raw"></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-breakdown" id="breakdown"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry This Quiz</button>
      <button class="btn btn-secondary" onclick="resetToCategories()">Back to Topics</button>
    </div>
    <div class="review-list" id="review-list"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────
// QUESTION DATABASE
// Sources: SOP=Standard Operating Procedures, ORB=Oral Review Board, LAW=Texas Law, STUDY=Study Guide
// ─────────────────────────────────────────────────────────
const Q=[

// ══════════════════════════════════════════════
// ORAL REVIEW BOARD QUESTIONS
// ══════════════════════════════════════════════

// ── PURSUIT ──────────────────────────────────
{src:"ORB",cat:"Pursuit & Vehicle Stops",
q:"You hear a deputy pursuing a maroon Chevy Malibu matching a BOLO from an aggravated robbery. What is your first action as supervisor?",
opts:["Authorize the pursuit indefinitely since it matches the BOLO","Check speeds and traffic conditions, have dispatch get more info from the agency working the robbery, and terminate if conditions deteriorate","Respond to the scene and take over the pursuit yourself","Contact the DA's office before taking any action"],
correct:1,
fb:"Per oral board: Check speeds and traffic conditions, have dispatch confirm more info with the working agency. If no additional vehicle info exists and conditions deteriorate, terminate — the potential costs outweigh the reward."},

{src:"ORB",cat:"Pursuit & Vehicle Stops",
q:"A deputy is pursuing a vehicle at 80 MPH on FM 1960 at 0200 hours, running red lights. The vehicle matches a homicide suspect description but the plate cannot be confirmed. What do you do?",
opts:["Authorize the pursuit since it is a homicide suspect","Allow the pursuit to continue until the plate is confirmed","Assess traffic conditions, attempt positive ID — if conditions are dangerous or no probable cause exists to confirm the vehicle, terminate the pursuit","Immediately terminate all pursuits at 0200 hours regardless of circumstances"],
correct:2,
fb:"Per oral board: Assess what reason exists for the pursuit, check traffic. At 0200 when bars are closing, if the situation becomes dangerous or there is no probable cause to confirm the vehicle, terminate. Safety of the public is paramount."},

{src:"ORB",cat:"Pursuit & Vehicle Stops",
q:"You are en route to a major accident with serious bodily injury. A deputy on back channel says injuries appear non-life-threatening and tells you to disregard — he'll work it. You know Life Flight has been put on standby by EMS. What do you do?",
opts:["Disregard as the deputy suggested","Continue to the scene — it is a supervisor's job, not a deputy's, to make that determination","Ask dispatch to confirm whether Life Flight is still coming before deciding","Turn around but monitor by radio"],
correct:1,
fb:"Per oral board: Advise the deputy you will continue to the call. It is the SUPERVISOR'S job to make the determination on scene, not the deputy's. The deputy needs to secure the scene and gather witness/party information."},

// ── JUVENILE SITUATIONS ───────────────────────
{src:"ORB",cat:"Juvenile Incidents",
q:"An 11-year-old student has trashed a classroom and is still out of control. No parent can be reached, and juvenile probation won't accept them on a Class C. What do you do?",
opts:["Leave the juvenile with school staff and complete a report","Restrain the juvenile using least force necessary, exhaust all means to contact parents, issue a citation for disrupting class, transport to CPS if parents cannot be located, complete an offense report","Immediately transport the juvenile to juvenile detention","Wait at the school until a parent arrives, however long it takes"],
correct:1,
fb:"Per oral board: Get other kids out. Restrain the juvenile using least force necessary. Exhaust all contact avenues — units to the house, neighbors for alternate numbers, places of work. If all avenues fail, issue citation for disrupting class, transport to CPS, complete an offense report, send pass on, notify chain of command."},

{src:"ORB",cat:"Juvenile Incidents",
q:"You respond to a backup call at an elementary school for a 7-year-old male out of control, turning over desks and chairs. What do you do?",
opts:["Have everyone exit the room, handcuff the child using minimum force, exhaust all means to locate parents, and take to CPS only if parents cannot be found","Immediately transport the child to a juvenile facility","Call CPS first before attempting to contact parents","Do not handcuff — the child is only 7 years old"],
correct:0,
fb:"Per oral board: Have everyone exit. Handcuff using the LEAST amount of force possible for the child's safety. Contact parents via school records, then neighbors, then places of work. Advise parents they are civilly liable for damages. Only take to CPS after ALL possible means of locating a parent are exhausted."},

{src:"ORB",cat:"Juvenile Incidents",
q:"An irate mother at the station believes her juvenile son might be coerced into giving a statement. He is handcuffed to a chair inside. What do you do?",
opts:["Allow the mother in only after questioning is complete","Immediately allow the mother access — parent/legal guardian must be present during processing, questioning, statements, breath test, and video; then determine who denied her access and take appropriate disciplinary action","Allow her to watch through glass only","Tell her she must wait outside and file a formal complaint"],
correct:1,
fb:"Per oral board: Parent, legal guardian, or attorney MUST be allowed to be present during ALL processing — questioning, written statement, breath test, and video. After providing access, as supervisor you must determine who denied her entry and take appropriate disciplinary action."},

// ── VEHICLE / PROPERTY ────────────────────────
{src:"ORB",cat:"Vehicles & Property",
q:"Three adults are outside their vehicles on county property, drinking and smoking marijuana. A deputy detains them and spots a baggy of marijuana inside one of the vehicles. The deputy asks to tow the vehicles. What do you tell the deputy?",
opts:["Authorize the tow since controlled substances are present","Do not tow — the subjects were not inside the vehicles when the offenses occurred; vehicles must be stickered and can be removed after 48 hours. The deputy may seize the visible marijuana under plain view.","Tow the vehicle and hold it as evidence","The deputy cannot seize the marijuana without a warrant"],
correct:1,
fb:"Per oral board: Because the subjects were NOT inside the vehicles when the offense took place, the vehicles cannot be towed. They must be stickered and removed after 48 hours. The deputy CAN seize the marijuana observed in plain view."},

{src:"ORB",cat:"Vehicles & Property",
q:"A deputy arrested someone in a vehicle for possession of a controlled substance but could not locate a K9. The vehicle was towed to storage. The next morning the deputy wants to bring a K9 to the storage lot. What do you tell him?",
opts:["Approve it — the vehicle is still part of the case","Advise the deputy that exigent circumstances no longer exist; the vehicle has not been kept at a secure facility and many people have had access — any evidence found would be easily thrown out","Approve it only if the registered owner consents","Tell him to get a warrant first and then the K9 can search"],
correct:1,
fb:"Per oral board: The vehicle no longer falls under exigent circumstances. It has not been in a secure facility — the wrecker driver and others have had access. Any contraband found would not be admissible. The secondary search would be pointless."},

// ── SEIZURE / ASSET FORFEITURE ────────────────
{src:"ORB",cat:"Seizure & Asset Forfeiture",
q:"An undercover unit from another agency flags down your deputy to make a traffic stop. The undercover unit arrests the suspect. What must you do to ensure Precinct 4 receives its share of any property or money seized?",
opts:["Let the other agency handle the seizure entirely","Generate a case number documenting Precinct 4's participation, assist in contacting the DA's office for charges and seizure, obtain the requesting officer's name and agency, send a pass on and notify supervisor","Only complete an ARS report — no other action required","Contact the DA's office yourself and exclude the other agency"],
correct:1,
fb:"Per oral board: Generate a case number documenting participation. Assist in contacting the DA's office for charges and seizure. Obtain the requesting officer's name and agency. Send pass on and notify supervisor."},

// ── WARRANTS IN KIDS CUSTODY ──────────────────
{src:"ORB",cat:"Warrants on Arrest",
q:"A female is stopped with open warrants and has children in the vehicle. She lives on the southwest side and has no one to get them. What do you do?",
opts:["Book the female and immediately place the children in CPS","Exhaust all possible avenues to find placement for the children — try calling another deputy, let the female make calls to family/friends/neighbors; only if all leads are exhausted take children to CPS; complete an offense report, pass on, and notify supervisor","Release the female on personal bond so she can care for the children","Leave the children in a locked vehicle until a family member arrives"],
correct:1,
fb:"Per oral board: Exhaust ALL possible avenues first — try calling another deputy to take children to family/friend/neighbor. Let the female make calls; if no phone, make calls for her. Only after all leads are exhausted take children to CPS. Complete offense report, pass on, notify supervisor."},

// ── WRITS ────────────────────────────────────
{src:"ORB",cat:"Writs & Civil Process",
q:"You are met by a male with a Writ of Attachment from Hidalgo County Court. What must be on the writ for it to be valid?",
opts:["Only requires judge's signature and date","Must be styled 'The State of Texas,' directed to any sheriff or constable, made returnable on the Monday next after expiration of 20 days from service, dated and attested by the clerk with the court seal, and the date of issuance noted","Only requires the court case number and the name of the person to be attached","Requires the signature of the Constable of the serving county"],
correct:1,
fb:"Per oral board (Rule 15): The writ must be styled 'The State of Texas,' directed to any sheriff or constable within the state, returnable on the Monday next after expiration of 20 days from date of service, dated and attested by the clerk with court seal impressed, and the date of issuance noted. Verify the date is valid."},

{src:"ORB",cat:"Writs & Civil Process",
q:"A separated spouse presents you with a Writ of Attachment from a Kentucky court for children in the home. What do you do?",
opts:["Execute the writ and hand over the children","Advise her we cannot enforce judgments from other states; provide her the address and phone number of the appropriate family court in Texas and the civil division; tell her to leave the property or face criminal trespass; check on the welfare of the children","Contact the Kentucky court to verify the writ","Have the homeowner comply since the writ appears legitimate"],
correct:1,
fb:"Per oral board: Look up the family court address and telephone number and carefully explain the process. We cannot enforce judgments from other states. Give her the civil division number. Advise her to leave the property — otherwise enforce criminal trespass law. Check the welfare of the children."},

{src:"ORB",cat:"Writs & Civil Process",
q:"A cable company supervisor wants you to move a homeowner so his crew can trench through the yard to install cable. What court order does the cable company need?",
opts:["Writ of Possession","Writ of Attachment","Writ of Injunction or Writ of Mandamus","Distress Warrant"],
correct:2,
fb:"Per oral board: Advise the cable company they need to file a Writ of Injunction or Mandamus. Provide them the phone number and location of a county or district court, and the civil division number for assistance once they have proper documents."},

{src:"ORB",cat:"Writs & Civil Process",
q:"Two Grimes County detectives want to execute a search warrant in Harris County. Your shift corporal says the warrant is invalid because it was signed by a Grimes County judge. Is the corporal correct, and what do you do?",
opts:["No — the corporal is wrong; warrants are valid across county lines","Yes — the corporal is correct; advise detectives they need a Harris County warrant, provide the DA's office phone number and location, and offer assistance securing the location if needed","No — only a judge can make that determination","Yes, but immediately arrest the detectives for unauthorized warrant service"],
correct:1,
fb:"Per oral board: The corporal is CORRECT. Advise them they need a warrant signed by a Harris County judge. Give them the Harris County DA's office phone number and location. Offer assistance securing the location if appropriate (unless they haven't made contact with occupants yet)."},

// ── SEARCH & SEIZURE ──────────────────────────
{src:"ORB",cat:"Search Warrant Requirements",
q:"What are the four basic requirements for a valid search warrant, and how long is given to execute it?",
opts:["Named in State of Texas, signed by a judge, description of items to search for, detailed description of location — valid for 72 hours excluding date of issuance and date of return","Named in State of Texas, signed by any peace officer, description of the suspect, list of evidence expected — valid for 48 hours","Signed by the DA, naming the offense, naming the suspect, a detailed location — valid for 7 days","Signed by a magistrate, naming the suspect, naming the agency, specifying county — valid for 5 days"],
correct:0,
fb:"Per oral board: (1) Styled in the name of the 'State of Texas,' (2) Signed by a judge, (3) A description of the items to be searched for, (4) A detailed description of the location being searched. Valid for 72 hours excluding the date of issuance AND the date of return."},

// ── EVICTION ─────────────────────────────────
{src:"ORB",cat:"Eviction Process",
q:"A landlord wants you to remove a tenant who is behind on rent. What do you tell him about the eviction process?",
opts:["Tell him we can remove the tenant immediately if he has a lease violation","Explain the 3-step process: serve a 3-day vacate letter; after it lapses, file a Forcible Entry and Detainer (hearing held); if the court rules for the landlord, after 5 days he can file for a Writ of Possession (civil division comes out with movers); provide the civil division phone number","Tell him to call the police — it is not a constable matter","Advise him to file with the District Court"],
correct:1,
fb:"Per oral board: 3-day vacate letter → Forcible Entry and Detainer hearing → if court finds for landlord, after 5 days file for Writ of Possession (civil division comes out with a moving company). Provide the landlord the civil division phone number."},

correct:0,

// ── DOMESTIC VIOLENCE / DISTURBANCE ──────────
{src:"ORB",cat:"Family Disturbances",
q:"You are at a family disturbance call and an attorney approaches demanding you issue a citation and make an arrest. What is your response?",
opts:["Comply with the attorney's demand since he has legal authority","Advise the attorney that you will only issue a citation or make an arrest if probable cause exists; the scene is still active and he needs to leave","Ask the attorney to wait and consult with the DA's office first","Immediately issue the citation to avoid further conflict"],
correct:1,

{src:"ORB",cat:"Peace Bonds & Protective Orders",

opts:["31 days","61 days, or 91 days if a weapon was involved","90 days, extendable to 2 years","30 days only"],

// ── JUVENILES DRINKING ────────────────────────
{src:"ORB",cat:"Juvenile Incidents",
q:"Juveniles run inside a residence when you arrive, leaving a keg on the porch. They are visible inside drinking and refuse to open the door. What do you do?",
opts:["Force entry since a crime is in progress","Do not force entry; attempt to contact occupants, check ARS/JIMS for parent phone numbers, contact neighbors, check registered vehicle addresses, contact TABC, if all fails issue citations for illegally parked vehicles, complete offense report, have deputies continue patrolling, contact supervisor, send pass on","Get a warrant and return to make entry","Arrest all juveniles by forcing entry"],
correct:1,
fb:"Per oral board: Do NOT force entry. Knock, check ARS for phone numbers, crisscross address in JIMS, contact neighbors for parent numbers, check registered addresses of vehicles in driveway/street, attempt to locate other children's parents, contact TABC. If all else fails, issue citations for illegally parked vehicles. Complete offense report, have deputies continue patrolling, contact supervisor, send pass on."},

// ── EXCESSIVE FORCE ───────────────────────────
{src:"ORB",cat:"Use of Force & Penal Code",
q:"A deputy privately tells you he witnessed another deputy use excessive force on a handcuffed prisoner whose face is swollen. What do you do?",
opts:["Wait for the deputy to file a formal complaint before acting","Secure any audio/video of the incident, personally go see the prisoner and get EMS if needed, conduct a full investigation including statements from all nearby deputies, take photos, notify on-duty/on-call supervisor, document in a use of force report, and refer to Internal Affairs","Only document the complaint and forward to the Lieutenant","Have the reporting deputy write a statement and do nothing further until IA is assigned"],
correct:1,
fb:"Per oral board: Secure audio/video evidence. Go see the prisoner personally — get EMS if needed. Fully investigate by interviewing deputies who were around. Take photos. Notify on-duty/on-call supervisor. Document in a use of force report. As supervisor you cannot ignore a report like that — refer to Internal Affairs."},

// ── CAR SHARE ────────────────────────────────
{src:"ORB",cat:"Supervision & Administration",
q:"A deputy complains about his car share — dirty car, refuses to remove trash, always low on fuel, always breaking down. How do you handle this?",
opts:["Immediately issue written counseling to the car share without investigating","Find out if the deputy has spoken to his car share; go inspect the car yourself; make notes of its condition; coordinate with the other car share's supervisor; speak to the car share; if the complaint is valid, document after checking for prior write-ups","Transfer the deputy to a different car share without investigation","Only address the issue if there is physical evidence of the problem"],
correct:1,
fb:"Per oral board: Find out if the deputy talked to his car share. Go look at the car yourself and take notes. Coordinate with the other car share's supervisor. Speak to the car share and hear his side. Check for any prior documentation on the issue. If the complaint is valid, document accordingly."},

// ── SUICIDE SCENE ────────────────────────────
{src:"ORB",cat:"Scene & Investigation",
q:"Dispatched to a reported suicide. You arrive to find the primary deputy gathering information. What are your responsibilities as supervisor?",
opts:["Simply review the deputy's report before clearing","Secure the scene; identify and separate all parties; contact Watch Command for detectives/CSU; notify on-duty/on-call supervisor; if HCSO is not coming, have photos taken; call ME's office; complete an offense report; have all on-scene units complete supplements; complete a major incident form","Only complete a major incident form and leave the scene to the deputy","Contact the DA's office immediately and wait for direction"],
correct:1,
fb:"Per oral board: Secure the scene. Secure, identify and separate all parties. Ask what happened to relay to Watch Command. Check the scene for evidence. Contact Watch Command for detectives and CSU. Notify on-duty/on-call supervisor. If HCSO is not responding, have photos taken. Call ME's office. Ensure offense report and supplements are completed. Complete a major incident form."},

// ── UNUSUAL DOA ───────────────────────────────
{src:"ORB",cat:"Scene & Investigation",
q:"You arrive at a DOA scene where the deceased was found in the shower with lacerations to the head. A witness says the deceased had known seizures and was on medication. What do you do?",
opts:["Treat it as a natural death and release the scene immediately","Secure the scene, contact Watch Command and report the incident; if homicide is coming out, hold for them; if not, call ME's office and have photos taken; complete a report and major incident form; notify chain of command","Only complete an ARS report and clear the scene","Have EMS determine the cause of death before doing anything else"],
correct:1,
fb:"Per oral board: Secure the scene. Contact Watch Command and report. If homicide is coming out, hold for them. If HCSO/CSU is not coming, call the ME's office and have photos taken. Complete a report and major incident form. Notify chain of command."},

// ── INFANT DEATH ORB ──────────────────────────
{src:"ORB",cat:"Infant Death (Crib)",
q:"Upon arriving at an infant death call, you learn the child was transported to the hospital (CPR was started at the scene). The babysitter found the baby not breathing in the crib. What do you do?",
opts:["Clear the scene since the child is already at the hospital","Secure the scene; identify and separate all parties; contact Watch Command for detectives/CSU; notify on-duty/on-call supervisor; if HCSO is not responding have photos taken; complete the offense report and have all on-scene units complete supplements; complete a major incident form","Send one deputy to the hospital and have everyone else clear the scene","Only contact the ME's office and wait"],
correct:1,
fb:"Per oral board: Secure the scene. Secure, identify and separate all parties. Ask what happened to relay to Watch Command. Check the scene for evidence. Contact Watch Command for detectives/CSU. Notify on-duty/on-call supervisor. If HCSO is not coming, have photos taken. Complete offense report with supplements. Complete a major incident form."},

// ── BODY ARMOR (SOP 1.011) ────────────────────
{src:"SOP",cat:"SOP 1.011 — Body Armor",
q:"SOP 1.011: Body armor is required at all times while on duty for patrol personnel. Under which circumstance is it NOT required, as long as it remains available?",
opts:["While in a marked patrol vehicle","During academy classes, administrative duties, or extra jobs (or at direction of the Divisional Assistant Chief)","Body armor is required at ALL times with no exceptions","While at the station completing reports"],
correct:1,
fb:"SOP 1.011: Patrol Personnel are not required to wear body armor during academy classes, administrative duties, and extra jobs, or at the discretion/direction of the Divisional Assistant Chief — BUT it must be available for wear should the need arise."},

{src:"SOP",cat:"SOP 1.011 — Body Armor",
q:"SOP 1.011: A deputy provides their own body armor. What is the requirement?",
opts:["Any commercially available vest is acceptable","Must meet the same threat level standards (or greater) as Department-issued body armor","Must be NIJ Level IIIA or higher regardless of department standard","Must receive individual approval from the Constable"],
correct:1,
fb:"SOP 1.011: Personally owned body armor must meet the SAME THREAT LEVEL STANDARDS (or greater) as the body armor issued by the Department."},

// ── ARREST PROCEDURES (SOP 2.001) ─────────────
{src:"SOP",cat:"SOP 2.001 — Arrest Procedures",
q:"SOP 2.001: For a Class C misdemeanor (other than public intoxication), a citation must contain which elements?",
opts:["Only the offense charged and date of appearance","Written notice of time and place to appear before a magistrate, the name and address of the person charged, and the offense charged","The DA's case number and bond amount","Just the officer's name and badge number"],
correct:1,
fb:"SOP 2.001: A Class C citation must contain: written notice of the TIME AND PLACE to appear before a magistrate, the NAME AND ADDRESS of the person charged, and the OFFENSE charged."},

{src:"SOP",cat:"SOP 2.001 — Arrest Procedures",
q:"SOP 2.001: Before obtaining an arrest warrant, an officer must confirm three things. Which is NOT one of them?",
opts:["Sufficient probable cause exists","The offense occurred within Harris County (jurisdiction)","The identification of the suspect is correct","The DA has pre-approved the warrant request"],
correct:3,
fb:"SOP 2.001: Before obtaining a warrant, the officer verifies: (1) sufficient probable cause, (2) offense occurred within jurisdiction (Harris County), (3) correct suspect identification. DA pre-approval is NOT a listed requirement."},

{src:"SOP",cat:"SOP 2.001 — Arrest Procedures",
q:"SOP 2.001: For an out-of-county warrant, teletype confirmation must include which element?",
opts:["Only the warrant number and bond amount","Name/race/sex/DOB, court case number, judge's name, bond amount, warrant number, holding agency, and pickup/extradition yes or no","Just the name and charge","The judge's name and the arresting deputy's ID number"],
correct:1,
fb:"SOP 2.001: Teletype confirmation must contain: name/race/sex/DOB, court case number, judge's name, bond amount, warrant number, agency holding the warrant, and whether pickup or extradition is authorized (yes/no)."},

{src:"SOP",cat:"SOP 2.001 — Arrest Procedures",
q:"SOP 2.001 MMDP: A person is eligible for the Misdemeanor Marijuana Diversion Program EXCEPT when:",
opts:["They are 17 or older","They have no outstanding warrants","They possess a concealed handgun AND marijuana — only the weapon charge is filed","They have Class C tickets only from the current detention"],
correct:2,
fb:"SOP 2.001: If the offender possesses a concealed handgun AND marijuana, they are NOT eligible for MMDP. The officer files ONLY the Unlawfully Carrying a Weapon charge. The marijuana is tagged as evidence in the weapon case."},

{src:"SOP",cat:"SOP 2.001 — Arrest Procedures",
q:"SOP 2.001 MMDP: An offender who participates in MMDP has how many calendar days to complete the 'Cognitive Decision Making' class?",
opts:["30 days","60 days","90 days","180 days"],
correct:2,
fb:"SOP 2.001: Offenders have 90 CALENDAR DAYS to complete the class. Failure results in a formal criminal charge being entered and an arrest warrant issued."},

{src:"SOP",cat:"SOP 2.001 — Arrest Procedures",
q:"SOP 2.001 MMDP: What happens to the marijuana evidence when an offender participates in MMDP?",
opts:["Submit to the crime lab immediately","Do NOT submit to the crime lab — tag under the offense report number and include the scanned Program Acknowledgment Form in the evidence envelope","Destroy it immediately","Store it only until the offender completes the class, then destroy"],
correct:1,
fb:"SOP 2.001: Officers should NOT submit marijuana to the crime lab when MMDP is used. TAG the marijuana under the offense report number and include the scanned form in the evidence envelope. The DA's office sends monthly destruction reports."},

// ── PRISONER TRANSPORT (SOP 2.002) ────────────
{src:"SOP",cat:"SOP 2.002 — Prisoner Transport",
q:"SOP 2.002: How must all prisoners be restrained prior to transport (standard conditions)?",
opts:["Handcuffed in front with a belly chain","Handcuffed (double locked) with hands behind back and palms outward","Flex-cuffed in any position","Handcuffed in front — hands behind back is not required"],
correct:1,
fb:"SOP 2.002: All prisoners must be handcuffed DOUBLE LOCKED with hands BEHIND THEIR BACK and PALMS OUTWARD before being placed in a transport vehicle."},

{src:"SOP",cat:"SOP 2.002 — Prisoner Transport",
q:"SOP 2.002: Where does a single prisoner ride in a vehicle WITH a security screen?",
opts:["Front passenger seat","Rear seat, driver's side","Rear seat, passenger side","Center of the rear seat"],
correct:2,
fb:"SOP 2.002: A single prisoner in a vehicle WITH a security screen is placed on the REAR SEAT, PASSENGER SIDE."},

{src:"SOP",cat:"SOP 2.002 — Prisoner Transport",
q:"SOP 2.002: How many deputies are required to transport a dangerous prisoner?",
opts:["1 if properly equipped","2 deputies","3 deputies minimum","Supervisor discretion only"],
correct:1,
fb:"SOP 2.002: TWO deputies are required to transport a dangerous prisoner."},

{src:"SOP",cat:"SOP 2.002 — Prisoner Transport",
q:"SOP 2.002: A juvenile may only be transported WITH an adult prisoner under what conditions?",
opts:["Never under any circumstances","Only when both were arrested at the crime scene AND transport is directly to a detention facility — also requires expressed permission from a juvenile DA documented in the offense report","Any time with supervisor approval","When no other transport vehicle is available"],
correct:1,
fb:"SOP 2.002: A juvenile may ONLY be transported with an adult prisoner when BOTH were arrested at the crime scene AND transport is directly to a detention facility. This also requires expressed permission of a juvenile DA, documented in the offense report."},

{src:"SOP",cat:"SOP 2.002 — Prisoner Transport",
q:"SOP 2.002: When can a deputy stop to provide law enforcement services while transporting a prisoner?",
opts:["Never — always proceed directly to the destination","To save a victim from harm, attend to an injured victim, or stop a crime in progress where safety demands immediate apprehension","Any time the deputy deems it necessary","Only if directed by a supervisor via radio"],
correct:1,
fb:"SOP 2.002: Deputies may stop during transport ONLY to: (1) save a victim from harm, (2) attend to an injured victim, or (3) stop a crime in progress where safety demands immediate apprehension of suspects."},

{src:"SOP",cat:"SOP 2.002 — Prisoner Transport",
q:"SOP 2.002: If a prisoner escapes, what is the FIRST thing the deputy must do?",
opts:["Complete an offense report","Immediately advise communications: location of escape, direction of travel, means of flight, physical/clothing description, weapons possessed, danger potential, outstanding charges, and request assistance and a supervisor","Contact the DA's office","Notify Watch Command only"],
correct:1,
fb:"SOP 2.002: IMMEDIATELY advise communications of: location of escape, direction of travel and means of flight, physical and clothing description, weapons possessed, danger potential and outstanding warrants/charges. Request assistance and a supervisor."},

// ── SEARCHES & SEIZURES (SOP 2.003) ───────────
{src:"SOP",cat:"SOP 2.003 — Searches & Seizures",
q:"SOP 2.003: When using a Consent to Search, which element is required?",
opts:["Consent only needs to be verbal","The consent must be obtained IN WRITING on the Department form","The property owner must be at least 21","The consenting person must be the legal owner of the property"],
correct:1,
fb:"SOP 2.003: Consent to Search requirements include: person has authority, consent is voluntary, consent is OBTAINED IN WRITING (Department form), person is present during search, and search is terminated immediately if consent is withdrawn."},

{src:"SOP",cat:"SOP 2.003 — Searches & Seizures",
q:"SOP 2.003: Under the Plain View Doctrine, an officer may seize:",
opts:["Any property visible from the street","Contraband, fruits, or instruments of a crime that are in plain view","Any evidence even if its incriminating nature is not immediately apparent","Any property the owner cannot immediately explain"],
correct:1,
fb:"SOP 2.003: Under the Plain View Doctrine, an officer may seize CONTRABAND, FRUITS, or INSTRUMENTS OF THE CRIME."},

{src:"SOP",cat:"SOP 2.003 — Searches & Seizures",
q:"SOP 2.003: After executing a search warrant, what must be left at the searched location?",
opts:["Nothing — all documents go to court","A copy of the warrant and the inventory of property seized","Only the return receipt","Just the warrant — the inventory goes directly to court"],
correct:1,
fb:"SOP 2.003: Leave A COPY OF THE WARRANT AND INVENTORY SEIZED at the location. Return the original warrant, affidavit, and inventory to the court within 72 hours (less date of issuance and return)."},

{src:"SOP",cat:"SOP 2.003 — Searches & Seizures",
q:"SOP 2.003: Prior to executing a search warrant, what must the supervisor and team do?",
opts:["Execute immediately upon receipt of the warrant","Meet with a patrol supervisor to plan: manpower, officer safety, layout, entry methods, assignments; confirm the place/thing/person matches the warrant; serve with affidavit attached","Contact the DA's office for approval before entry","Conduct surveillance for 48 hours minimum"],
correct:1,
fb:"SOP 2.003: Deputies must meet with a patrol supervisor PRIOR to service to plan all actions. Execute within legal time constraints. Confirm the location/person/thing matches the warrant. Serve with a copy of the affidavit attached."},

// ── VEHICLE TOWING & INVENTORY (SOP 2.005) ─────
{src:"SOP",cat:"SOP 2.005 — Vehicle Towing & Inventory",
q:"SOP 2.005: What is the definition of 'Valuables' for vehicle inventory purposes?",
opts:["Any item the owner considers valuable","Cash money of any value OR individual items of personal property with a value of $100.00 or more","Only items over $500","Jewelry and electronics only"],
correct:1,
fb:"SOP 2.005: 'Valuables' means cash money of any value OR individual items of personal property with a value of $100.00 OR MORE."},

{src:"SOP",cat:"SOP 2.005 — Vehicle Towing & Inventory",
q:"SOP 2.005: When must the vehicle inventory normally be conducted?",
opts:["After the tow company picks up the vehicle at the storage lot","BEFORE constructive custody of the vehicle is released to the third-party towing company","Within 24 hours of the vehicle arriving at storage","At the impound facility the next business day"],
correct:1,
fb:"SOP 2.005: The inventory shall be conducted BEFORE constructive custody is released to the third-party towing company, except when officer safety is at risk (then as soon as safely practical) or when the vehicle is being towed for evidentiary purposes."},

{src:"SOP",cat:"SOP 2.005 — Vehicle Towing & Inventory",
q:"SOP 2.005: Under what conditions may a locked closed container in a towed vehicle be SKIPPED in the inventory?",
opts:["Whenever the owner requests","When the locked container's key or unlocking mechanism will remain with the vehicle operator/owner and not be transferred to the tow company","When the container appears to contain only personal items","Never — all containers must be opened"],
correct:1,
fb:"SOP 2.005: A closed container that is locked AND whose key/unlocking mechanism will remain with the owner/operator (not transferred to the tow company) need NOT be opened for inventory."},

{src:"SOP",cat:"SOP 2.005 — Vehicle Towing & Inventory",
q:"SOP 2.005: Under what circumstances may a sworn peace officer order the towing of a vehicle?",
opts:["Only for abandoned vehicles or crash vehicles","Abandoned vehicles in right-of-way, vehicles blocking traffic, driver arrested/can't care for vehicle, recovered stolen vehicles, crash vehicles with incapacitated operator, vehicles seized as evidence, or under statutory authority","Only when the registered owner cannot be located","Only with supervisor approval in all cases"],
correct:1,
fb:"SOP 2.005: A sworn peace officer may order towing for: (1) abandoned vehicles in public right-of-way, (2) vehicles blocking traffic, (3) driver arrested/can't be located/incapable, (4) recovered stolen vehicles, (5) disabled crash vehicles, (6) vehicles seized as evidence, (7) under any statutory authority consistent with constitutional restrictions."},

// ── PHOTO & LINEUP ID (SOP 2.004) ─────────────
{src:"SOP",cat:"SOP 2.004 — Photo & Lineup ID",
q:"SOP 2.004: A photo spread must contain the suspect's photograph plus a minimum of how many fillers?",
opts:["3 fillers","4 fillers","5 fillers","6 fillers"],
correct:2,
fb:"SOP 2.004: A photo spread must contain the suspect's photograph plus a MINIMUM OF FIVE FILLERS whose race, sex, age, height, weight, hair style, and general appearance resemble the suspect."},

{src:"SOP",cat:"SOP 2.004 — Photo & Lineup ID",
q:"SOP 2.004: What is a 'Blind Administrator'?",
opts:["An administrator who is visually impaired","An administrator who knows neither the suspect's identity nor their position in the lineup","An administrator who knows the suspect but not their position","The assigned investigator on the case"],
correct:1,
fb:"SOP 2.004: A Blind Administrator is one who knows NEITHER the suspect's identity NOR the suspect's position in the photo spread, live lineup, or video lineup."},

{src:"SOP",cat:"SOP 2.004 — Photo & Lineup ID",
q:"SOP 2.004: A live lineup has a minimum of how many fillers?",
opts:["3 fillers","4 fillers","5 fillers","6 fillers"],
correct:1,
fb:"SOP 2.004: A live lineup or mock lineup should contain the suspect plus a MINIMUM OF FOUR FILLERS (photo spreads require five)."},

{src:"SOP",cat:"SOP 2.004 — Photo & Lineup ID",
q:"SOP 2.004: Which admonishment must be given to witnesses before a photo spread, live lineup, or video lineup?",
opts:["The suspect will definitely be in the lineup","The individual who committed the offense may or may not be present, and the witness is not required to make a selection","They must make an identification or the case will be dropped","The administrator will help guide them to the correct choice"],
correct:1,
fb:"SOP 2.004: Witnesses must be told: (1) The individual who committed the offense MAY OR MAY NOT be present, (2) the witness is NOT required to select any individual, (3) the investigation will continue whether or not an identification is made, (4) individuals may not appear exactly as they did at the time of the incident."},

{src:"SOP",cat:"SOP 2.004 — Photo & Lineup ID",
q:"SOP 2.004: A Show-Up must be conducted within what timeframe?",
opts:["Within 30 minutes of the crime","Within a reasonable amount of time following the commission of the crime (2 hours is referenced)","Within 6 hours","Within 24 hours"],
correct:1,
fb:"SOP 2.004: A show-up shall be done within a REASONABLE AMOUNT OF TIME following the commission of the crime. When 'reasonable' is in question, seek guidance from the Harris County DA's Office Intake Division."},

// ── CANINE UNITS (SOPs 4.001–4.008) ───────────
{src:"SOP",cat:"SOP 4.001 — Canine Use",
q:"SOP 4.001: Which type of canine unit would be used for 'Crowd control at discretion of on-scene supervisor'?",
opts:["Drug Canine Unit","Explosive Detection Unit","Police Service Canine Unit","Any available canine unit"],
correct:2,
fb:"SOP 4.001: Police Service Canine units may be used for crowd control at the DISCRETION of the on-scene supervisor or on-call supervisor."},

{src:"SOP",cat:"SOP 4.001 — Canine Use",
q:"SOP 4.001: Explosive Detection canine units should NOT be used for which purpose?",
opts:["Searching buildings for explosive devices","Searching vehicles for explosive components","Searching for narcotics OR subduing criminal suspects","Searching containers for explosive materials"],
correct:2,
fb:"SOP 4.001: Explosive Detection canines should NOT be used for (A) searching for narcotics, or (B) searching for or subduing criminal suspects."},

{src:"SOP",cat:"SOP 4.001 — Canine Use",
q:"SOP 4.001: When is the correct time to call a canine unit to a scene?",
opts:["After patrol deputies have searched the area and found nothing","Before patrol units search and contaminate the scene","Only when a supervisor of Captain rank or above authorizes","As a last resort after all other methods have failed"],
correct:1,
fb:"SOP 4.001: Canine units should NOT be called as a last resort after the scene is contaminated. They should be called BEFORE patrol units search and contaminate the scene or area."},

{src:"SOP",cat:"SOP 4.002 — Canine Handler",
q:"SOP 4.002: Under what condition may a canine be released off-leash inside a building?",
opts:["Any time the handler judges appropriate","Only in buildings under 1000 square feet","To search an enclosed location considered UNOCCUPIED, or to aid the handler when there is an imminent threat of serious bodily injury to the handler","Only with supervisor approval in all cases"],
correct:2,
fb:"SOP 4.002: A canine may be released off-leash to search an enclosed location considered UNOCCUPIED. It may also be released off-leash to come to the aid of its handler when there is an IMMINENT THREAT of serious bodily injury to the handler."},

{src:"SOP",cat:"SOP 4.006 — Canine Compensation",
q:"SOP 4.006: The Department compensates canine handlers for at-home care at what rate?",
opts:["15 minutes per day, 5 days per week","30 minutes per day, 7 days per week","1 hour per day, 5 days per week","45 minutes per shift only"],
correct:1,
fb:"SOP 4.006: The Department compensates each canine handler for at-home care at 30 MINUTES PER DAY, SEVEN DAYS per week. Each handler adjusts their schedule for 45 minutes per SHIFT (taken at beginning or end of shift)."},

{src:"SOP",cat:"SOP 4.006 — Canine Compensation",
q:"SOP 4.006: Which canine care activity is listed as NON-Compensable?",
opts:["Bathing and grooming the dog","Feeding and exercising the dog","Transporting the dog to/from home to work (Travel Time)","Cleaning the dog's kennel"],
correct:2,
fb:"SOP 4.006: TRAVEL TIME — transporting the dog to and from home to work/work to home — is specifically NON-COMPENSABLE. At-home care activities (bathing, brushing, feeding, grooming, exercising, vet trips, home training) ARE compensable."},

{src:"SOP",cat:"SOP 4.008 — Canine Proficiency",
q:"SOP 4.008: How many false alerts during a narcotics canine proficiency evaluation will result in failure?",
opts:["1 false alert","2 false alerts","3 false alerts","Any false alert immediately fails the team"],
correct:1,
fb:"SOP 4.008: TWO false alerts during the evaluation results in failure. A team that fails must be suspended from the program until standards are met, not to exceed six weeks."},

{src:"SOP",cat:"SOP 4.008 — Canine Proficiency",
q:"SOP 4.008: How often must narcotics detection canine teams receive certification from a recognized training association?",
opts:["Every 6 months","Annually","Every 2 years","Every 3 years"],
correct:1,
fb:"SOP 4.008: All in-service narcotics detection teams shall receive an ANNUAL certification from a recognized training association."},

// ── RADIO / DISPATCH (SOP 5.001–5.004) ────────
{src:"SOP",cat:"SOP 5.001 — Radio Procedures",
q:"SOP 5.001: What radio code does a deputy use when signing ON at the start of their shift?",
opts:["O.D. — Off Duty","S.O. — Serviced and Operational","10-8 — In Service","C.O. — Checked Out"],
correct:1,
fb:"SOP 5.001: Personnel sign on using 'S.O.' meaning SERVICED AND OPERATIONAL, and sign off using 'O.D.' meaning OFF DUTY."},

{src:"SOP",cat:"SOP 5.001 — Radio Procedures",
q:"SOP 5.001: How must all patrol personnel identify themselves on the police radio?",
opts:["Just their last name","Their badge number only","Their complete individual unit number preceded by the word 'Unit' (e.g., Unit 4C20)","Their first initial and last name"],
correct:2,
fb:"SOP 5.001: All patrol personnel must use their COMPLETE INDIVIDUAL UNIT NUMBER preceded by the word 'Unit' when utilizing the police radio (e.g., Unit 4C20)."},

{src:"SOP",cat:"SOP 5.003 — Dispatch Priority",
q:"SOP 5.003: Which of the following correctly describes a Priority 2 call?",
opts:["Life-threatening — permits emergency equipment (lights and siren)","Requires the deputy to be out of service temporarily; not immediately life-threatening; no emergency equipment permitted; examples: MVAs, suspicious person, report calls","Uses Priority 3 classification for non-urgent matters","Only used for calls expected to take longer than 2 hours"],
correct:1,
fb:"SOP 5.003: Priority 2 calls generally require the deputy to be out of service temporarily, must not have immediate potential to deteriorate into life-threatening situations, and do NOT allow use of emergency equipment. Examples: motor vehicle accidents, suspicious persons/vehicles, report calls."},

{src:"SOP",cat:"SOP 5.003 — Dispatch Priority",
q:"SOP 5.003: Constantinople 4 does NOT use which priority level?",
opts:["Priority 1","Priority 2","Priority 3","They use all three priority levels"],
correct:2,
fb:"SOP 5.003: While some Harris County departments use Priority 3, Constantinople 4 does NOT. All calls for service will be at least Priority 2."},

{src:"SOP",cat:"SOP 5.004 — Computer Returns",
q:"SOP 5.004: Under what circumstances should a criminal history return NEVER be transmitted?",
opts:["When the subject has a prior arrest","Over the radio under any circumstances","When the deputy is on a traffic stop","When the subject has warrants"],
correct:1,
fb:"SOP 5.004: Under NO circumstances shall a criminal history return be given OVER THE RADIO. Information affecting officer safety may be transmitted in a limited, specific manner."},

{src:"SOP",cat:"SOP 5.002 — Major Incident Notifications",
q:"SOP 5.002: Which of the following is NOT listed as an incident requiring major incident notification?",
opts:["Sexual assault / aggravated sexual assault","Pursuit","Traffic accident involving death or serious bodily injury","Minor traffic accident with no injuries"],
correct:3,
fb:"SOP 5.002: Incidents requiring notification include: sexual assault, assault with serious bodily injury (including shootings/stabbings), death by any means (other than natural), assist-the-officer calls, traffic/industrial accidents with death or serious bodily injury, pursuits, and custodial injury/illness requiring medical attention."},

{src:"SOP",cat:"SOP 5.002 — Major Incident Notifications",
q:"SOP 5.002: When media arrives on scene requesting information, who is authorized to give a statement?",
opts:["The on-duty supervisor can give basic facts","Any deputy assigned to the scene","Only the Chief Deputy or his/her designee may authorize an interview","The shift lieutenant"],
correct:2,
fb:"SOP 5.002: The on-duty supervisor will inform the media that ONLY THE CHIEF DEPUTY OR HIS/HER DESIGNEE may authorize an interview. The supervisor will notify communications."},

// ── DOMESTIC VIOLENCE (SOP 7.001) ─────────────
{src:"SOP",cat:"SOP 7.001 — Domestic Violence",
q:"SOP 7.001: Per the SOP definition, which group is included in 'Household'?",
opts:["Only legal spouses and blood relatives","Any unit of persons living together in the same dwelling, whether related or not, including boyfriend/girlfriend relationships and roommates","Only persons on the same lease agreement","Only persons related by blood, marriage, or adoption"],
correct:1,
fb:"SOP 7.001: 'Household' is a unit comprised of persons living together in the same dwelling, whether or not related, INCLUDING boyfriend/girlfriend relationships and/or roommates."},

{src:"SOP",cat:"SOP 7.001 — Domestic Violence",
q:"SOP 7.001: When investigating a family violence incident, which two items must be given to the victim?",
opts:["A copy of the offense report and a shelter brochure","Victim Referral/Victim Rights Pamphlet AND an Application for Magistrate's Order for Emergency Protection","Only a victim rights pamphlet","A case number and a business card"],
correct:1,
fb:"SOP 7.001: The deputy shall provide the victim with: (1) Victim Referral / Victim Rights Pamphlet, and (2) Application for Magistrate's Order for Emergency Protection."},

{src:"SOP",cat:"SOP 7.001 — Domestic Violence",
q:"SOP 7.001: A Precinct 4 EMPLOYEE is involved as a suspect in domestic violence, and this agency is conducting the investigation. The DA's Office should be contacted:",
opts:["Immediately by the patrol supervisor","Only when requested to do so by a Pct. 4 Domestic Violence Unit investigator","Within 24 hours by the on-duty supervisor","By the responding deputy before taking any other action"],
correct:1,
fb:"SOP 7.001: When a Pct. 4 employee is involved and this agency is investigating, the DA's Office should NOT be contacted UNLESS requested to do so by a Pct. 4 Domestic Violence Unit investigator."},

{src:"SOP",cat:"SOP 7.001 — Domestic Violence",
q:"SOP 7.001: Can a deputy attempt to divide property between parties at a family violence scene?",
opts:["Yes — if both parties agree","Yes — if the deputy believes it will prevent further violence","No — under no circumstance will the deputy adjudicate property division or offer legal advice","Yes — as a temporary measure only"],
correct:2,
fb:"SOP 7.001: Under NO CIRCUMSTANCE will the investigating deputy attempt to adjudicate a division of property or offer information that could be construed as legal advice."},

// ── SOCIAL MEDIA (SOP 50.001) ──────────────────
{src:"SOP",cat:"SOP 50.001 — Social Media",
q:"SOP 50.001: A deputy wants to post information from a case to their personal social media account. This is:",
opts:["Allowed if the information is already public","Prohibited — personnel shall NOT post/transmit/disseminate any information accessed through employment without written permission from the Constable","Allowed during off-duty hours only","Allowed if the deputy uses an anonymous account"],
correct:1,
fb:"SOP 50.001: Department personnel SHALL NOT post, transmit, or disseminate ANY information to which they have access as a result of their employment without WRITTEN PERMISSION from the Constable and/or his designee."},

{src:"SOP",cat:"SOP 50.001 — Social Media",
q:"SOP 50.001: Using department computers to access social media is:",
opts:["Allowed during meal breaks","Prohibited without authorization","Allowed for department-related pages only","Allowed if the supervisor approves"],
correct:1,
fb:"SOP 50.001: The USE of department computers by department personnel to access social media is PROHIBITED without authorization."},

{src:"SOP",cat:"SOP 50.001 — Social Media",
q:"SOP 50.001: Social media can be used as an investigative tool for which purpose?",
opts:["Monitoring employees' personal accounts","Finding evidence related to missing persons, wanted persons, gang participation, online crimes, or crimes posted online by participants","Posting case information to solicit tips without authorization","Accessing suspect records from personal devices"],
correct:1,
fb:"SOP 50.001: Valid investigative uses include: missing persons, wanted persons, gang participation, crimes perpetrated online (cyber-bullying, stalking, fraud, child exploitation), and photos/videos of crimes posted by participants."},

// ── COMPLAINTS (SOP 50.003) ────────────────────
{src:"SOP",cat:"SOP 50.003 — Complaints",
q:"SOP 50.003: Complaints against department personnel must be received by a supervisor of what minimum rank?",
opts:["Corporal","Sergeant or above","Lieutenant or above","Captain or above"],
correct:1,
fb:"SOP 50.003: All complaints against Department Personnel shall be received by a supervisor of the rank of SERGEANT OR ABOVE."},

{src:"SOP",cat:"SOP 50.003 — Complaints",
q:"SOP 50.003: If a complainant refuses to reduce their complaint to writing, the complaint is:",
opts:["Dismissed entirely","Entered into the Complaint System, noted as such, and closed 'NF' (Never Formalized)","Written up by the supervisor on the complainant's behalf","Forwarded to Internal Affairs automatically"],
correct:1,
fb:"SOP 50.003: If the complainant refuses to reduce to writing, the complaint is entered into the CS, a notation is made, and it is closed 'NF' (NEVER FORMALIZED)."},

{src:"SOP",cat:"SOP 50.003 — Complaints",
q:"SOP 50.003: Which complaint clearance code means 'Evidence is sufficient to prove the allegation'?",
opts:["U — Unfounded","J — Justified","NS — Not Substantiated","S — Substantiated"],
correct:3,
fb:"SOP 50.003: S = SUBSTANTIATED (evidence is sufficient to prove the allegation). U = Unfounded, J = Justified (lawful and proper), NS = Not Substantiated (insufficient evidence either way), NF = Never Formalized."},

{src:"SOP",cat:"SOP 50.003 — Complaints",
q:"SOP 50.003: All complaints, regardless of how received, must be entered into the department's complaint tracking system by when?",
opts:["Within 24 hours of receipt","By the end of the receiving supervisor's shift on the day received","Within 48 hours of receipt","By the next business day"],
correct:1,
fb:"SOP 50.003: All complaints, regardless of how received, will be entered into the department's complaint tracking system by the END OF THE RECEIVING SUPERVISOR'S SHIFT on the day the complaint is received."},

// ─────────────────────────────────────────────────────────
// SOURCE LABELS
// ─────────────────────────────────────────────────────────
const SRC_LABELS={SOP:"Standard Operating Procedure",ORB:"Oral Review Board",LAW:"Texas Law",STUDY:"Study Guide"};
const SRC_COLORS={SOP:"src-sop",ORB:"src-orb",LAW:"src-law",STUDY:"src-study"};

// ─────────────────────────────────────────────────────────
// APP STATE
// ─────────────────────────────────────────────────────────
let quizQ=[],current=0,score=0,answered=false,results=[],retryQ=[];
let selectedCats=new Set();

// ─────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────
function getCatMap(){
  const m={};
  Q.forEach(q=>{
    if(!m[q.cat]) m[q.cat]={count:0,src:q.src};
    m[q.cat].count++;
  });
  return m;
}

function buildGrid(){
  document.getElementById('total-count').textContent=Q.length;
  document.getElementById('topic-count').textContent=Object.keys(getCatMap()).length;
  renderGrid('','');
}

function renderGrid(search,srcFilter){
  const grid=document.getElementById('cat-grid');
  const cats=getCatMap();
  grid.innerHTML='';
  let shown=0;
  Object.entries(cats).forEach(([cat,info])=>{
    const matchSearch=!search||cat.toLowerCase().includes(search.toLowerCase());
    const matchSrc=!srcFilter||info.src===srcFilter;
    if(!matchSearch||!matchSrc) return;
    shown++;
    const btn=document.createElement('button');
    btn.className='cat-btn'+(selectedCats.has(cat)?' selected':'');
    btn.innerHTML=`${cat}<div class="cat-info"><span class="count">${info.count} question${info.count>1?'s':''}</span><span class="src-tag ${SRC_COLORS[info.src]}">${info.src}</span></div>`;
    btn.onclick=()=>toggleCat(cat,btn);
    grid.appendChild(btn);
  });
}

function filterCats(){
  const search=document.getElementById('cat-search').value;
  const src=document.getElementById('src-filter').value;
  renderGrid(search,src);
}

function toggleCat(cat,btn){
  if(selectedCats.has(cat)){selectedCats.delete(cat);btn.classList.remove('selected');}
  else{selectedCats.add(cat);btn.classList.add('selected');}
  updateSelCount();
}

function updateSelCount(){
  const n=selectedCats.size;
  document.getElementById('sel-count').textContent=n;
  document.getElementById('start-selected-btn').style.display=n>0?'inline-block':'none';
}

function selectAll(){
  const cats=getCatMap();
  const search=document.getElementById('cat-search').value;
  const src=document.getElementById('src-filter').value;
  Object.entries(cats).forEach(([cat,info])=>{
    const matchSearch=!search||cat.toLowerCase().includes(search.toLowerCase());
    const matchSrc=!src||info.src===src;
    if(matchSearch&&matchSrc) selectedCats.add(cat);
  });
  renderGrid(search,src);
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.add('selected'));
  updateSelCount();
}

function clearAll(){
  selectedCats.clear();
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));
  updateSelCount();
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startQuiz(mode){
  let pool=mode==='selected'?Q.filter(q=>selectedCats.has(q.cat)):[...Q];
  if(pool.length===0){alert('No questions match your selection.');return;}
  quizQ=shuffle(pool);retryQ=quizQ;
  current=0;score=0;answered=false;results=[];
  show('quiz-screen');renderQ();
}

function renderQ(){
  const q=quizQ[current];const total=quizQ.length;
  document.getElementById('prog-fill').style.width=`${(current/total)*100}%`;
  document.getElementById('q-num').textContent=`Question ${current+1} of ${total}`;
  document.getElementById('q-src').textContent=SRC_LABELS[q.src]||q.src;
  document.getElementById('q-cat').textContent=q.cat;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('feedback-box').className='feedback-box';
  document.getElementById('feedback-box').innerHTML='';
  document.getElementById('action-row').innerHTML='';
  answered=false;
  const LETTERS=['A','B','C','D','E'];
  const body=document.getElementById('q-body');
  body.innerHTML=`<div class="options">${q.opts.map((o,i)=>`<button class="opt-btn" onclick="selectAns(${i})"><span class="opt-letter">${LETTERS[i]}.</span><span>${o}</span></button>`).join('')}</div>`;
}

function selectAns(idx){
  if(answered)return;answered=true;
  const q=quizQ[current];
  const btns=document.querySelectorAll('.opt-btn');
  const ok=idx===q.correct;
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('correct');else if(i===idx&&!ok)b.classList.add('wrong');});
  if(ok)score++;
  results.push({q:q.q,src:q.src,cat:q.cat,correct:ok,correctAns:q.opts[q.correct],yourAns:q.opts[idx]});
  const fb=document.getElementById('feedback-box');
  fb.innerHTML=`<strong>${ok?'✓ Correct':'✗ Incorrect'}</strong>${q.fb}<span class="fb-source">Source: ${SRC_LABELS[q.src]} — ${q.cat}</span>`;
  fb.className=`feedback-box show ${ok?'correct-fb':'wrong-fb'}`;
  document.getElementById('action-row').innerHTML=`<button class="btn btn-primary" onclick="nextQ()">${current<quizQ.length-1?'Next Question →':'See Results →'}</button>`;
}

function nextQ(){current++;if(current>=quizQ.length)showResults();else renderQ();}

function showResults(){
  show('results-screen');
  const total=quizQ.length;
  const pct=Math.round((score/total)*100);
  const circumference=2*Math.PI*52;
  document.getElementById('score-arc').style.strokeDashoffset=circumference-(pct/100)*circumference;
  document.getElementById('score-pct').textContent=`${pct}%`;
  document.getElementById('score-raw').textContent=`${score} of ${total} correct`;
  const msg=pct>=90?"Outstanding — you're ready for that board.":pct>=75?"Solid work. Review the misses and you'll be there.":pct>=60?"Good foundation. Focus on the topics you missed.":"Keep going — review each explanation carefully.";
  document.getElementById('result-msg').textContent=msg;

  // Breakdown by source
  const srcScores={};
  results.forEach(r=>{
    if(!srcScores[r.src]) srcScores[r.src]={c:0,t:0};
    srcScores[r.src].t++;
    if(r.correct) srcScores[r.src].c++;
  });
  document.getElementById('breakdown').innerHTML=Object.entries(srcScores).map(([src,s])=>`
    <div class="breakdown-card">
      <div class="bd-num">${Math.round((s.c/s.t)*100)}%</div>
      <div class="bd-label">${SRC_LABELS[src]||src}</div>
      <div class="bd-label" style="color:var(--gold-light)">${s.c}/${s.t}</div>
    </div>`).join('');

  document.getElementById('retry-btn').onclick=()=>{quizQ=shuffle(retryQ);current=0;score=0;answered=false;results=[];show('quiz-screen');renderQ();};
  document.getElementById('review-list').innerHTML=`<h3>Answer Review</h3>`+results.map(r=>`
    <div class="review-item ${r.correct?'r-correct':'r-wrong'}">
      <div class="ri-q">${r.q}</div>
      <div class="ri-a">Your answer: <span>${r.yourAns}</span>${!r.correct?` &nbsp;|&nbsp; Correct: <span>${r.correctAns}</span>`:''}</div>
      <div class="ri-src">${SRC_LABELS[r.src]} — ${r.cat}</div>
    </div>`).join('');
}

function resetToCategories(){
  selectedCats.clear();
  updateSelCount();
  show('category-screen');
  renderGrid('','');
}

function show(id){['category-screen','quiz-screen','results-screen'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));}

buildGrid();
</script>
