<title>Constantinople 4 — Master Board Prep</title>
<script>
(function(){
  const PASS='Password1',KEY='hcco_auth';
  if(sessionStorage.getItem(KEY)==='1')return;
  document.addEventListener('DOMContentLoaded',function(){
    document.body.style.display='none';showLogin();
  });
  function showLogin(){
    document.body.style.display='';
    document.body.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1b2a;"><div style="background:rgba(46,64,87,.6);border:1px solid rgba(201,168,76,.3);border-radius:8px;padding:40px 32px;max-width:360px;width:90%;text-align:center;"><div style="font-size:2rem;color:#c9a84c;margin-bottom:6px;">★</div><div style="font-family:Georgia,serif;font-size:1.3rem;color:#c9a84c;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;">Constantinople 4</div><div style="font-size:.75rem;color:#8899aa;letter-spacing:.08em;text-transform:uppercase;margin-bottom:28px;">Board Prep · Private Access</div><input id="pw" type="password" placeholder="Enter password" style="width:100%;background:rgba(13,27,42,.8);border:1px solid rgba(201,168,76,.3);border-radius:4px;padding:13px 14px;color:#f0eff4;font-size:1rem;margin-bottom:12px;outline:none;" onkeydown="if(event.key==='Enter')chk()"/><div id="err" style="color:#ff9f9f;font-size:.82rem;margin-bottom:10px;min-height:18px;"></div><button onclick="chk()" style="width:100%;background:#c9a84c;color:#0d1b2a;border:none;border-radius:3px;padding:13px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-size:.9rem;">Enter</button></div></div>`;
    setTimeout(()=>document.getElementById('pw').focus(),100);
  }
  window.chk=function(){
    const v=document.getElementById('pw').value;
    if(v===PASS){sessionStorage.setItem(KEY,'1');location.reload();}
    else{document.getElementById('err').textContent='Incorrect password. Try again.';document.getElementById('pw').value='';document.getElementById('pw').focus();}
  };
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b2a;--gold:#c9a84c;--gold-light:#e8cc80;--steel:#2e4057;--fog:#f0eff4;--white:#fff;--red:#c0392b;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Source Serif 4',Georgia,serif;background:var(--navy);color:var(--fog);min-height:100vh;background-image:radial-gradient(ellipse at 20% 20%,rgba(201,168,76,.07) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(46,64,87,.5) 0%,transparent 60%);}
header{text-align:center;padding:28px 20px 12px;border-bottom:2px solid var(--gold);}
header::before{content:'★';display:block;font-size:1.6rem;color:var(--gold);margin-bottom:4px;}
h1{font-family:'Oswald',sans-serif;font-size:clamp(1.1rem,4vw,2rem);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);}
.subtitle{font-size:.72rem;color:#8899aa;letter-spacing:.08em;margin-top:4px;text-transform:uppercase;}
.stats-bar{display:flex;justify-content:center;gap:20px;padding:8px 0 0;font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:.08em;color:#8899aa;text-transform:uppercase;}
.stats-bar span{color:var(--gold-light);}
#app{max-width:800px;margin:0 auto;padding:20px 14px 60px;}
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.search-input{flex:1;min-width:160px;background:rgba(46,64,87,.6);border:1px solid rgba(201,168,76,.3);border-radius:4px;padding:9px 12px;color:var(--fog);font-family:'Source Serif 4',serif;font-size:.86rem;}
.search-input:focus{outline:none;border-color:var(--gold);}
.search-input::placeholder{color:#566a7f;}
.filter-select{background:rgba(46,64,87,.6);border:1px solid rgba(201,168,76,.3);border-radius:4px;padding:9px 10px;color:var(--fog);font-family:'Oswald',sans-serif;font-size:.76rem;letter-spacing:.04em;cursor:pointer;}
.filter-select:focus{outline:none;border-color:var(--gold);}
#category-screen h2{font-family:'Oswald',sans-serif;letter-spacing:.1em;color:var(--gold-light);margin-bottom:10px;font-size:.9rem;text-transform:uppercase;}
.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:7px;margin-bottom:16px;max-height:400px;overflow-y:auto;padding-right:3px;}
.category-grid::-webkit-scrollbar{width:4px;}
.category-grid::-webkit-scrollbar-thumb{background:rgba(201,168,76,.4);border-radius:2px;}
.cat-btn{background:var(--steel);border:1px solid rgba(201,168,76,.25);border-radius:4px;padding:10px 9px;color:var(--fog);font-family:'Oswald',sans-serif;font-size:.76rem;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .18s;text-align:left;width:100%;}
.cat-btn:hover,.cat-btn.selected{border-color:var(--gold);background:#3a5070;color:var(--gold-light);}
.cat-btn.selected{box-shadow:inset 3px 0 0 var(--gold);}
.cat-btn .cat-info{display:flex;justify-content:space-between;align-items:center;margin-top:2px;}
.cat-btn .count{font-family:'Source Serif 4',serif;font-size:.66rem;color:#8899aa;font-style:italic;text-transform:none;letter-spacing:0;}
.cat-btn .src-tag{font-size:.58rem;padding:1px 5px;border-radius:2px;text-transform:uppercase;letter-spacing:.04em;}
.src-sop{background:rgba(52,152,219,.25);color:#7ecfff;}
.src-orb{background:rgba(231,76,60,.2);color:#ff9f9f;}
.src-study{background:rgba(46,204,113,.2);color:#9affc0;}
.src-law{background:rgba(155,89,182,.25);color:#d7aaff;}
.src-pe{background:rgba(230,126,34,.25);color:#ffc17a;}
.progress-wrap{background:rgba(255,255,255,.1);border-radius:2px;height:4px;margin-bottom:18px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));transition:width .4s ease;}
.q-meta{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
.q-left{display:flex;flex-direction:column;gap:3px;}
.q-num{font-family:'Oswald',sans-serif;font-size:.74rem;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;}
.q-src{font-size:.65rem;color:#8899aa;font-style:italic;}
.q-cat{font-size:.66rem;color:#8899aa;font-style:italic;text-align:right;max-width:48%;}
.question-card{background:rgba(46,64,87,.5);border:1px solid rgba(201,168,76,.22);border-radius:6px;padding:18px 16px;margin-bottom:12px;}
.question-text{font-size:.96rem;line-height:1.7;color:var(--white);font-weight:300;}
.options{display:flex;flex-direction:column;gap:7px;}
.opt-btn{background:rgba(13,27,42,.8);border:1px solid rgba(255,255,255,.13);border-radius:4px;padding:11px 13px;color:var(--fog);font-family:'Source Serif 4',serif;font-size:.86rem;cursor:pointer;text-align:left;transition:all .18s;line-height:1.45;display:flex;align-items:flex-start;gap:8px;}
.opt-btn .ltr{font-family:'Oswald',sans-serif;font-size:.72rem;color:var(--gold);min-width:14px;margin-top:1px;}
.opt-btn:hover:not(:disabled){border-color:var(--gold);background:rgba(46,64,87,.8);}
.opt-btn.correct{border-color:#2ecc71;background:rgba(26,107,58,.4);color:#aaffcc;}
.opt-btn.correct .ltr{color:#2ecc71;}
.opt-btn.wrong{border-color:var(--red);background:rgba(192,57,43,.3);color:#ffaaaa;}
.opt-btn.wrong .ltr{color:var(--red);}
.opt-btn:disabled{cursor:default;}
.feedback-box{margin-top:10px;padding:12px 14px;border-radius:4px;font-size:.83rem;line-height:1.7;display:none;}
.feedback-box.show{display:block;}
.feedback-box.correct-fb{background:rgba(26,107,58,.3);border-left:4px solid #2ecc71;color:#ccffdd;}
.feedback-box.wrong-fb{background:rgba(192,57,43,.2);border-left:4px solid var(--red);color:#ffdddd;}
.feedback-box strong{display:block;font-family:'Oswald',sans-serif;letter-spacing:.06em;margin-bottom:4px;font-size:.76rem;text-transform:uppercase;}
.feedback-box .fb-src{display:block;margin-top:5px;font-size:.72rem;color:#8899aa;font-style:italic;}
.btn{font-family:'Oswald',sans-serif;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;padding:10px 20px;border-radius:3px;border:none;cursor:pointer;transition:all .2s;}
.btn-primary{background:var(--gold);color:var(--navy);font-weight:600;}
.btn-primary:hover{background:var(--gold-light);}
.btn-secondary{background:transparent;border:1px solid var(--gold);color:var(--gold);}
.btn-secondary:hover{background:rgba(201,168,76,.1);}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:#8899aa;font-size:.74rem;padding:7px 13px;}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
#results-screen{text-align:center;padding-top:6px;}
.score-ring{position:relative;width:110px;height:110px;margin:12px auto 4px;}
.score-ring svg{transform:rotate(-90deg);}
.score-ring .score-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Oswald',sans-serif;font-size:1.8rem;color:var(--gold);line-height:1;}
.score-label{font-size:.78rem;color:#8899aa;letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;}
.result-msg{font-size:.94rem;font-weight:300;color:var(--fog);margin-bottom:14px;font-style:italic;}
.result-breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:7px;margin:0 auto 16px;max-width:520px;}
.breakdown-card{background:rgba(46,64,87,.4);border-radius:4px;padding:9px;text-align:center;}
.breakdown-card .bd-num{font-family:'Oswald',sans-serif;font-size:1.3rem;color:var(--gold-light);}
.breakdown-card .bd-label{font-size:.64rem;color:#8899aa;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.review-list{text-align:left;margin-top:18px;}
.review-list h3{font-family:'Oswald',sans-serif;color:var(--gold-light);letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;margin-bottom:8px;}
.review-item{background:rgba(46,64,87,.4);border-radius:4px;padding:9px 11px;margin-bottom:5px;border-left:4px solid transparent;}
.review-item.r-correct{border-color:#2ecc71;}
.review-item.r-wrong{border-color:var(--red);}
.review-item .ri-q{color:var(--white);margin-bottom:3px;line-height:1.4;font-size:.82rem;}
.review-item .ri-a{color:#8899aa;font-style:italic;font-size:.76rem;}
.review-item .ri-a span{color:var(--gold-light);font-style:normal;}
.review-item .ri-src{color:#566a7f;font-size:.68rem;margin-top:2px;}
.hidden{display:none!important;}
#start-sel{display:none;}
.sel-row{display:flex;gap:7px;margin-bottom:7px;flex-wrap:wrap;}
</style>
</head>
<body>
<header>
  <h1>Constantinople 4 — Master Board Prep</h1>
  <p class="subtitle">SOPs &bull; Policy &amp; Ethics &bull; Texas Law &bull; Oral Review Board</p>
  <div class="stats-bar">Questions: <span id="tc">—</span> &nbsp;|&nbsp; Topics: <span id="topc">—</span></div>
</header>
<div id="app">
  <div id="category-screen">
    <h2>Select topics to study</h2>
    <div class="filter-bar">
      <input class="search-input" id="cat-search" placeholder="Search topics…" oninput="filterCats()">
      <select class="filter-select" id="src-filter" onchange="filterCats()">
        <option value="">All sources</option>
        <option value="PE">Policy &amp; Ethics</option>
        <option value="SOP">SOPs</option>
        <option value="ORB">Oral Board</option>
        <option value="LAW">Texas Law</option>
        <option value="STUDY">Study Guide</option>
      </select>
    </div>
    <div class="sel-row">
      <button class="btn-ghost btn" onclick="selectAll()">Select All</button>
      <button class="btn-ghost btn" onclick="clearAll()">Clear All</button>
    </div>
    <div class="category-grid" id="cat-grid"></div>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="startQuiz('all')">Quiz All Topics</button>
      <button class="btn btn-secondary" id="start-sel" onclick="startQuiz('selected')">Quiz Selected (<span id="selc">0</span>)</button>
    </div>
  </div>
  <div id="quiz-screen" class="hidden">
    <div class="progress-wrap"><div class="progress-fill" id="prog-fill"></div></div>
    <div class="q-meta"><div class="q-left"><span class="q-num" id="q-num"></span><span class="q-src" id="q-src"></span></div><span class="q-cat" id="q-cat"></span></div>
    <div class="question-card"><p class="question-text" id="q-text"></p></div>
    <div id="q-body"></div>
    <div class="feedback-box" id="feedback-box"></div>
    <div class="btn-row" id="action-row"></div>
    <div class="btn-row" style="margin-top:7px;"><button class="btn btn-ghost" onclick="resetToCategories()">← Back to Topics</button></div>
  </div>
  <div id="results-screen" class="hidden">
    <div class="score-ring"><svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="47" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="9"/><circle cx="55" cy="55" r="47" fill="none" stroke="var(--gold)" stroke-width="9" stroke-linecap="round" id="score-arc" stroke-dasharray="295.3" stroke-dashoffset="295.3"/></svg><div class="score-text" id="score-pct"></div></div>
    <div class="score-label" id="score-raw"></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-breakdown" id="breakdown"></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn btn-primary" id="retry-btn">Retry This Quiz</button>
      <button class="btn btn-secondary" onclick="resetToCategories()">Back to Topics</button>
    </div>
    <div class="review-list" id="review-list"></div>
  </div>
</div>
<script>
const SRC_LABELS={SOP:"Standard Operating Procedure",ORB:"Oral Review Board",LAW:"Texas Law",STUDY:"Study Guide",PE:"Policy & Ethics"};
const SRC_CSS={SOP:"src-sop",ORB:"src-orb",LAW:"src-law",STUDY:"src-study",PE:"src-pe"};
const LETTERS=['A','B','C','D','E'];

const Q=[
// ═══════════════════════════════════════════════════
// POLICY & ETHICS — ORGANIZATION & CHAIN OF COMMAND
// ═══════════════════════════════════════════════════
{src:"PE",cat:"P&E: Chain of Command",q:"P&E Section 1: What is the correct order of commissioned positions by rank, from highest to lowest?",opts:["Constable, Chief Deputy, Assistant Chief Deputy, Captain, Lieutenant, Sergeant, Corporal, Deputy Constable","Constable, Captain, Chief Deputy, Lieutenant, Sergeant, Corporal, Deputy","Chief Deputy, Constable, Assistant Chief, Captain, Lieutenant, Sergeant, Deputy","Constable, Assistant Chief, Chief Deputy, Lieutenant, Captain, Sergeant, Deputy"],correct:0,fb:"P&E 1.03: Order is Constable → Chief Deputy → Assistant Chief Deputy → Captain → Lieutenant → Sergeant → Corporal → Deputy Constable/Detective/Investigator."},
{src:"PE",cat:"P&E: Chain of Command",q:"P&E Section 1: In the temporary absence of the Constable AND the Chief Deputy, who assumes command?",opts:["The senior Captain","The Assistant Chief Deputy","The senior Lieutenant","Whoever the Chief Deputy designates by phone"],correct:1,fb:"P&E 1.06: In the absence of the Constable, the Chief Deputy assumes all duties. In the absence of both the Constable and Chief Deputy, the ASSISTANT CHIEF DEPUTY assumes command responsibilities."},
{src:"PE",cat:"P&E: Chain of Command",q:"P&E Section 1: The Constable is absent along with both the Chief Deputy and the Assistant Chief Deputy. How is the acting commander designated?",opts:["The senior Captain automatically assumes command","The Constable will appoint an individual in writing, distributed to staff","The senior Lieutenant assumes command","The Chief Clerk assumes administrative control"],correct:1,fb:"P&E 1.06: When all three are absent, the Constable will appoint an individual to act in his behalf — IN WRITING — for distribution to the staff."},
{src:"PE",cat:"P&E: Chain of Command",q:"P&E Section 1: Who is the Chief Executive Officer of the Constable's Department?",opts:["The Chief Deputy","The Assistant Chief Deputy","The Constable","The senior Captain"],correct:2,fb:"P&E 1.04: The Constable is the Chief Executive Officer of the Department. Upon him rests the final authority for determining office policies and full responsibility for all duties imposed by law."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — GENERAL RULES OF CONDUCT
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: General Rules of Conduct",q:"P&E 2.02: A supervisor gives a member an order the member believes may be unlawful. What should the member do?",opts:["Refuse the order immediately and file a complaint","Obey all lawful orders; if an order appears unlawful, the member should respectfully state their concerns to the superior before complying or seek clarification","Comply with all orders regardless of legality","Ignore the order and notify Internal Affairs first"],correct:1,fb:"P&E 2.02: Members shall obey all LAWFUL orders. The policy requires members to obey instructions from superior officers. If uncertain, express concerns respectfully — but failure to comply with a lawful order may result in disciplinary action."},
{src:"PE",cat:"P&E: General Rules of Conduct",q:"P&E 2.18: A member is asked a question related to their official duties while not under oath. Are they required to be truthful?",opts:["Only if under oath","Yes — members are required to be truthful at ALL times, whether under oath or not","Only in formal disciplinary hearings","Only when speaking to a superior officer"],correct:1,fb:"P&E 2.18: Members are required to be TRUTHFUL AT ALL TIMES, whether under oath or not, in giving testimony or in connection with any legal official order or official duties."},
{src:"PE",cat:"P&E: General Rules of Conduct",q:"P&E 2.33: A member wants to record a conversation with another Department member. When is this permitted without direction from a command staff supervisor of Captain or higher?",opts:["Any time, as long as the member saves it as evidence","Never without command staff approval at Captain or higher, unless the recording supports illegal activities or gross violations of Department policy","Anytime if the other member consents","Only during internal affairs investigations"],correct:1,fb:"P&E 2.33: No employee shall record another Department member without direction from a command staff supervisor of Captain or higher, UNLESS the recording supports illegal activities or gross violation of Department Policy, Procedure or Administrative Actions."},
{src:"PE",cat:"P&E: General Rules of Conduct",q:"P&E 2.34: How long must personnel maintain audio recordings of sensitive situations such as traffic stops, hostile citizens, domestic violence, or arrest situations?",opts:["30 days","60 days","90 days minimum","1 year"],correct:2,fb:"P&E 2.34: Personnel are to maintain these recordings for a MINIMUM period of 90 days, after which recordings may be erased. Personnel are encouraged to maintain recordings longer if the situation may result in a complaint."},
{src:"PE",cat:"P&E: General Rules of Conduct",q:"P&E 2.35: What is the definition of 'Bias-Based Profiling' per Department policy?",opts:["Stopping someone only based on criminal history","The selection of individuals based SOLELY on a trait common to a group for enforcement action, including race, ethnic background, gender, sexual orientation, religion, economic status, age, or cultural group","Any enforcement action based on race","The use of criminal profiles to identify suspects"],correct:1,fb:"P&E 2.35.02: Bias-Based Profiling is the selection of individuals based solely on a trait common to a group for enforcement action. This includes race, ethnic background, gender, sexual orientation, religion, economic status, age, cultural group, or any other identifiable group."},
{src:"PE",cat:"P&E: General Rules of Conduct",q:"P&E 2.35: Deliberate recording of misleading information related to the race or ethnicity of a person stopped for enforcement purposes is:",opts:["Acceptable if it helps close the case","Prohibited and is cause for disciplinary action up to and including termination","Allowed only with supervisor approval","Only prohibited in felony cases"],correct:1,fb:"P&E 2.35.03: Deliberate recording of any misleading information related to the actual or perceived race, ethnicity, gender, or sexual orientation of a person stopped for investigative or enforcement purposes is PROHIBITED and is a cause for disciplinary action up to and including TERMINATION."},
{src:"PE",cat:"P&E: General Rules of Conduct",q:"P&E 2.27: Who is authorized to issue Departmental Memorandums directed to all Divisions and/or personnel?",opts:["Any Lieutenant or above","Only the Constable or his appointee","Any Captain","Any supervisor with 5+ years of service"],correct:1,fb:"P&E 2.27: All Departmental Memorandums directed to or affecting all Divisions and/or personnel will be issued ONLY by the Constable or his appointee."},
{src:"PE",cat:"P&E: General Rules of Conduct",q:"P&E 2.17: A citizen asks for your name and department affiliation. What must you do?",opts:["Provide it only if they file a formal request","Politely give your name, Department, and other pertinent information when requested, unless it would jeopardize a police assignment","Decline — officer safety takes priority","Give only your badge number"],correct:1,fb:"P&E 2.17: Members shall POLITELY give their name, Department, and other pertinent information to any violators or other persons when requested, unless such action is likely to jeopardize the successful completion of a police assignment."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — ATTENTION TO DUTY
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Attention to Duty",q:"P&E 4.14: A member receives a bribe offer while on duty. What must they do?",opts:["Decline and document the incident in their personal notes","Make an immediate written report to their direct supervisor","Report it to Internal Affairs only, bypassing the direct supervisor","Document it in the offense report within 48 hours"],correct:1,fb:"P&E 4.14: Members shall make an IMMEDIATE WRITTEN REPORT to their DIRECT SUPERVISOR of any bribe offer."},
{src:"PE",cat:"P&E: Attention to Duty",q:"P&E 4.18: A member becomes injured while off duty in a manner that will interfere with performance of duty. When must they report this?",opts:["Within 48 hours","Within 24 hours","At the start of their next shift","Before the end of the next business day"],correct:1,fb:"P&E 4.18: Any illness or injury that occurs OFF DUTY that will interfere with performance of duty shall be reported WITHIN 24 HOURS. On-duty injuries shall be reported IMMEDIATELY."},
{src:"PE",cat:"P&E: Attention to Duty",q:"P&E 4.15: When must members complete official reports?",opts:["Within 48 hours of the incident","Before going off duty, unless otherwise directed/authorized by a supervisor","Within 24 hours","At any time before the next court date"],correct:1,fb:"P&E 4.15: Members shall complete necessary reports BEFORE GOING OFF DUTY, unless otherwise directed and/or authorized by a supervisor."},
{src:"PE",cat:"P&E: Attention to Duty",q:"P&E 4.30: What is the Department's policy on seat belt use in county or privately owned vehicles?",opts:["Required only in county vehicles while on duty","All personnel shall wear an approved safety belt restraint system while operating a county-owned OR privately owned motor vehicle at all times, on or off duty","Required only while on duty","Required in county vehicles only"],correct:1,fb:"P&E 4.30: ALL Department personnel shall wear an approved safety belt restraint system while operating a county-owned or privately owned motor vehicle AT ALL TIMES (on or off duty). Also required as passengers in personal vehicles while on duty."},
{src:"PE",cat:"P&E: Attention to Duty",q:"P&E 4.31: Can on-duty personnel leave the County while conducting official business?",opts:["Yes, anytime without restriction","Yes, but only with approval from an on-duty supervisor first, then notify dispatch of time, mileage, and destination when leaving and returning","No — personnel may never leave the County on duty","Yes, but only if directed by a Lieutenant or above"],correct:1,fb:"P&E 4.31: No on-duty personnel may leave the County without first obtaining APPROVAL FROM AN ON-DUTY SUPERVISOR, then notifying the dispatcher by radio of time, mileage, and destination when leaving and upon returning."},
{src:"PE",cat:"P&E: Attention to Duty",q:"P&E 4.23: A member wants to carry their weapon while off duty. What is also required?",opts:["Supervisor approval for off-duty carry","Their official identification card must accompany the weapon at all times — a weapon may not be carried without an official ID card","A concealed carry license only","Written authorization from the Constable"],correct:1,fb:"P&E 4.23: When practical, members will carry their official identification card and weapon at all times. A WEAPON MAY NOT BE CARRIED WITHOUT AN OFFICIAL IDENTIFICATION CARD."},
{src:"PE",cat:"P&E: Attention to Duty",q:"P&E 4.12: A member becomes aware of a crime that did not occur in their patrol area. What are their duties?",opts:["Report it only to the agency with jurisdiction","Members shall report ALL crimes, violations, emergencies, and incidents that come to their attention — they shall not conceal, ignore, or distort facts","Only report it if it involves a felony","Handle it only if no other agency is aware"],correct:1,fb:"P&E 4.12: Members shall report ALL crimes, violations, emergencies, incidents, and other information of concern that comes to their attention. Members shall NOT conceal, ignore, or distort the facts of any incident."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — RESTRICTIONS ON ACTIVITIES
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Restrictions on Activities",q:"P&E 5.01: When may an employee engage in political activity relating to a campaign for elective office?",opts:["Any time, including while on duty in uniform","While out of uniform and NOT on active duty, on a strictly volunteer basis — never on county time or using county property","Only with written Constable approval","Never — employees are prohibited from all political activity"],correct:1,fb:"P&E 5.01: While out of uniform and not on active duty, an employee may engage in political activity on a strictly VOLUNTEER basis. You may NOT do campaign or fundraising on COUNTY TIME. County property will not be used for political activities."},
{src:"PE",cat:"P&E: Restrictions on Activities",q:"P&E 5.04: An officer performs an extra service during their off-duty job and the employer offers them a bonus. May they accept it?",opts:["Yes — off-duty services are not covered by this policy","No — no officer or employee may accept any reward, gratuity, or gift for any service performed as a result of or in conjunction with their duties as an employee of Constantinople 4","Yes — off-duty tips are acceptable","Yes — gifts under $50 are permitted"],correct:1,fb:"P&E 5.04: No officer or employee will be allowed to accept any reward, gratuity, gift, or like consideration for any service performed as a result of or in conjunction with their duties as a Constantinople 4 employee, whether on-duty or off-duty."},
{src:"PE",cat:"P&E: Restrictions on Activities",q:"P&E 5.05: A suspect offers a deputy a gift while in custody. The deputy may:",opts:["Accept it if it is under $25 in value","Never accept any gift, gratuity, loan, fee, or thing of value from a suspect, prisoner, defendant, or person of ill repute","Accept it only with supervisor approval","Accept it and log it as evidence"],correct:1,fb:"P&E 5.05: Members are STRICTLY PROHIBITED from soliciting or accepting any gift, gratuity, loan, fee, or any other thing of value from any suspect, prisoner, defendant or other person involved in any case, or from persons of ill repute, professional bondsmen, or others whose violations may profit from police information."},
{src:"PE",cat:"P&E: Restrictions on Activities",q:"P&E 5.10: A person stopped for a traffic violation asks a deputy to recommend a good attorney. The deputy should:",opts:["Provide a list of local attorneys as a public service","Not suggest, recommend, advise, or counsel the retention of any attorney or bondsman to any person coming to their attention as a result of police business (except for relatives)","Recommend the public defender's office only","Provide the local bar association phone number"],correct:1,fb:"P&E 5.10: Members shall NOT suggest, recommend, advise, or counsel the retention of any attorney or bondsman to any person coming to their attention as a result of police business, EXCEPT in the case where a relative is seeking such services."},
{src:"PE",cat:"P&E: Restrictions on Activities",q:"P&E 5.45: Can a member use another member's badge or official credentials?",opts:["Yes, in an emergency situation","No — the badge shall not be altered, exchanged, or transferred except by order of the Constable; no member may use another member's badge without the Constable's permission","Yes, with supervisor approval","Yes, temporarily while their own badge is being replaced"],correct:1,fb:"P&E 5.45: The badge shall not be altered, exchanged, or transferred EXCEPT by order of the Constable. Members shall NOT use another member's badge or official credentials without permission of the Constable, nor shall they permit any non-member to use the official badge at any time."},
{src:"PE",cat:"P&E: Restrictions on Activities",q:"P&E 5.46: A member's badge is lost or damaged. What must they do?",opts:["Report it verbally to their sergeant within 24 hours","Immediately report the fact in an offense report and forward it through the chain of command to the Chief Deputy","Replace it at their own cost within 48 hours","File a report with HR within 72 hours"],correct:1,fb:"P&E 5.46: When a member's badge or ID is lost or damaged, he/she shall IMMEDIATELY report the fact in an OFFENSE REPORT and forward it through the chain of command to the CHIEF DEPUTY."},
{src:"PE",cat:"P&E: Restrictions on Activities",q:"P&E 5.07: A member frequents a business that offers free meals to police while on duty. This is:",opts:["Acceptable — it is a courtesy from the business","Not permitted — members shall not use their official position to solicit special privileges, nor continually patronize businesses that give free or discounted meals while on duty","Acceptable with supervisor approval","Acceptable as long as it doesn't exceed $20 per visit"],correct:1,fb:"P&E 5.07: Members shall NOT use their official position to solicit special privileges for themselves or others, such as free admission, discounts, or other favors, nor CONTINUALLY PATRONIZE while on duty those businesses which give free or discounted meals and/or refreshments to police employees."},
{src:"PE",cat:"P&E: Restrictions on Activities",q:"P&E 5.51: A member completes a report and realizes later that some of the information was inaccurate. The original entry could constitute a violation of what policy?",opts:["P&E 4.15 Completing Official Reports","P&E 5.51 False Report — members shall not knowingly make a false report, either oral or written","P&E 2.18 Truthfulness only","P&E 4.17 Testifying in Departmental Investigations"],correct:1,fb:"P&E 5.51: Members shall NOT knowingly make a false report, either oral or written. This is a separate and distinct prohibition from the general truthfulness requirement."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — EMPLOYEE DRESS & APPEARANCE
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Employee Dress & Appearance",q:"P&E 6.02: What color metal accessories do SUPERVISORS wear on their uniform, and what do deputies/detectives wear?",opts:["Supervisors wear silver; deputies wear gold","Supervisors wear gold; deputies/detectives wear silver","Both ranks wear gold","The Constable determines this case by case"],correct:1,fb:"P&E 6.02: GOLD metal accessories are worn by supervisors. SILVER metal accessories are worn by deputy/detectives."},
{src:"PE",cat:"P&E: Employee Dress & Appearance",q:"P&E 6.02: The Class A Uniform is required at which events?",opts:["All patrol shifts","Official functions, special events involving dignitaries, and/or funerals — unless otherwise specified by the Constable or his designee","Only at funerals of law enforcement officers","Any event where the public will be present"],correct:1,fb:"P&E 6.02: Only Class A Uniforms shall be worn at OFFICIAL FUNCTIONS, SPECIAL EVENTS INVOLVING DIGNITARIES, and/or FUNERALS unless otherwise specified by the Constable or his designee."},
{src:"PE",cat:"P&E: Employee Dress & Appearance",q:"P&E 6.13: What are the facial hair rules for uniformed male personnel?",opts:["Clean shaven at all times; no facial hair permitted","Sideburns no lower than the lowest tip of the earlobe; mustaches neatly trimmed no more than ½\" beyond the outer corners of the mouth; beards and goatees are expressly prohibited while in uniform","Beards allowed if neatly trimmed; mustaches unrestricted","Facial hair is entirely at the officer's discretion"],correct:1,fb:"P&E 6.13: Sideburns may extend no lower than the lowest tip of the earlobe. Mustaches will be neatly trimmed, not more than ½\" beyond the outer corners of the mouth. BEARDS AND GOATEES ARE EXPRESSLY PROHIBITED while in uniform."},
{src:"PE",cat:"P&E: Employee Dress & Appearance",q:"P&E 6.22: A deputy has a visible tattoo on their forearm. What must they do while on duty?",opts:["Tattoos are not regulated off-duty only","No personnel shall have a tattoo exposed while on duty or in their official capacity — all tattoos must be concealed by a bandage, cloth, or similar device (flesh tone or navy blue, snug fitting); or wear a long sleeve uniform shirt","Tattoos are permitted unless they contain offensive imagery","Only neck and face tattoos must be covered"],correct:1,fb:"P&E 6.22: No personnel shall have a tattoo (or combination of tattoos) exposed while on duty or in their official capacity. All such tattoos must be covered by a bandage (not ace type), cloth, or similar device — either flesh tone or navy blue in color and snuggly fitting. OR wear a long sleeve uniform shirt."},
{src:"PE",cat:"P&E: Employee Dress & Appearance",q:"P&E 6.21: When may an off-duty officer open carry their weapon?",opts:["Never while off duty","A commissioned officer who holds a handgun license may open carry, but the badge must remain concealed unless official police action is being taken","Any time they choose while off duty","Only while traveling to or from work"],correct:1,fb:"P&E 6.21: A commissioned officer with this department who also holds a handgun license MAY OPEN CARRY. The badge must remain CONCEALED while off-duty unless official police action is being taken. Officers shall NOT be armed while drinking alcohol."},
{src:"PE",cat:"P&E: Employee Dress & Appearance",q:"P&E 6.12: When is a high visibility reflective traffic safety vest required?",opts:["Only during night operations","All personnel are required to wear it while directing traffic, investigating crashes/accidents, handling lane closures, obstructed roadways, and disasters within the right-of-way of any roadway","Only when directed by a supervisor","Only for crash investigations, not traffic direction"],correct:1,fb:"P&E 6.12: ALL PERSONNEL are required to wear their high visibility reflective traffic safety vest while directing traffic, investigating crashes and accidents, handling lane closures, obstructed roadways and disasters within the right-of-way of any roadway."},
{src:"PE",cat:"P&E: Employee Dress & Appearance",q:"P&E 6.09: When may a baseball-type cap be worn with the uniform?",opts:["Any time while on duty","Only during approved outdoor extra assignments; NOT during regular department assignments unless specifically permitted by specialty division uniform code (and never with express prohibition from the Constable)","Anytime with supervisor approval","Only during bike patrol"],correct:1,fb:"P&E 6.09: Baseball caps may be worn during the performance of extra assignments ONLY when the job function consists of an approved outdoor type activity. Under no circumstances, unless approved by the Constable, may the cap be worn with the uniform while the deputy is on regular assignment."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — FIREARMS
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Firearms",q:"P&E 15.07: When may a firearm be discharged as a warning shot?",opts:["When attempting to stop a fleeing felon","When the suspect is armed and fleeing","Never — a firearm may not be discharged as a warning at any time","Only with supervisor approval in the field"],correct:2,fb:"P&E 15.07 & 19.01: A firearm may NEVER be discharged as a warning at any time. This is an absolute prohibition."},
{src:"PE",cat:"P&E: Firearms",q:"P&E 15.08: What is the minimum caliber for an approved on-duty handgun for uniformed personnel?",opts:[".22 caliber or larger",".380 ACP or larger","9MM caliber or larger",".40 caliber or larger"],correct:2,fb:"P&E 15.08: An approved handgun for on-duty use shall be of a caliber of .380 ACP or larger. UNIFORMED PERSONNEL shall carry a 9MM caliber or larger. An approved off-duty handgun shall be of .32 ACP or larger."},
{src:"PE",cat:"P&E: Firearms",q:"P&E 15.08: When is an employee prohibited from carrying a weapon?",opts:["Only while off duty","While consuming alcohol OR while on light-duty if determined by the Constable that the physical/mental impairment interferes with normal use of the firearm","While attending training","Only in courthouses"],correct:1,fb:"P&E 15.08: At NO time shall an employee CONSUME ALCOHOL while carrying a weapon. Additionally, deputies on light-duty with a physical or mental impairment that interferes with normal use of a firearm shall NOT carry while the impairment exists."},
{src:"PE",cat:"P&E: Firearms",q:"P&E 15.01: Every time a deputy discharges a firearm in the course of official duties (except range practice), what must happen?",opts:["File a report within 48 hours","The on-duty or on-call patrol supervisor will be notified IMMEDIATELY and a complete discharge of firearms report submitted before ending duty","Notify the DA's office only","Notify the Chief Deputy by end of shift"],correct:1,fb:"P&E 15.01: On every occasion a deputy discharges a firearm in the course of official duties (except range practice), the ON-DUTY OR ON-CALL PATROL SUPERVISOR will be notified IMMEDIATELY. A complete discharge of firearms report shall be submitted before ending duty."},
{src:"PE",cat:"P&E: Firearms",q:"P&E 15.05: How many members compose the Discharge of Firearms Board, and what is one mandatory requirement?",opts:["5 members, including the Constable","3 members appointed by the Constable or his designee, with one being a firearms proficiency officer","4 members, with a majority being supervisors","2 members from Internal Affairs"],correct:1,fb:"P&E 15.05: The Discharge Board shall be comprised of THREE MEMBERS appointed by the Constable or his designee, with ONE being a firearms proficiency officer. The board reviews all evidence, witness interviews, and statements, then provides a written report to the Constable."},
{src:"PE",cat:"P&E: Firearms",q:"P&E 15.10: To carry a patrol rifle, a deputy must complete a certification program of how many hours?",opts:["8 hours","16 hours","24 hours","32 hours"],correct:3,fb:"P&E 15.10: Personnel may carry an approved rifle only after completing the 32-HOUR Constantinople 4 Patrol Rifle Certification Program. They must also have 2 years of law enforcement experience OR prior military experience with the AR-15/A-4 system."},
{src:"PE",cat:"P&E: Firearms",q:"P&E 15.10: What is the minimum passing qualification score for the patrol rifle?",opts:["70 percent","80 percent","90 percent","95 percent"],correct:2,fb:"P&E 15.10: Every commissioned personnel approved to carry a patrol rifle shall qualify by attaining a minimum passing score of 90 PERCENT as established by the department, annually."},
{src:"PE",cat:"P&E: Firearms",q:"P&E 15.03: When may a member display their firearm?",opts:["Any time they feel threatened","Only when the member reasonably believes they would be JUSTIFIED in using the weapon, or for official use, or for proper inspection","Whenever entering a high-crime area","With supervisor approval in any situation"],correct:1,fb:"P&E 15.03: Under no circumstance will a member display their firearm EXCEPT in those circumstances where he/she reasonably believes they would be JUSTIFIED in using said weapon, or for official use, or for proper inspection."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — USE OF FORCE
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Use of Force",q:"P&E 19.00: When is a Use of Force Form required?",opts:["Any time a deputy touches a suspect","Any action taken to gain compliance from a non-compliant subject resulting in injury, complaint of injury, complaint of pain persisting beyond a physical control hold, successful stop stick deployment, or death","Only when a firearm is deployed","Only when the suspect is injured visibly"],correct:1,fb:"P&E 19.00: A Use of Force Form MUST be completed on any action taken by a peace officer to gain compliance from a non-compliant subject resulting in INJURY, COMPLAINT OF INJURY in the officer's presence, COMPLAINT OF PAIN persisting beyond use of a physical control hold, SUCCESSFUL DEPLOYMENT of stop sticks, or DEATH."},
{src:"PE",cat:"P&E: Use of Force",q:"P&E 19.01: The Department's policy on deadly force is more restrictive than state law. When may deadly force be used per Department policy?",opts:["Any time state law permits","Only when: (1) the officer reasonably believes his/her life or another's is in jeopardy and deadly force is immediately necessary; OR (2) the arrest conduct included use/attempted use of deadly force and there is substantial risk of death/SBI if arrest is delayed","Any time a felony suspect flees","Whenever force is necessary to make an arrest"],correct:1,fb:"P&E 19.01: Deadly force is permitted ONLY when: (a) the officer reasonably believes the officer's life or another's is in jeopardy and deadly force is IMMEDIATELY necessary; OR (b) the arrest conduct included use/attempted use of deadly force AND the officer reasonably believes there is a substantial risk of death/SBI if the arrest is delayed."},
{src:"PE",cat:"P&E: Use of Force",q:"P&E 19.01: Under what circumstances may an officer discharge a weapon at a MOVING or FLEEING VEHICLE?",opts:["Any time the vehicle is used as a weapon","Never","Only when the officer reasonably believes the officer or some other person is in immediate danger of death or serious bodily injury","Only with supervisor authorization over the radio"],correct:2,fb:"P&E 19.01.2b: An officer may NOT discharge a weapon at a moving or fleeing vehicle UNLESS the officer reasonably believes that the officer or some other person is in IMMEDIATE DANGER OF DEATH OR SERIOUS BODILY INJURY."},
{src:"PE",cat:"P&E: Use of Force",q:"P&E 19.01.01: Following a use of deadly force resulting in injury or death, the involved deputy shall be placed on a minimum administrative assignment of how many days?",opts:["1 day","2 days","3 days","5 days"],correct:2,fb:"P&E 19.01.01: The involved deputy shall be placed on a minimum THREE-DAY administrative assignment as directed, receive a mandatory referral for a post-shooting/mental health evaluation (Cigna EAP), and a Compliance Letter must be received before the deputy is cleared."},
{src:"PE",cat:"P&E: Use of Force",q:"P&E 19.01.03: At a shooting scene, when should the involved weapon be holstered or secured?",opts:["Immediately upon arrival of the first supervisor","Once the incident is secure and the deputy has no additional safety concerns — it shall then NOT be opened, reloaded, shell casings removed, or tampered with","After the supervisor photographs it","Only after the DA shooting team arrives"],correct:1,fb:"P&E 19.01.03: Holster any involved weapons OR secure them as evidence once the incident is secure and the deputy has no additional safety concerns. Do NOT open, reload, remove shell casings, or in any other manner TAMPER with the involved firearms after the weapon has been secured."},
{src:"PE",cat:"P&E: Use of Force",q:"P&E 19.01: An officer encounters a misdemeanor offense only. May the officer use deadly force to apprehend the suspect?",opts:["Yes, if the suspect flees","Yes, with supervisor approval","No — an officer may not use deadly force on a misdemeanor when that is the only offense known, unless the officer or another is in immediate danger of death or SBI","Yes, for any offense if the suspect poses a threat"],correct:2,fb:"P&E 19.01.2d: An officer may NOT use deadly force on a MISDEMEANOR when that is the only offense known to the officer, unless the officer reasonably believes that the officer or another is in IMMEDIATE DANGER OF DEATH OR SERIOUS BODILY INJURY."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — CRASH REVIEW BOARD
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Crash Review Board",q:"P&E 18.01: How many members are on the Crash Review Board and what rank must they be?",opts:["5 members of any rank","4 persons: 3 members of SERGEANT OR BELOW, plus the head of the Accident Investigation Unit as moderator","3 members including a Lieutenant or above","2 members appointed by the Constable"],correct:1,fb:"P&E 18.01: The Crash Review Board shall be comprised of FOUR PERSONS: THREE MEMBERS of the rank of SERGEANT OR BELOW, and the HEAD OF THE ACCIDENT INVESTIGATION UNIT as the MODERATOR."},
{src:"PE",cat:"P&E: Crash Review Board",q:"P&E 18.01: Before the Crash Review Board reviews a fleet collision, may a supervisor issue punishment?",opts:["Yes, immediately after the accident","No — in no case shall a supervisor institute punishment or corrective actions for a fleet collision PRIOR to the Board's review, unless authorized by the Constable or his designee","Yes, if the violation is clear-cut","Only minor corrective action is permitted before the board"],correct:1,fb:"P&E 18.01: In NO CASE shall a supervisor institute punishment or corrective actions for a fleet collision PRIOR to the Board's review of the incident unless authorized by the Constable or his designee."},
{src:"PE",cat:"P&E: Crash Review Board",q:"P&E 18.01: Using the point system, a crash results in $3,000 property damage (substantial) and the driver committed a moving violation. The crash did not result in injury. How many total points?",opts:["2 points","4 points — 1 for moving violation + 3 for property damage $2,500-$4,999","5 points","3 points"],correct:1,fb:"P&E 18.01: Moving violation = 1 point. Property damage $2,500-$4,999 = 3 points. Total = 4 POINTS. (No injury points since no injury occurred.) Less than 5 points = corrective action with written counseling."},
{src:"PE",cat:"P&E: Crash Review Board",q:"P&E 18.01: What disciplinary action is recommended for an employee with 6 crash review board points?",opts:["Written counseling only","Disciplinary action with 1 day unpaid suspension","Termination","5-10 days unpaid suspension"],correct:1,fb:"P&E 18.01: The point scale is: 6 points = disciplinary action with 1 DAY unpaid suspension; 7 = 2 days; 8 = 3 days; 9 = 4 days; 10 or more = 5-10 days unpaid suspension and possibly loss of extra employment for up to 120 days."},
{src:"PE",cat:"P&E: Crash Review Board",q:"P&E 18.01: An employee is on a crash probationary period and is involved in another at-fault crash. How many additional points are assessed?",opts:["1 point","2 points","3 points per prior at-fault crash during the probationary period","No additional points — the board reviews each crash independently"],correct:2,fb:"P&E 18.01: THREE POINTS for each prior at-fault crash shall be ADDED to the final score if the employee is currently on a PROBATIONARY PERIOD."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — PROMOTIONS & AWARDS
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Promotions",q:"P&E 27: The Sergeant's Written Promotional Examination consists of how many questions?",opts:["50 questions","75 questions","100 questions","25 questions"],correct:1,fb:"P&E Section 27: Corporal = 50 questions. SERGEANT = 75 QUESTIONS. The written examination is graded as part of the overall promotional eligibility process."},
{src:"PE",cat:"P&E: Promotions",q:"P&E 27: The Oral Review Board for promotions consists of how many reviewers, how many questions, and on what scale are answers evaluated?",opts:["5 reviewers, 20 questions, scored 1-10","3 reviewers and 1 moderator, 10 scenario questions, evaluated on a scale of 1 to 5","4 reviewers, 15 questions, pass/fail only","2 reviewers, 5 questions, scored 1-100"],correct:1,fb:"P&E Section 27: The Oral Review Board consists of THREE REVIEWERS and ONE MODERATOR. Reviewers present TEN SCENARIO QUESTIONS and evaluate answers on a SCALE OF 1 TO 5."},
{src:"PE",cat:"P&E: Promotions",q:"P&E 27: What TCOLE certificate earns the most points toward the promotional eligibility score?",opts:["Advanced Peace Officer — 4 points","Intermediate Peace Officer — 2 points","Master Peace Officer — 6 points","Basic Peace Officer — 2 points"],correct:2,fb:"P&E Section 27: TCOLE Certificate Points: Master Peace Officer = 6 points, Advanced Peace Officer = 4 points, Intermediate Peace Officer = 2 points, Basic Peace Officer = 0 points."},
{src:"PE",cat:"P&E: Promotions",q:"P&E 27: What is the minimum overall scoring percentage a candidate must achieve to PASS the promotional eligibility process?",opts:["60 percent","65 percent","70 percent","75 percent"],correct:2,fb:"P&E Section 27: Candidates shall be considered to have PASSED with an overall scoring percentage of 70. The TCOLE certificate point value is then added to the final score to determine the final promotional eligibility score."},
{src:"PE",cat:"P&E: Promotions",q:"P&E 27: A candidate is on the promotional eligibility list and is offered a promotion. They decline. What happens?",opts:["They remain on the list but drop to the bottom","Their name is removed from the list and they are not eligible for promotion until they successfully pass the examination process again (with Constable's discretion for exceptions)","They may decline once without consequence","They are placed on a 6-month waiting period then automatically restored"],correct:1,fb:"P&E Section 27: If a candidate declines an offered promotion, their NAME WILL BE REMOVED from the eligibility list. The employee shall not be eligible for promotion until successfully passing the examination process again. Any exception is at the Constable's discretion."},
{src:"PE",cat:"P&E: Promotions",q:"P&E 27: How long are candidates' test results available for review after the Promotional Eligibility List is posted?",opts:["7 days","14 days","30 days","Until the next promotion cycle"],correct:1,fb:"P&E Section 27: Tests will be available for review in the office of the Captain in charge of the Promotional Eligibility Process, and may be inspected by appointment for UP TO 14 DAYS after the Promotional Eligibility List is posted."},
{src:"PE",cat:"P&E: Awards",q:"P&E 25: The Medal of Honor may be awarded to:",opts:["Any department member, sworn or civilian","Only sworn members who have distinguished themselves by conspicuous gallantry and extraordinary heroism in combat with an armed adversary, fully cognizant of imminent threat to their life","Any member injured in the line of duty","Any member with 20+ years of service"],correct:1,fb:"P&E 25.06: The Medal of Honor is presented by the Constable to a SWORN MEMBER ONLY who: (A) acted voluntarily with conspicuous gallantry and extraordinary heroism; (B) was involved in combat with an armed adversary; AND (C) acted in excess of normal policing demands, fully cognizant of the imminent threat to their life."},
{src:"PE",cat:"P&E: Awards",q:"P&E 25: The Lifesaving Award may be presented to:",opts:["Sworn members only who performed CPR","A departmental member, sworn OR civilian, who rendered exceptional first aid that resulted in the documented saving of a human life","Any first responder from any agency","Only members who are EMS certified"],correct:1,fb:"P&E 25.06: The Lifesaving Award (Medal) is presented by the Constable to a departmental member, SWORN OR CIVILIAN, who rendered exceptional first aid that — because of the member's efforts — resulted in the DOCUMENTED SAVING OF A HUMAN LIFE."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — LIGHT DUTY & RESIGNATION
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Light Duty",q:"P&E 29: How long may a light duty assignment last before requiring approval from the Assistant Chief or Constable?",opts:["10 consecutive work days","20 consecutive work days","30 calendar days","60 days"],correct:1,fb:"P&E 29.03.5: Light duty is temporary and will not be extended past TWENTY CONSECUTIVE WORK DAYS without approval from the Assistant Chief or Constable, nor be made permanent."},
{src:"PE",cat:"P&E: Light Duty",q:"P&E 29: After a light duty period ends, how long must pass before an employee can be assigned light duty again?",opts:["30 days","90 days","6 months","1 year"],correct:2,fb:"P&E 29.03.4: At the end of the light duty period, the employee is NOT ELIGIBLE for light duty again until 6 MONTHS have passed."},
{src:"PE",cat:"P&E: Light Duty",q:"P&E 29: Is there a right to a light duty assignment?",opts:["Yes — any duty-related injury entitles the employee to light duty","No — there is no right to light duty; the department does not maintain regular or permanent light duty positions","Yes — the County requires light duty for all workplace injuries","Only for employees with more than 5 years of service"],correct:1,fb:"P&E 29.03.2: There is NO RIGHT to light duty work. The department does not maintain regular or permanent light duty positions but will CONSIDER placing employees in temporary positions on an 'as needed' and 'case-by-case' basis."},
{src:"PE",cat:"P&E: Resignation",q:"P&E 14.03: When is a resignation effective?",opts:["The moment a written resignation is submitted","A resignation is NOT effective until accepted by the Constable and/or his designee","After a two-week notice period expires","The day after submission"],correct:1,fb:"P&E 14.02: The Constable and/or his designee are the ONLY persons authorized to accept resignations. A resignation is NOT effective until ACCEPTED by the Constable and/or his designee."},
{src:"PE",cat:"P&E: Resignation",q:"P&E 14.03: What is the required notice period when a member submits a resignation?",opts:["1 week","2 weeks effective from the day that notice is given","30 days","No minimum — at-will employment"],correct:1,fb:"P&E 14.03: A TWO-WEEK NOTICE is required, effective from the day that notice is given. Resignations shall be submitted directly to the Constable or through proper channels in memorandum form."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — COURT APPEARANCE
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Court Appearance",q:"P&E 13.02: An officer receives a subpoena to appear in court. How does this rank in priority against a supervisor's conflicting order?",opts:["Supervisor's order takes priority","The duty to respond to all subpoenas is a FIRST PRIORITY responsibility; if a supervisor gives a conflicting order, the officer will respectfully advise the superior of the subpoena","Both are equal in priority","Court appearance is a personal matter and not subject to department policy"],correct:1,fb:"P&E 13.02: Members shall consider the duty to respond to all subpoenas as a FIRST PRIORITY responsibility. Should a superior officer give a conflicting order, the officer will respectfully advise the superior of the subpoena. Supervisors must adhere to the subpoena request."},
{src:"PE",cat:"P&E: Court Appearance",q:"P&E 13.02: An officer receives subpoenas to two equal courts on the same date and time. What must they do?",opts:["Choose whichever case they feel is more important","Notify the prosecutor of each court of the conflict; make a determination with their advice as to which case comes to trial first; place themselves on standby for the other; appear in remaining courts as soon as possible after release","Request a continuance from both courts","Notify their supervisor and let the supervisor decide"],correct:1,fb:"P&E 13.02C: When subpoenaed to more than one equal court on the same date/time: (1) Notify the prosecutor of each court of the conflict, (2) Determine with their advice which case comes to trial first, (3) Place on standby for remaining courts, (4) Appear in remaining courts as soon as possible after release."},
{src:"PE",cat:"P&E: Court Appearance",q:"P&E 13.05: What must a deputy do immediately upon making an arrest regarding court preparation?",opts:["Wait until subpoenaed before reviewing the case","Immediately read the arrestee the Miranda warning, log the time and witnesses, and immediately begin preparation for trial by reviewing notes, offense reports, video/audio tapes, and other factual evidence","Contact the DA's office for guidance before preparing","File all documents and wait for the court date"],correct:1,fb:"P&E 13.05: Whenever a deputy makes an arrest, the deputy shall IMMEDIATELY read the Miranda warning, log the time and witnesses, and IMMEDIATELY begin preparation for trial — reviewing notes, offense reports, video/audio tapes, and other factual evidence."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — EMERGENCY EQUIPMENT
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Emergency Equipment",q:"P&E 17: Which of the following is listed as a call that might be considered for use of emergency traffic/equipment?",opts:["Suspicious person call","Assist an endangered deputy/officer, shooting, major accident, pursuit of a fleeing vehicle, or any assignment where immediate threat to life or serious bodily injury exists","Any Priority 2 call","All domestic violence calls"],correct:1,fb:"P&E 17.04: The most common calls considered for emergency traffic include: (A) Assist an endangered deputy/officer, (B) Shooting, (C) Major Accident, (D) Pursuit of a fleeing vehicle, (E) Any assignment where immediate threat to life or serious bodily injury exists."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — E-MAIL & COMPUTER USE
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: Technology & Email Policy",q:"P&E 23.07: Department email messages are the records of the Department and subject to what?",opts:["Employee privacy protection","Public disclosure under the Public Information Act — all e-mail may be accessed and disclosed by the Constable without regard to content","Attorney-client privilege","HIPAA protection"],correct:1,fb:"P&E 23.07: All e-mail messages are RECORDS OF THE DEPARTMENT and are SUBJECT TO PUBLIC DISCLOSURE pursuant to the Public Information Act. The Constable reserves the right to access and disclose all messages sent over the e-mail system, without regard to content."},
{src:"PE",cat:"P&E: Technology & Email Policy",q:"P&E 23.07: How long are email messages stored on the network file server before routine deletion?",opts:["30 days","60 days","90 days","1 year"],correct:2,fb:"P&E 23.07: The department will routinely delete all e-mail messages stored on the network file server that are aged 90 DAYS or older. Employees who store email on local computers are also responsible for deletion of messages aged 90 days or older."},

// ═══════════════════════════════════════════════
// POLICY & ETHICS — ADA ACCOMMODATION
// ═══════════════════════════════════════════════
{src:"PE",cat:"P&E: ADA Accommodation",q:"P&E 24.01: A deaf person involved in a criminal investigation wants their family member to interpret for them. What should you do?",opts:["Allow it — the person has a right to choose their interpreter","Do NOT use a family member as an interpreter during a criminal investigation where they may be a complainant or suspect, except in extreme circumstances where the public may be placed in danger or a suspect may escape — advise that certified interpreters are available","Allow it only with supervisor approval","Only allow it if the family member signs an agreement"],correct:1,fb:"P&E 24.01: It is recommended that you DO NOT use a family member as an interpreter for citizens who are hearing impaired during a CRIMINAL INVESTIGATION where they may be a complainant or suspect, EXCEPT in extreme circumstances where the individual or general public may be placed in danger or a suspect may escape apprehension."},

// ═══════════════════════════════════════════════
// ORIGINAL SOP, ORB, LAW & STUDY QUESTIONS
// ═══════════════════════════════════════════════

// ── ORAL REVIEW BOARD ───────────────────────
{src:"ORB",cat:"Pursuit & Vehicle Stops",q:"You hear a deputy pursuing a vehicle matching a robbery BOLO. What is your first action as supervisor?",opts:["Authorize the pursuit indefinitely","Check speeds and traffic conditions, confirm more info from the working agency, and terminate if conditions deteriorate","Respond and take over the pursuit","Contact the DA before acting"],correct:1,fb:"Check speeds and traffic conditions, have dispatch confirm info with the working agency. If conditions deteriorate or probable cause can't be confirmed, terminate — public safety is paramount."},
{src:"ORB",cat:"Pursuit & Vehicle Stops",q:"You are en route to a major accident with SBI. A deputy says disregard — he'll work it. Life Flight is on standby. What do you do?",opts:["Disregard as the deputy suggested","Continue to the scene — it is the supervisor's job to make that call, not a deputy's","Ask dispatch to confirm before deciding","Turn around but monitor by radio"],correct:1,fb:"Advise the deputy you will continue. It is the SUPERVISOR'S job to make the determination on scene, not the deputy's. The deputy needs to secure the scene and gather information."},
{src:"ORB",cat:"Juvenile Incidents",q:"An 11-year-old student has trashed a classroom and is still out of control. No parent can be reached and juvenile probation won't accept on a Class C. What do you do?",opts:["Leave with school staff and complete a report","Restrain using least force necessary, exhaust all contact avenues for parents, issue citation for disrupting class, transport to CPS only if all avenues fail, complete offense report, pass on, notify chain of command","Immediately transport to juvenile detention","Wait at the school however long it takes"],correct:1,fb:"Get other kids out. Restrain using LEAST force necessary. Exhaust all contact avenues — house, neighbors, places of work. If all avenues fail, issue citation for disrupting class, transport to CPS, complete offense report, send pass on, notify chain of command."},
{src:"ORB",cat:"Juvenile Incidents",q:"An irate mother believes her juvenile son may be coerced into giving a statement. He is handcuffed to a chair inside. What do you do?",opts:["Allow access only after questioning is complete","Immediately allow access — parent/guardian MUST be present during ALL processing: questioning, statements, breath test, and video; then determine who denied her access and take appropriate action","Allow her to watch through glass only","Tell her to file a formal complaint"],correct:1,fb:"Parent, legal guardian, or attorney MUST be allowed present during ALL processing. After providing access, determine who denied her entry and take appropriate disciplinary action."},
{src:"ORB",cat:"Writs & Civil Process",q:"You are met by a male with a Writ of Attachment from Hidalgo County Court. What must be on the writ for it to be valid?",opts:["Only requires judge's signature and date","Must be styled 'The State of Texas,' directed to any sheriff or constable, returnable on the Monday next after 20 days from service, attested by the clerk with the court seal, and date of issuance noted","Only requires the court case number and person's name","Requires the Constable's signature of the serving county"],correct:1,fb:"The writ must be: styled 'The State of Texas,' directed to any sheriff or constable, returnable on the Monday next after expiration of 20 days from service, attested by the clerk with court seal, and date of issuance noted."},
{src:"ORB",cat:"Writs & Civil Process",q:"Two Grimes County detectives want to execute a search warrant in the County. Your corporal says it's invalid. Is the corporal correct?",opts:["No — warrants are valid statewide","Yes — they need a the County warrant; offer to assist and provide DA contact info","No — only a judge can make that call","Yes, but immediately arrest the detectives"],correct:1,fb:"The corporal is CORRECT. Advise them they need a warrant signed by a the County judge. Give them the DA's office contact. Offer assistance securing the location if appropriate."},
{src:"ORB",cat:"Peace Bonds & Protective Orders",q:"Can you make an arrest on a subject for violating a peace bond?",opts:["Yes — it functions as a protective order","No — it is a civil matter and must be referred back to the originating court","Yes — if the violation was witnessed by the deputy","Yes — but only after DA approval"],correct:1,fb:"No. A peace bond is a civil matter. The complainant must return to the originating court."},
{src:"ORB",cat:"Use of Force & Penal Code",q:"A deputy privately tells you he witnessed another deputy use excessive force on a handcuffed prisoner whose face is swollen. What do you do?",opts:["Wait for a formal complaint before acting","Secure any audio/video, personally check on the prisoner, get EMS if needed, fully investigate, notify on-duty/on-call supervisor, document in a use of force report, refer to Internal Affairs","Only document and forward to the Lieutenant","Have the reporting deputy write a statement and do nothing until IA is assigned"],correct:1,fb:"Secure audio/video. Check on the prisoner personally — get EMS if needed. Interview nearby deputies. Take photos. Notify supervisor. Document in a use of force report. Refer to Internal Affairs."},
{src:"ORB",cat:"Pursuit & Traffic",q:"Who has the authority to shut down the Toll Road (HCTRA) for Life Flight to land?",opts:["Only the County Judge","Only HCTRA's Executive Director","HCTRA Executive Director, the County Judge, or a deputy temporarily","Only the incident commander at the scene"],correct:2,fb:"HCTRA Executive Director, the County Judge, or a deputy temporarily."},
{src:"ORB",cat:"Radio & Dispatch",q:"You observe a deputy using emergency equipment while en route to a Priority 2 call. What do you do?",opts:["Let it go if the deputy gets there safely","Advise over radio to go Priority 2; let the deputy continue; meet afterward; discuss policy; advise violation not tolerated; check prior history; document","Immediately terminate the deputy's response","Contact division commander immediately"],correct:1,fb:"Advise over the air to go Priority 2. Let the deputy continue and meet him later. Discuss department policy and advise the violation will not be tolerated. Research prior history. Document accordingly."},
{src:"ORB",cat:"Supervision & Administration",q:"A deputy complains about his car share — dirty car, low fuel, always breaking down. How do you handle this?",opts:["Immediately issue written counseling to the car share","Find out if the deputy has spoken to the car share; go inspect the car yourself; coordinate with the other car share's supervisor; if complaint is valid, document after checking for prior write-ups","Transfer the deputy without investigating","Only address if there is physical evidence"],correct:1,fb:"Find out if the deputy talked to the car share. Inspect the car yourself. Coordinate with the other car share's supervisor. Hear both sides. Check for prior documentation. If complaint is valid, document accordingly."},
{src:"ORB",cat:"Scene & Investigation",q:"Dispatched to a reported suicide. You arrive to find the primary deputy gathering information. What are your responsibilities?",opts:["Simply review the deputy's report before clearing","Secure the scene; identify and separate all parties; contact Watch Command; notify supervisor; if HCSO not responding have photos taken; call ME's office; complete offense report with supplements; complete a major incident form","Only complete a major incident form and clear","Contact the DA's office immediately and wait"],correct:1,fb:"Secure the scene. Identify and separate all parties. Contact Watch Command for detectives/CSU. Notify supervisor. If HCSO not responding: have photos taken, call ME's office. Ensure offense report and supplements are completed. Complete a major incident form."},
{src:"ORB",cat:"DWI",q:"As a corporal backing up a new deputy on a DWI arrest (no accident), what forms does the deputy need?",opts:["DIC-23, DIC-24, DIC-25, DWI Statistical Form, Booking Sheet, and Valuable Property Sheet","Only DIC-23 and DIC-24","CR-3 Crash Report, DIC-23, Booking Sheet","Just the DWI Statistical Form and Booking Sheet"],correct:0,fb:"DIC-23 (Probable Cause), DIC-24 (Statutory Warning), DIC-25 (Notice of Suspension), DWI Statistical Form, Booking Sheet, and Valuable Property Sheet."},
{src:"SOP",cat:"SOP 1.002 — Holiday Leave",q:"SOP 1.002: Holiday leave requests must be submitted no less than ___ days and no more than ___ days prior to the holiday.",opts:["3 days / 14 days","5 days / 30 days","7 days / 60 days","24 hours / 14 days"],correct:1,fb:"SOP 1.002: No less than FIVE days and no more than THIRTY days prior to the holiday."},
{src:"SOP",cat:"SOP 1.005 — Substance Abuse Testing",q:"SOP 1.005: Employees are prohibited from reporting for duty with an alcohol concentration of ___ or higher.",opts:[".01",".02",".04",".08"],correct:1,fb:"SOP 1.005: Employees are prohibited from reporting for work or remaining on duty with an alcohol concentration of .02 or higher."},
{src:"SOP",cat:"SOP 1.005 — Substance Abuse Testing",q:"SOP 1.005: A reasonable-suspicion drug/alcohol test must be conducted within how many hours?",opts:["1 hour","2 hours","4 hours","8 hours"],correct:1,fb:"SOP 1.005: The test must be conducted within TWO HOURS. If not, the supervisor must document why."},
{src:"SOP",cat:"SOP 1.005 — Substance Abuse Testing",q:"SOP 1.005: An applicant tests positive for illegal drugs. How long before they may reapply?",opts:["30 days","90 days","6 months","1 year"],correct:2,fb:"SOP 1.005: Six months must elapse from the date of a confirmed positive test result before the applicant may reapply."},
{src:"SOP",cat:"SOP 1.007 — Extra Job",q:"SOP 1.007: What rank must approve an extra-job request?",opts:["Sergeant","Lieutenant","District Captain or above","Assistant Chief only"],correct:2,fb:"SOP 1.007: Any deputy requesting permission to work an extra-job must contact a staff supervisor of the rank of DISTRICT CAPTAIN or above for approval."},
{src:"SOP",cat:"SOP 1.007 — Extra Job",q:"SOP 1.007: A deputy wants to work an extra-job in plain clothes or an unmarked vehicle. What approval is required?",opts:["District Captain","Lieutenant","Assistant Chief or higher","The Constable personally"],correct:2,fb:"SOP 1.007: Must have the approval of the ASSISTANT CHIEF or other staff member of higher rank."},
{src:"SOP",cat:"SOP 1.008 — Vehicle Maintenance",q:"SOP 1.008: At what mileage interval must deputies schedule Preventive Maintenance?",opts:["3,000 miles","5,000 miles","6,000 miles","10,000 miles"],correct:2,fb:"SOP 1.008: Deputies shall schedule PM at 6,000 MILE INTERVALS."},
{src:"SOP",cat:"SOP 1.011 — Body Armor",q:"SOP 1.011: Body armor is required at all times on duty. Under which circumstance is it NOT required (as long as available)?",opts:["While in a marked patrol vehicle","During academy classes, administrative duties, or extra jobs (at direction of Divisional Assistant Chief)","Body armor is required at ALL times with no exceptions","While at the station completing reports"],correct:1,fb:"SOP 1.011: Not required during academy classes, administrative duties, and extra jobs, or at direction of the Divisional Assistant Chief — BUT must be AVAILABLE should the need arise."},
{src:"SOP",cat:"SOP 2.001 — Arrest Procedures",q:"SOP 2.001 MMDP: An offender who participates in MMDP has how many calendar days to complete the class?",opts:["30 days","60 days","90 days","180 days"],correct:2,fb:"SOP 2.001: Offenders have 90 CALENDAR DAYS. Failure results in a formal criminal charge and arrest warrant."},
{src:"SOP",cat:"SOP 2.002 — Prisoner Transport",q:"SOP 2.002: How must all prisoners be restrained prior to transport?",opts:["Hands in front, standard locked","Handcuffed (double locked) with hands behind back and palms outward","Flex-cuffed in any position","Handcuffed in front"],correct:1,fb:"SOP 2.002: All prisoners must be handcuffed DOUBLE LOCKED with hands BEHIND THEIR BACK and PALMS OUTWARD before being placed in the transport vehicle."},
{src:"SOP",cat:"SOP 2.002 — Prisoner Transport",q:"SOP 2.002: How many deputies are required to transport a dangerous prisoner?",opts:["1 if properly equipped","2 deputies","3 deputies minimum","Supervisor discretion only"],correct:1,fb:"SOP 2.002: TWO deputies are required to transport a dangerous prisoner."},
{src:"SOP",cat:"SOP 2.003 — Searches & Seizures",q:"SOP 2.003: After executing a search warrant, what must be left at the location?",opts:["Nothing — all documents go to court","A copy of the warrant and the inventory of property seized","Only the return receipt","Just the warrant"],correct:1,fb:"SOP 2.003: Leave A COPY OF THE WARRANT AND INVENTORY SEIZED at the location. Return originals to court within 72 hours."},
{src:"SOP",cat:"SOP 2.004 — Photo & Lineup ID",q:"SOP 2.004: A photo spread must contain the suspect's photo plus a minimum of how many fillers?",opts:["3","4","5","6"],correct:2,fb:"SOP 2.004: A photo spread must contain the suspect's photograph plus a MINIMUM OF FIVE FILLERS."},
{src:"SOP",cat:"SOP 2.005 — Vehicle Towing & Inventory",q:"SOP 2.005: 'Valuables' for vehicle inventory purposes means:",opts:["Any item the owner values","Cash money of any value OR items of personal property worth $100.00 or more","Only items over $500","Jewelry and electronics only"],correct:1,fb:"SOP 2.005: 'Valuables' = cash money of any value OR individual items of personal property with a value of $100.00 OR MORE."},
{src:"SOP",cat:"SOP 4.001 — Canine Use",q:"SOP 4.001: Explosive Detection canine units should NOT be used for which purpose?",opts:["Searching buildings for explosives","Searching vehicles for explosive components","Searching for narcotics OR subduing criminal suspects","Searching containers for explosive materials"],correct:2,fb:"SOP 4.001: Explosive Detection canines should NOT be used for (A) searching for narcotics, or (B) searching for or subduing criminal suspects."},
{src:"SOP",cat:"SOP 4.006 — Canine Compensation",q:"SOP 4.006: The Department compensates canine handlers for at-home care at what rate?",opts:["15 minutes/day 5 days/week","30 minutes/day 7 days/week","1 hour/day 5 days/week","45 minutes/shift only"],correct:1,fb:"SOP 4.006: 30 MINUTES PER DAY, SEVEN DAYS per week. Handlers adjust their schedule for 45 minutes per shift."},
{src:"SOP",cat:"SOP 5.003 — Dispatch Priority",q:"SOP 5.003: Which is an example of a Priority 1 call?",opts:["Motor vehicle accident","Suspicious person","Report call","Assist the officer / shooting in progress / aggravated robbery in progress"],correct:3,fb:"SOP 5.003: Priority 1 examples: Assist the Officer, shooting in progress, aggravated robbery in progress. Constantinople 4 does NOT use Priority 3."},
{src:"SOP",cat:"SOP 5.002 — Major Incident Notifications",q:"SOP 5.002: When media arrives on scene, who may authorize a statement?",opts:["The on-duty supervisor","Any deputy assigned to the scene","Only the Chief Deputy or his/her designee","The shift lieutenant"],correct:2,fb:"SOP 5.002: ONLY THE CHIEF DEPUTY OR HIS/HER DESIGNEE may authorize an interview with the media."},
{src:"SOP",cat:"SOP 7.001 — Domestic Violence",q:"SOP 7.001: When investigating family violence, which two items must be given to the victim?",opts:["Copy of offense report and shelter brochure","Victim Referral/Victim Rights Pamphlet AND Application for Magistrate's Order for Emergency Protection","Only a victim rights pamphlet","A case number and business card"],correct:1,fb:"SOP 7.001: (1) Victim Referral / Victim Rights Pamphlet, and (2) Application for Magistrate's Order for Emergency Protection."},
{src:"SOP",cat:"SOP 50.003 — Complaints",q:"SOP 50.003: All complaints must be entered into the complaint tracking system by when?",opts:["Within 24 hours","By the end of the receiving supervisor's shift on the day received","Within 48 hours","By the next business day"],correct:1,fb:"SOP 50.003: All complaints will be entered by the END OF THE RECEIVING SUPERVISOR'S SHIFT on the day received."},
{src:"SOP",cat:"SOP 50.008 — Employment & Hiring",q:"SOP 50.008: The peace officer candidate must run 1.5 miles within what time?",opts:["14 minutes","15 minutes","16.5 minutes","18 minutes"],correct:2,fb:"SOP 50.008: Must run 1.5 miles in 16.5 MINUTES. Two attempts given; failure on second = 6-month wait."},
{src:"LAW",cat:"Texas Law — Search Warrants",q:"CCP 18.04 & 18.07: How many elements must a Search Warrant contain and how long is it valid?",opts:["3 elements — 48 hours","4 elements — 3 whole days exclusive of date of issuance AND date of execution","5 elements — 72 hours total","4 elements — 7 calendar days"],correct:1,fb:"4 elements: (1) Styled in State of Texas, (2) Identifies person/place/thing, (3) Commands a peace officer in the proper county, (4) Dated and signed by a Magistrate. Valid for 3 WHOLE DAYS exclusive of date of issuance AND day of execution."},
{src:"LAW",cat:"Texas Law — Penal Code",q:"Chapter 9 of the Texas Penal Code is known as the ___ chapter?",opts:["Deadly Force","Self Force","Use of Force","Protection"],correct:2,fb:"Chapter 9 = USE OF FORCE. It covers justification for use of force and deadly force."},
{src:"LAW",cat:"Texas Law — Penal Code",q:"Killing a peace officer in the lawful discharge of duty, knowing they are a peace officer, constitutes what offense?",opts:["Aggravated Assault","Murder","Capital Murder","Voluntary Manslaughter"],correct:2,fb:"Capital Murder — one of the specific circumstances elevating murder to Capital Murder under the Texas Penal Code."},
{src:"LAW",cat:"Texas Law — Protective Orders",q:"An Emergency Protective Order is usually 61 days. When does the maximum extend to 91 days?",opts:["When the victim has children","When the defendant has prior convictions","When a deadly weapon was displayed or used","When the offense occurred in front of a child"],correct:2,fb:"If a DEADLY WEAPON was displayed or used, the maximum EPO duration is 91 days."},
{src:"LAW",cat:"Texas Law — Eviction",q:"The eviction process in Texas has how many steps?",opts:["2","3","4","5"],correct:1,fb:"3 steps: (1) Written 3-day demand letter. (2) File Forcible Entry & Detainer with the JP. (3) Hearing — if judge rules for landlord, Writ of Possession valid 5 days after ruling."},
{src:"LAW",cat:"Texas Law — Medical Consent",q:"In Texas, what is the minimum age to consent to your own medical treatment?",opts:["14","15","16","18"],correct:2,fb:"16 years of age. No consent is required in a true emergency, regardless of age."},
